  e2e-smoke-ios:
    name: E2E Smoke Tests (iOS)
    working_directory: mobile
    # Two green runs measured 12 min and 15m42s end to end (builds 6a7bb0d4
    # and 6a7d30c1); the spread is cache warmth. 25 covers the slower one with
    # room to spare while still stopping a hung Maestro driver from billing the
    # hour the previous 60 allowed — a hang is what 60 actually cost us
    # (build 6a7d2a83).
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      flutter: 3.44.9
      # Pinned alongside MAESTRO_VERSION. The compatibility contract has two
      # sides: 2.1.0 cannot drive Xcode 26.x, and `latest` floating means a
      # Codemagic image bump can break the suite with no commit on our side —
      # the exact failure the Maestro pin exists to prevent. 26.4 is the image
      # the 2.8.0 pairing was verified green on. Release build workflows still
      # use `xcode: latest`; this gate freezes the Maestro-driver contract, not
      # the shipping toolchain.
      xcode: 26.4
      cocoapods: default
      groups:
        - zendesk_credentials
        - proofmode_credentials
      vars:
        DEFAULT_ENV: STAGING
        BUNDLE_ID: co.openvine.app.staging
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.pub-cache
    triggering:
      # Configured for PRs to main, but #7504 tracks the inactive webhook that
      # currently prevents automatic builds. NOT a required check: per team
      # decision it stays non-blocking until a flake baseline exists (target
      # ≥30 runs at ≥95%). #7204 records the fixed 3m31s Explore hierarchy
      # stall; restoring the affected flows is tracked by #7619 and #7620.
      #
      # If PR builds do not fire after merge, check the GitHub webhook for the
      # Codemagic app before touching this YAML — a misconfigured webhook
      # presents exactly like a YAML mistake.
      events:
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: false
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - mobile/
    scripts:
      - *check_signing_endpoint
      - *check_supporters_config
      - *clean_ios_workspace_state
      - *enable_spm
      - *flutter_pub_get
      - *prepare_ios_spm_packages
      - *pod_install
      - *build_ios_e2e
      - *install_maestro
      - *boot_ios_simulator
      - *install_app_ios_simulator
      - *run_maestro_smoke_tests
    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - /tmp/xcodebuild_logs/*.log
      - report.xml
      # Per-step screenshots, screen-hierarchy JSON and maestro.log — richer
      # for triage than the JUnit. device-simulator.log is excluded: it is
      # ~153 MB per flow and swamps the artifact bundle.
      - ~/.maestro/tests/**/screenshots/**
      - ~/.maestro/tests/**/screen-hierarchy/**
      - ~/.maestro/tests/**/logs/maestro.log
      - ~/.maestro/tests/**/commands.json

  perf-feed-ttff:
    name: Feed Time to First Frame (Android)
    working_directory: mobile
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.44.9
      java: 17
      groups:
        - github_credentials
      vars:
        THROTTLE_RATE: 625k
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.pub-cache
    triggering:
      # Manual while #7504 tracks the Codemagic GitHub app's missing event
      # subscriptions. The mobile playback team owns this budget and lane.
      events: []
    scripts:
      - *flutter_pub_get
      - *setup_local_properties
      - *launch_android_emulator
      - name: Run feed TTFF budget twice on failure
        script: |
          set -euo pipefail
          if [ -z "${GHCR_PULL_TOKEN:-}" ] || \
             [ -z "${GHCR_PULL_USERNAME:-}" ]; then
            echo "ERROR: github_credentials must provide GHCR pull credentials" >&2
            exit 1
          fi
          printf '%s' "$GHCR_PULL_TOKEN" | docker login ghcr.io \
            --username "$GHCR_PULL_USERNAME" --password-stdin
          cleanup() {
            docker compose -f ../local_stack/docker-compose.yml down -v || true
          }
          trap cleanup EXIT
          bash ../local_stack/up.sh --pull=missing
          set +e
          bash ../local_stack/profile.sh \
            integration_test/perf/feed_ttff_test.dart
          first_exit=$?
          if [ "$first_exit" -eq 0 ]; then
            exit 0
          fi
          echo "First feed TTFF run failed; repeating once for variance policy" >&2
          bash ../local_stack/profile.sh \
            integration_test/perf/feed_ttff_test.dart
          second_exit=$?
          set -e
          exit "$second_exit"
    artifacts:
      - test_reports/*.jsonl
      - build/app/reports/androidTests/**
      - build/app/outputs/androidTest-results/**

