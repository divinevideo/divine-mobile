# ABOUTME: Codemagic CI/CD configuration for Divine mobile app builds.
# ABOUTME: Store builds are manual. e2e-smoke-ios is configured for mobile PRs.

# Steps to setup:
# 1 - Create the Codemagic project with access to the repository.
# 2 - Setup iOS publishing:
#   2.1 - https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/#:~:text=Creating%20the%20App%20Store%20Connect%20API%20key
#   2.2 - Every iOS app-extension target needs its own App Store provisioning
#         profile in Codemagic Code signing identities. Keep
#         IOS_EXTENSION_BUNDLE_IDS in sync with the Xcode app-extension targets.
# 3 - Setup Android publishing:
#   3.1 - Code signing: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/#:~:text=Generating%20a%20keystore
#   3.2 - Connect to Google Play: https://docs.codemagic.io/yaml-publishing/google-play/
# 4 - Setup emails to receive build notifications.
# 5 - Create environment variable group "zendesk_credentials" with:
#   - ZENDESK_APP_ID
#   - ZENDESK_CLIENT_ID
#   - ZENDESK_URL
# 6 - DEFAULT_ENV is configured via build inputs (dropdown) when starting a build
#   - Options: PRODUCTION, STAGING, POC
#   - Defaults to PRODUCTION for automatic builds
# 7 - Create environment variable group "proofmode_credentials" with:
#   - PROOFMODE_SIGNING_SERVER_ENDPOINT
#   - PROOFMODE_SIGNING_SERVER_TOKEN
# 8 - PUBLISH_TO_GITHUB is configured via build inputs (dropdown) when starting builds
#   - Set to YES to upload artifacts to a GitHub Release (for Zapstore / direct distribution)
#   - Defaults to NO
#   - Requires GITHUB_TOKEN in "github_credentials" environment variable group
#   - Feed TTFF additionally requires GHCR_PULL_TOKEN (read:packages PAT) and
#     GHCR_PULL_USERNAME in the same group for private local-stack images
# 9 - Android publishing reads the service account from environment variable
#     group "google_play_credentials":
#   - GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
# 10 - Create environment variable group "shorebird_credentials" with:
#   - SHOREBIRD_TOKEN (mark as secure) — an API key from the Shorebird
#     console under Account > API Keys. `shorebird login:ci` is removed;
#     CI authenticates with API keys only.
#   - SHOREBIRD_PATCH_PUBLIC_KEY (public PEM used by `shorebird release` and
#     `shorebird patch`)
#   - SHOREBIRD_PATCH_PRIVATE_KEY (secure private PEM used by `shorebird patch`)
#   - SHOREBIRD_PROVENANCE_HMAC_KEY (secure random value used only to compare
#     release and patch configuration without storing or logging its values)
#   - SHOREBIRD_PROVENANCE_HMAC_KEY_ID (non-secret identifier for that key;
#     retain old keys while any release fingerprinted with them is patchable)
#     Store each PEM as a single-line value whose newlines are written as
#     literal `\n` sequences. The CI step validates the decoded PEM envelope.
#   The key must belong to an account with access to the app_id in
#   mobile/shorebird.yaml, which lives in the Divine organization.
#
# Every group named under a workflow's `groups:` key must appear in this
# checklist. Codemagic validates this whole file before it provisions a machine,
# so naming a group that does not exist fails *every* workflow here — not only
# the one that needs it — and no in-script guard can catch it, because no script
# runs. That took the pipeline down for ~21 hours (#7203). The invariant is
# enforced by mobile/scripts/check_codemagic_groups.sh.

definitions:
  environment:
    emails: &emails
      - TODO
  scripts:
    - &setup_code_signing_xcode
      name: Set up code signing settings on Xcode project
      script: xcode-project use-profiles
    - &check_ios_extension_signing_contract
      name: Check iOS extension signing contract
      script: ./scripts/check_ios_extension_signing_contract.sh
    - &check_supporters_config
      name: Check supporter subscription config
      script: |
        # Both variables below are interpolated unconditionally by every build
        # step, so an unset one ships an empty --dart-define that overrides the
        # in-app default. Empty fails safe here but fails silently; this rejects
        # the combination that ships broken (flag on, no server).
        ./scripts/check_supporters_config.sh
    - &check_signing_endpoint
      name: Check C2PA signing endpoint
      script: |
        # Every build step below interpolates this variable unconditionally, so
        # an unset variable ships an empty --dart-define that overrides the
        # in-app default and breaks signing on every capture. Require it here.
        REQUIRE_SIGNING_ENDPOINT=1 ./scripts/check_signing_endpoint.sh
    - &check_coordinator_route
      name: Check account-deletion coordinator route
      script: |
        flutter pub get
        DEFAULT_ENV="${{ inputs.DEFAULT_ENV }}" \
          ./scripts/check_coordinator_route_serving.sh
    - &clean_ios_workspace_state
      name: Clean stale Xcode/SPM workspace state
      script: |
        # Xcode 16 + Flutter SPM workspaces occasionally crash the
        # archive step with `INTERNAL ERROR: Unable to load workspace
        # 'Runner.xcworkspace'` and `count of array (N) differs from
        # count of index set (N-1)` from IDESwiftPackageCore. The
        # cause is an out-of-sync swiftpm workspace-state.json from a
        # prior step in the same build. Wiping DerivedData and the
        # workspace's swiftpm/xcuserdata state forces a fresh resolve.
        rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
        rm -rf ios/Pods ios/.symlinks
        rm -rf ios/Runner.xcworkspace/xcuserdata
        rm -rf ios/Runner.xcworkspace/xcshareddata/swiftpm
    - &install_flutterfire
      name: Install FlutterFire CLI
      script: dart pub global activate flutterfire_cli
    - &enable_spm
      name: Enable Swift Package Manager
      script: flutter config --enable-swift-package-manager
    - &prepare_ios_spm_packages
      name: Prepare iOS Swift package deployment targets
      script: |
        flutter build ios --config-only

        ruby <<'RUBY'
        files = [
          'ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift',
          'ios/Flutter/ephemeral/Packages/.packages/FlutterFramework/Package.swift',
        ]

        files.each do |path|
          contents = File.read(path)
          updated = contents
            .gsub('.iOS("13.0")', '.iOS("16.0")')
            .gsub('.iOS(.v13)', '.iOS("16.0")')
          has_ios_16_target = updated.match?(/\.iOS\(("16\.0"|\.v16)\)/)

          unless has_ios_16_target
            if updated.match?(/^\s*platforms:\s*\[/)
              abort("expected #{path} platforms block to declare iOS 16.0")
            end

            updated = updated.sub(
              /(let package = Package\(\n\s*name: "[^"]+",\n)/,
              "\\1    platforms: [\n        .iOS(\"16.0\")\n    ],\n",
            )
            has_ios_16_target = updated.match?(/\.iOS\(("16\.0"|\.v16)\)/)
          end

          unless has_ios_16_target
            abort("expected #{path} to declare iOS 16.0")
          end

          if updated != contents
            File.write(path, updated)
            puts "patched #{path} to iOS 16.0"
          else
            puts "#{path} already targets iOS 16.0"
          end
        end
        RUBY
    - &flutter_pub_get
      name: Get Flutter dependencies
      script: flutter pub get
    - &pod_install
      name: Run pod install
      script: cd ios && pod install
    - &precache_shorebird_android_artifacts
      name: Precache Shorebird Android engine artifacts
      script: |
        set -euo pipefail
        # Shorebird ships its own Flutter and precaches only what the host
        # needs, which on a macOS runner is iOS and desktop. Both Android
        # workflows build through that Flutter, so without this they fail with
        # "Flutter debug embedding JAR not found ... Run 'flutter precache
        # --android'". shorebird_install also rm -rf's ~/.shorebird on any pin
        # change, discarding whatever an earlier run precached, so this cannot
        # be a one-time setup step. See #7987.
        FLUTTER_REVISION=$(shorebird --version 2>/dev/null \
          | sed -n 's/^Flutter .* revision \([0-9a-f]\{40\}\).*/\1/p')
        if [ -z "$FLUTTER_REVISION" ]; then
          echo "ERROR: could not read the Shorebird Flutter revision from 'shorebird --version'."
          exit 1
        fi
        SHOREBIRD_FLUTTER="$HOME/.shorebird/bin/cache/flutter/$FLUTTER_REVISION/bin/flutter"
        if [ ! -x "$SHOREBIRD_FLUTTER" ]; then
          echo "ERROR: Shorebird Flutter not found at $SHOREBIRD_FLUTTER"
          exit 1
        fi
        "$SHOREBIRD_FLUTTER" precache --android
    - &setup_local_properties
      name: Set up local.properties
      script: echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/mobile/android/local.properties"
    - &configure_gradle_memory
      name: Configure Gradle JVM memory
      script: |
        # Codemagic does NOT honor org.gradle.jvmargs from the project
        # gradle.properties (its GRADLE_USER_HOME gradle.properties takes
        # precedence), so the release build's L8/dex step has been OOMing at
        # Codemagic's small default heap regardless of what the project file
        # says. Set the daemon heap where Gradle actually reads it. Sized for
        # the 16 GB mac_mini_m4, shared with the Kotlin and Dart JVMs; values
        # appended last win over any Codemagic default in the same file.
        GRADLE_HOME="${GRADLE_USER_HOME:-$HOME/.gradle}"
        mkdir -p "$GRADLE_HOME"
        {
          echo "org.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=2g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError"
          echo "kotlin.daemon.jvmargs=-Xmx2g"
          echo "org.gradle.workers.max=4"
        } >> "$GRADLE_HOME/gradle.properties"
        echo "Effective $GRADLE_HOME/gradle.properties:"
        cat "$GRADLE_HOME/gradle.properties"
    - &shorebird_install
      name: Install Shorebird
      script: |
        set -euo pipefail
        SHOREBIRD_BIN="$HOME/.shorebird/bin/shorebird"
        EXPECTED_SHOREBIRD_VERSION="Shorebird 1.6.117"
        EXPECTED_SHOREBIRD_REVISION="45facdd4e4b3c39e0d260107977584f0b7c66bec"
        SHOREBIRD_VERSION_OUTPUT=""
        SHOREBIRD_REVISION=""
        if [ -x "$SHOREBIRD_BIN" ]; then
          SHOREBIRD_VERSION_OUTPUT=$("$SHOREBIRD_BIN" --version 2>/dev/null || true)
          SHOREBIRD_REVISION=$(git -C "$HOME/.shorebird" rev-parse HEAD 2>/dev/null || true)
        fi
        if ! printf '%s\n' "$SHOREBIRD_VERSION_OUTPUT" | grep -Fq "$EXPECTED_SHOREBIRD_VERSION" || \
           [ "$SHOREBIRD_REVISION" != "$EXPECTED_SHOREBIRD_REVISION" ]; then
          # The upstream installer executes the mutable `stable` branch, so
          # install the same checkout layout from the reviewed CLI commit.
          rm -rf "$HOME/.shorebird"
          git init --quiet "$HOME/.shorebird"
          git -C "$HOME/.shorebird" remote add origin https://github.com/shorebirdtech/shorebird.git
          git -C "$HOME/.shorebird" fetch --quiet --depth 1 origin "$EXPECTED_SHOREBIRD_REVISION"
          git -C "$HOME/.shorebird" checkout --quiet --detach FETCH_HEAD
          SHOREBIRD_VERSION_OUTPUT=$("$SHOREBIRD_BIN" --version)
          SHOREBIRD_REVISION=$(git -C "$HOME/.shorebird" rev-parse HEAD)
        fi
        echo PATH="$HOME/.shorebird/bin:$PATH" >> $CM_ENV
        echo "$SHOREBIRD_VERSION_OUTPUT"
        if ! printf '%s\n' "$SHOREBIRD_VERSION_OUTPUT" | grep -Fq "$EXPECTED_SHOREBIRD_VERSION"; then
          echo "ERROR: expected $EXPECTED_SHOREBIRD_VERSION; update and validate the pinned version before continuing."
          exit 1
        fi
        if [ "$SHOREBIRD_REVISION" != "$EXPECTED_SHOREBIRD_REVISION" ]; then
          echo "ERROR: Shorebird checkout does not match the reviewed revision."
          exit 1
        fi
    - &verify_shorebird_release_source
      name: Verify Shorebird release source
      script: |
        set -euo pipefail
        if [ "$CM_BRANCH" != "main" ]; then
          echo "Refusing to create a store release from branch '$CM_BRANCH'."
          echo "Shorebird releases must be cut from main so future patches have a reachable baseline."
          exit 1
        fi
    - &write_shorebird_dart_defines
      name: Write Shorebird dart-defines
      script: |
        mkdir -p build/shorebird
        DEFAULT_ENV="${{ inputs.DEFAULT_ENV }}" ruby <<'RUBY'
        require 'json'

        required_names = %w[
          ZENDESK_APP_ID
          ZENDESK_CLIENT_ID
          ZENDESK_URL
          PROOFMODE_SIGNING_SERVER_ENDPOINT
          PROOFMODE_SIGNING_SERVER_TOKEN
        ]

        optional_names = %w[
          SUPPORTERS_API_BASE_URL
          FF_DIVINE_SUPPORTERS
        ]

        missing = required_names.reject { |name| ENV.key?(name) && !ENV.fetch(name).empty? }
        unless missing.empty?
          abort("missing Shorebird dart-define environment variables: #{missing.join(', ')}")
        end

        defines = required_names.to_h { |name| [name, ENV.fetch(name)] }
        optional_names.each do |name|
          defines[name] = ENV.fetch(name, '')
        end
        defines['DEFAULT_ENV'] = ENV.fetch('DEFAULT_ENV')

        File.write(
          'build/shorebird/dart_defines.json',
          JSON.pretty_generate(defines) + "\n",
        )
        File.chmod(0o600, 'build/shorebird/dart_defines.json')
        RUBY
    - &write_shorebird_public_key
      name: Write Shorebird patch public key
      script: |
        mkdir -p build/shorebird
        ruby <<'RUBY'
        keys = {
          'SHOREBIRD_PATCH_PUBLIC_KEY' => 'build/shorebird/patch_public_key.pem',
        }

        missing = keys.keys.reject { |name| ENV.key?(name) && !ENV.fetch(name).empty? }
        unless missing.empty?
          abort("missing Shorebird patch signing variables: #{missing.join(', ')}")
        end

        keys.each do |name, path|
          pem = ENV.fetch(name).gsub('\\n', "\n")
          unless pem.match?(/\A-----BEGIN PUBLIC KEY-----\n.+\n-----END PUBLIC KEY-----\n?\z/m)
            abort("invalid PEM encoding for #{name}; use literal \\n sequences")
          end
          File.write(path, pem)
          File.chmod(0o644, path)
        end
        RUBY
    - &emit_shorebird_provenance
      name: Record private Shorebird release provenance
      script: |
        set -euo pipefail
        . "build/shorebird/${SHOREBIRD_PLATFORM}_release.env"
        SOURCE_COMMIT=$(git rev-parse HEAD)
        SHOREBIRD_CLI_VERSION=$("$HOME/.shorebird/bin/shorebird" --version | head -1)
        SHOREBIRD_REVISION=$(git -C "$HOME/.shorebird" rev-parse HEAD)
        PROVENANCE_PATH="build/shorebird/${SHOREBIRD_PLATFORM}_provenance.json"
        ruby scripts/shorebird_provenance.rb emit \
          --platform "$SHOREBIRD_PLATFORM" \
          --release-version "$SHOREBIRD_RELEASE_VERSION" \
          --source-commit "$SOURCE_COMMIT" \
          --patch-baseline-commit "$SOURCE_COMMIT" \
          --flutter-version "$FLUTTER_VERSION" \
          --shorebird-cli-version "$SHOREBIRD_CLI_VERSION" \
          --shorebird-cli-revision "$SHOREBIRD_REVISION" \
          --defines build/shorebird/dart_defines.json \
          --output "$PROVENANCE_PATH"
        bash scripts/shorebird_provenance_store.sh create \
          "$SHOREBIRD_PLATFORM" "$SHOREBIRD_RELEASE_VERSION" "$PROVENANCE_PATH"
    - &fetch_and_verify_shorebird_provenance
      name: Verify private Shorebird release provenance
      script: |
        set -euo pipefail
        mkdir -p build/shorebird
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --quiet --unshallow origin main
        else
          git fetch --quiet origin main
        fi
        PROVENANCE_PATH="build/shorebird/${SHOREBIRD_PLATFORM}_provenance.json"
        SHOREBIRD_CLI_VERSION=$("$HOME/.shorebird/bin/shorebird" --version | head -1)
        SHOREBIRD_REVISION=$(git -C "$HOME/.shorebird" rev-parse HEAD)
        bash scripts/shorebird_provenance_store.sh fetch \
          "$SHOREBIRD_PLATFORM" "${{ inputs.RELEASE_VERSION }}" "$PROVENANCE_PATH"
        ruby scripts/shorebird_provenance.rb verify \
          --platform "$SHOREBIRD_PLATFORM" \
          --release-version "${{ inputs.RELEASE_VERSION }}" \
          --flutter-version "$FLUTTER_VERSION" \
          --shorebird-cli-version "$SHOREBIRD_CLI_VERSION" \
          --shorebird-cli-revision "$SHOREBIRD_REVISION" \
          --release-commit "${{ inputs.RELEASE_COMMIT }}" \
          --defines build/shorebird/dart_defines.json \
          --record "$PROVENANCE_PATH" \
          --env-output build/shorebird/patch_source.env
    - &write_shorebird_private_key
      name: Write Shorebird patch private key
      script: |
        mkdir -p build/shorebird
        ruby <<'RUBY'
        name = 'SHOREBIRD_PATCH_PRIVATE_KEY'
        path = 'build/shorebird/patch_private_key.pem'
        unless ENV.key?(name) && !ENV.fetch(name).empty?
          abort("missing Shorebird patch signing variable: #{name}")
        end
        pem = ENV.fetch(name).gsub('\\n', "\n")
        unless pem.match?(/\A-----BEGIN (?:EC |RSA )?PRIVATE KEY-----\n.+\n-----END (?:EC |RSA )?PRIVATE KEY-----\n?\z/m)
          abort("invalid PEM encoding for #{name}; use literal \\n sequences")
        end
        File.write(path, pem)
        File.chmod(0o600, path)
        RUBY
    - &prepare_patch_source
      name: Verify patch source
      script: |
        set -euo pipefail
        if [ "$CM_BRANCH" != "main" ]; then
          echo "Refusing to load the patch workflow from branch '$CM_BRANCH'."
          echo "Start the manual workflow on main; PATCH_BRANCH selects the isolated release source."
          exit 1
        fi
        . build/shorebird/patch_source.env
        cp scripts/shorebird_patch_source.rb build/shorebird/shorebird_patch_source.rb
        ruby build/shorebird/shorebird_patch_source.rb \
          --baseline "$SHOREBIRD_PATCH_BASELINE_COMMIT" \
          --platform "$SHOREBIRD_PLATFORM" \
          --release-version "${{ inputs.RELEASE_VERSION }}" \
          --branch "${{ inputs.PATCH_BRANCH }}" \
          --identity-only
        git fetch --quiet origin \
          "refs/heads/${{ inputs.PATCH_BRANCH }}:refs/remotes/origin/${{ inputs.PATCH_BRANCH }}"
        git fetch --quiet origin \
          "refs/heads/main:refs/remotes/origin/main"
        git checkout --detach "refs/remotes/origin/${{ inputs.PATCH_BRANCH }}"
        ruby build/shorebird/shorebird_patch_source.rb \
          --baseline "$SHOREBIRD_PATCH_BASELINE_COMMIT" \
          --platform "$SHOREBIRD_PLATFORM" \
          --release-version "${{ inputs.RELEASE_VERSION }}" \
          --branch "${{ inputs.PATCH_BRANCH }}"
    - &preflight_shorebird_android_release
      name: Preflight Android Shorebird release
      script: |
        BUILD_NAME=$(ruby -ne 'if $_ =~ /^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+/; puts $1; exit; end' pubspec.yaml)
        if [ -z "$BUILD_NAME" ]; then
          echo "ERROR: could not read build name from pubspec.yaml version."
          exit 1
        fi
        LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "co.openvine.app" 2>/dev/null || true)
        BUILD_NUMBER=$PROJECT_BUILD_NUMBER
        case "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" in
          ''|*[!0-9]*)
            ;;
          *)
            NEXT_PLAY_BUILD_NUMBER=$((LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
            if [ "$NEXT_PLAY_BUILD_NUMBER" -gt "$BUILD_NUMBER" ]; then
              BUILD_NUMBER=$NEXT_PLAY_BUILD_NUMBER
            fi
            ;;
        esac
        RELEASE_VERSION="$BUILD_NAME+$BUILD_NUMBER"
        {
          echo "SHOREBIRD_BUILD_NAME=$BUILD_NAME"
          echo "SHOREBIRD_BUILD_NUMBER=$BUILD_NUMBER"
          echo "SHOREBIRD_RELEASE_VERSION=$RELEASE_VERSION"
        } > build/shorebird/android_release.env
        echo "Android Shorebird release version: $RELEASE_VERSION"
        if ! shorebird releases list --platform=android --json > build/shorebird/release_info.json 2> build/shorebird/release_info.err; then
          echo "ERROR: could not list existing Shorebird releases."
          if [ -s build/shorebird/release_info.err ]; then
            sed 's/^/stderr: /' build/shorebird/release_info.err
          fi
          if [ -s build/shorebird/release_info.json ]; then
            sed 's/^/stdout: /' build/shorebird/release_info.json
          fi
          exit 1
        fi
        ruby scripts/shorebird_release_preflight.rb build/shorebird/release_info.json android "$RELEASE_VERSION"
    - &preflight_shorebird_ios_release
      name: Preflight iOS Shorebird release
      script: |
        set -euo pipefail
        BUILD_NAME=$(ruby -ne 'if $_ =~ /^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+/; puts $1; exit; end' pubspec.yaml)
        if [ -z "$BUILD_NAME" ]; then
          echo "ERROR: could not read build name from pubspec.yaml version."
          exit 1
        fi
        APP_STORE_APP_ID=6747959501 # co.openvine.app
        ASC_LOOKUP_LOG=$(mktemp)
        ASC_STORE_VERSION_JSON=$(mktemp)
        trap 'rm -f "$ASC_LOOKUP_LOG" "$ASC_STORE_VERSION_JSON"' EXIT
        if ! app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" \
          --platform=IOS --include-version --json > "$ASC_STORE_VERSION_JSON" 2>"$ASC_LOOKUP_LOG"; then
          echo "ERROR: could not read the latest approved App Store version."
          if [ -s "$ASC_LOOKUP_LOG" ]; then
            echo "       App Store Connect lookup output:"
            sed 's/^/       /' "$ASC_LOOKUP_LOG"
          fi
          echo "       Refusing to create a Shorebird release that Apple may reject after the build."
          exit 1
        fi
        ruby scripts/ios_store_version_preflight.rb "$ASC_STORE_VERSION_JSON" "$BUILD_NAME"
        : > "$ASC_LOOKUP_LOG"
        if ! LATEST_IOS_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APP_ID" 2>"$ASC_LOOKUP_LOG"); then
          LATEST_IOS_BUILD_NUMBER=
        fi
        case "$LATEST_IOS_BUILD_NUMBER" in
          ''|*[!0-9]*)
            echo "ERROR: could not read the latest App Store Connect build number."
            if [ -s "$ASC_LOOKUP_LOG" ]; then
              echo "       App Store Connect lookup output:"
              sed 's/^/       /' "$ASC_LOOKUP_LOG"
            fi
            echo "       Refusing to guess a build number Apple may reject after upload."
            exit 1
            ;;
          *)
            BUILD_NUMBER=$((LATEST_IOS_BUILD_NUMBER + 1))
            ;;
        esac
        RELEASE_VERSION="$BUILD_NAME+$BUILD_NUMBER"
        {
          echo "SHOREBIRD_BUILD_NAME=$BUILD_NAME"
          echo "SHOREBIRD_BUILD_NUMBER=$BUILD_NUMBER"
          echo "SHOREBIRD_RELEASE_VERSION=$RELEASE_VERSION"
        } > build/shorebird/ios_release.env
        echo "iOS Shorebird release version: $RELEASE_VERSION"
        if ! shorebird releases list --platform=ios --json > build/shorebird/release_info.json 2> build/shorebird/release_info.err; then
          echo "ERROR: could not list existing Shorebird releases."
          if [ -s build/shorebird/release_info.err ]; then
            sed 's/^/stderr: /' build/shorebird/release_info.err
          fi
          if [ -s build/shorebird/release_info.json ]; then
            sed 's/^/stdout: /' build/shorebird/release_info.json
          fi
          exit 1
        fi
        ruby scripts/shorebird_release_preflight.rb build/shorebird/release_info.json ios "$RELEASE_VERSION"
    - &build_apk
      name: Build Android APK
      script: |
        # Deliberately NOT a Shorebird release. Shorebird has no
        # --split-per-abi; its Android artifact is either an AAB or one
        # universal APK. These per-ABI APKs go to Zapstore / direct download,
        # so those installs are not patchable. Play (the AAB below) is.
        flutter build apk --release --split-per-abi --build-number=$PROJECT_BUILD_NUMBER \
          --dart-define-from-file=build/shorebird/dart_defines.json
    - &build_aab
      name: Build Android AAB (Shorebird release)
      script: |
        set -euo pipefail
        # Use the latest Play versionCode as the primary source of truth.
        . build/shorebird/android_release.env
        BUILD_NAME=$SHOREBIRD_BUILD_NAME
        BUILD_NUMBER=$SHOREBIRD_BUILD_NUMBER
        echo "Android build number: $BUILD_NUMBER (release: $SHOREBIRD_RELEASE_VERSION)"
        # Shorebird wraps `flutter build appbundle` with its own engine so the
        # release carries the updater. A plain `flutter build` here would ship
        # a permanently unpatchable version to Play.
        shorebird release android --flutter-version=$FLUTTER_VERSION --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER \
          --dart-define-from-file=build/shorebird/dart_defines.json \
          --public-key-path=build/shorebird/patch_public_key.pem
    - &confirm_patch
      name: Confirm patch to production
      script: |
        # Runs first so a mis-clicked workflow fails in seconds rather than
        # after pod install / Gradle setup.
        if [ "${{ inputs.CONFIRM_PATCH }}" != "YES" ]; then
          echo "Refusing to patch: CONFIRM_PATCH is '${{ inputs.CONFIRM_PATCH }}', expected YES."
          echo
          echo "A patch reaches every install of release ${{ inputs.RELEASE_VERSION }}"
          echo "within about one app launch, including App Store and Play"
          echo "production users. There is no store review; rollback exists but"
          echo "is an emergency mitigation, not a substitute for validation."
          echo
          echo "Re-run with CONFIRM_PATCH=YES if that is what you intend."
          exit 1
        fi
        if ! printf '%s\n' "${{ inputs.RELEASE_VERSION }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$'; then
          echo "Refusing to patch: RELEASE_VERSION must look like 1.0.9+247."
          echo "Got: '${{ inputs.RELEASE_VERSION }}'"
          exit 1
        fi
        echo "Patching release ${{ inputs.RELEASE_VERSION }} with DEFAULT_ENV=${{ inputs.DEFAULT_ENV }}."
    - &patch_android
      name: Patch Android (Shorebird)
      script: |
        # No --flutter-version: a patch is compiled against the Flutter version
        # its release was built with, which Shorebird resolves from the release.
        # The dart-defines must match the release's or the patch changes app
        # behaviour beyond the code fix. Shorebird refuses to patch when it
        # detects native or asset diffs; do NOT add --allow-native-diffs or
        # --allow-asset-diffs to force past that — cut a new release instead.
        # Signing needs both halves. The private key signs the patch; the
        # public key goes into the build env as SHOREBIRD_PUBLIC_KEY, the
        # same way `shorebird release` passes it, and verifies the signature
        # just produced against itself. Nothing here checks it against the
        # release's own key, so a rotated key builds green and the patch is
        # rejected at boot on device. Passing only one fails with "Both
        # public and private keys must be provided."
        shorebird patch android --release-version=${{ inputs.RELEASE_VERSION }} --track=staging \
          --dart-define-from-file=build/shorebird/dart_defines.json \
          --public-key-path=build/shorebird/patch_public_key.pem \
          --private-key-path=build/shorebird/patch_private_key.pem
    - &build_macos
      name: Build macOS app
      script: |
        # This workflow packages a DMG for direct download. It does not provision
        # a macOS signing identity/profile in Codemagic, so disable signing for
        # the CI build and handle signing/notarization separately when needed.
        env CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO flutter build macos --release \
          --dart-define=ZENDESK_APP_ID=$ZENDESK_APP_ID \
          --dart-define=ZENDESK_CLIENT_ID=$ZENDESK_CLIENT_ID \
          --dart-define=ZENDESK_URL=$ZENDESK_URL \
          --dart-define=DEFAULT_ENV=${{ inputs.DEFAULT_ENV }} \
          --dart-define=PROOFMODE_SIGNING_SERVER_ENDPOINT=$PROOFMODE_SIGNING_SERVER_ENDPOINT \
          --dart-define=PROOFMODE_SIGNING_SERVER_TOKEN=$PROOFMODE_SIGNING_SERVER_TOKEN \
          --dart-define=SUPPORTERS_API_BASE_URL=$SUPPORTERS_API_BASE_URL \
          --dart-define=FF_DIVINE_SUPPORTERS=$FF_DIVINE_SUPPORTERS
    - &package_macos_dmg
      name: Package macOS DMG
      script: |
        APP_PATH="build/macos/Build/Products/Release"
        APP_NAME=$(ls "$APP_PATH" | grep '\.app$' | head -1)
        DMG_NAME="Divine-macOS.dmg"
        echo "Packaging $APP_NAME as $DMG_NAME"
        hdiutil create -volname "Divine" -srcfolder "$APP_PATH/$APP_NAME" \
          -ov -format UDZO "$APP_PATH/$DMG_NAME"
    - &publish_github_release
      name: Publish to GitHub Release
      script: |
        if [ "${{ inputs.PUBLISH_TO_GITHUB }}" != "YES" ]; then
          echo "Skipping GitHub Release (PUBLISH_TO_GITHUB != YES)"
          exit 0
        fi
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
        TAG="$VERSION"
        echo "Publishing to GitHub Release $TAG"
        # Collect artifacts that exist for this platform
        ARTIFACTS=()
        # Android APKs
        for f in build/app/outputs/apk/release/*arm64*.apk build/app/outputs/apk/release/*armeabi*.apk; do
          [ -f "$f" ] && ARTIFACTS+=("$f")
        done
        # iOS IPA
        for f in build/ios/ipa/*.ipa; do
          [ -f "$f" ] && ARTIFACTS+=("$f")
        done
        # macOS DMG
        for f in build/macos/Build/Products/Release/*.dmg; do
          [ -f "$f" ] && ARTIFACTS+=("$f")
        done
        if [ ${#ARTIFACTS[@]} -eq 0 ]; then
          echo "No artifacts found to upload"
          exit 1
        fi
        echo "Uploading ${#ARTIFACTS[@]} artifact(s): ${ARTIFACTS[*]}"
        # If release already exists, upload assets to it; otherwise create new
        if gh release view "$TAG" --repo "$CM_REPO_SLUG" > /dev/null 2>&1; then
          echo "Release $TAG exists, uploading assets (replacing existing)"
          gh release upload "$TAG" \
            --repo "$CM_REPO_SLUG" \
            --clobber \
            "${ARTIFACTS[@]}"
        else
          echo "Creating new release $TAG"
          gh release create "$TAG" \
            --repo "$CM_REPO_SLUG" \
            --title "$TAG" \
            --prerelease \
            --generate-notes \
            "${ARTIFACTS[@]}"
        fi
    - &build_ios
      name: Build and sign iOS (Shorebird release)
      script: |
        set -euo pipefail
        . build/shorebird/ios_release.env
        BUILD_NAME=$SHOREBIRD_BUILD_NAME
        BUILD_NUMBER=$SHOREBIRD_BUILD_NUMBER
        echo "iOS build number: $BUILD_NUMBER (release: $SHOREBIRD_RELEASE_VERSION)"
        # Shorebird wraps `flutter build ipa` with its own engine so the release
        # carries the updater. A plain `flutter build` here would ship a
        # permanently unpatchable version to TestFlight and the App Store.
        shorebird release ios --flutter-version=$FLUTTER_VERSION --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER \
          --dart-define-from-file=build/shorebird/dart_defines.json \
          --public-key-path=build/shorebird/patch_public_key.pem \
          --export-options-plist=/Users/builder/export_options.plist
    - &patch_ios
      name: Patch iOS (Shorebird)
      script: |
        # See the Android patch step for why there is no --flutter-version and
        # why the dart-defines must match the release's.
        # See the Android patch step for why both key halves are required.
        shorebird patch ios --release-version=${{ inputs.RELEASE_VERSION }} --track=staging \
          --dart-define-from-file=build/shorebird/dart_defines.json \
          --public-key-path=build/shorebird/patch_public_key.pem \
          --private-key-path=build/shorebird/patch_private_key.pem \
          --export-options-plist=/Users/builder/export_options.plist
    - &upload_dsyms_to_crashlytics
      name: Upload dSYMs to Firebase Crashlytics
      script: |
        # Upload dSYMs after archive so Xcode signing does not depend on a
        # DerivedData-specific FlutterFire build phase path.
        DSYM_DIR="build/ios/archive/Runner.xcarchive/dSYMs"

        if [ ! -d "$DSYM_DIR" ]; then
          echo "ERROR: dSYM directory not found at $DSYM_DIR"
          find build/ios -name "*.dSYM" -type d 2>/dev/null || true
          exit 1
        fi

        echo "Found dSYMs:"
        ls -la "$DSYM_DIR"

        # Find the Crashlytics upload-symbols tool from the SPM build
        UPLOAD_SYMBOLS=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "upload-symbols" -type f 2>/dev/null | head -1)
        if [ -z "$UPLOAD_SYMBOLS" ]; then
          UPLOAD_SYMBOLS=$(find . -path "*/FirebaseCrashlytics*" -name "upload-symbols" -type f 2>/dev/null | head -1)
        fi
        if [ -z "$UPLOAD_SYMBOLS" ]; then
          UPLOAD_SYMBOLS=$(find build/ios/SourcePackages -path "*/firebase-ios-sdk*/Crashlytics/upload-symbols" -type f 2>/dev/null | head -1)
        fi
        if [ -z "$UPLOAD_SYMBOLS" ] && [ -f "build/ios/SourcePackages/checkouts/firebase-ios-sdk/upload-symbols" ]; then
          UPLOAD_SYMBOLS="build/ios/SourcePackages/checkouts/firebase-ios-sdk/upload-symbols"
        fi

        if [ -z "$UPLOAD_SYMBOLS" ]; then
          FIREBASE_IOS_SDK_VERSION=$(ruby -rjson -e '
            data = JSON.parse(File.read("ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved"))
            pin = data.fetch("pins").find { |item| item.fetch("identity") == "firebase-ios-sdk" }
            abort("firebase-ios-sdk not found in Package.resolved") unless pin
            state = pin.fetch("state")
            puts(state["version"] || state.fetch("revision"))
          ')
          FIREBASE_IOS_SDK_DIR="$CM_BUILD_DIR/.firebase-ios-sdk-$FIREBASE_IOS_SDK_VERSION"

          echo "upload-symbols not found in build outputs; fetching firebase-ios-sdk $FIREBASE_IOS_SDK_VERSION"
          rm -rf "$FIREBASE_IOS_SDK_DIR"
          git clone --depth 1 --branch "$FIREBASE_IOS_SDK_VERSION" \
            https://github.com/firebase/firebase-ios-sdk.git \
            "$FIREBASE_IOS_SDK_DIR"

          UPLOAD_SYMBOLS="$FIREBASE_IOS_SDK_DIR/Crashlytics/upload-symbols"
        fi

        if [ ! -f "$UPLOAD_SYMBOLS" ]; then
          echo "ERROR: upload-symbols tool not found at $UPLOAD_SYMBOLS"
          find "$HOME" -name "upload-symbols" -type f 2>/dev/null || true
          find "$CM_BUILD_DIR" -name "upload-symbols" -type f 2>/dev/null || true
          exit 1
        fi

        echo "Found upload-symbols at: $UPLOAD_SYMBOLS"
        chmod +x "$UPLOAD_SYMBOLS"

        "$UPLOAD_SYMBOLS" \
          -gsp ios/Runner/GoogleService-Info.plist \
          -p ios \
          "$DSYM_DIR"
    - &build_ios_simulator
      name: Build iOS Simulator app
      script: |
        flutter build ios --simulator \
          --dart-define=ZENDESK_APP_ID=$ZENDESK_APP_ID \
          --dart-define=ZENDESK_CLIENT_ID=$ZENDESK_CLIENT_ID \
          --dart-define=ZENDESK_URL=$ZENDESK_URL \
          --dart-define=DEFAULT_ENV=${{ inputs.DEFAULT_ENV }} \
          --dart-define=PROOFMODE_SIGNING_SERVER_ENDPOINT=$PROOFMODE_SIGNING_SERVER_ENDPOINT \
          --dart-define=PROOFMODE_SIGNING_SERVER_TOKEN=$PROOFMODE_SIGNING_SERVER_TOKEN \
          --dart-define=SUPPORTERS_API_BASE_URL=$SUPPORTERS_API_BASE_URL \
          --dart-define=FF_DIVINE_SUPPORTERS=$FF_DIVINE_SUPPORTERS
    # GH_ACTIONS_PR_PREVIEW sets forceOpenOnboarding on the invite client
    # (main.dart), so getClientConfig() reports OnboardingMode.open and the
    # invite gate self-redirects to account creation. Without it every flow
    # that signs up stops at "Add your invite code" and the suite would need
    # a live invite code as a managed, expirable secret. The gate itself is
    # covered directly by invite_gate_screen_test.dart.
    # The flag is named for its original PR-preview use; it is not
    # GitHub-Actions specific.
    - &build_ios_e2e
      name: Build iOS Simulator app
      script: |
        flutter build ios --simulator \
          --dart-define=ZENDESK_APP_ID=$ZENDESK_APP_ID \
          --dart-define=ZENDESK_CLIENT_ID=$ZENDESK_CLIENT_ID \
          --dart-define=ZENDESK_URL=$ZENDESK_URL \
          --dart-define=DEFAULT_ENV=$DEFAULT_ENV \
          --dart-define=GH_ACTIONS_PR_PREVIEW=true \
          --dart-define=PROOFMODE_SIGNING_SERVER_ENDPOINT=$PROOFMODE_SIGNING_SERVER_ENDPOINT \
          --dart-define=PROOFMODE_SIGNING_SERVER_TOKEN=$PROOFMODE_SIGNING_SERVER_TOKEN \
          --dart-define=SUPPORTERS_API_BASE_URL=$SUPPORTERS_API_BASE_URL \
          --dart-define=FF_DIVINE_SUPPORTERS=$FF_DIVINE_SUPPORTERS
    - &build_android_e2e
      name: Build Android debug APK
      script: |
        flutter build apk --debug \
          --dart-define=ZENDESK_APP_ID=$ZENDESK_APP_ID \
          --dart-define=ZENDESK_CLIENT_ID=$ZENDESK_CLIENT_ID \
          --dart-define=ZENDESK_URL=$ZENDESK_URL \
          --dart-define=DEFAULT_ENV=$DEFAULT_ENV \
          --dart-define=GH_ACTIONS_PR_PREVIEW=true \
          --dart-define=PROOFMODE_SIGNING_SERVER_ENDPOINT=$PROOFMODE_SIGNING_SERVER_ENDPOINT \
          --dart-define=PROOFMODE_SIGNING_SERVER_TOKEN=$PROOFMODE_SIGNING_SERVER_TOKEN \
          --dart-define=SUPPORTERS_API_BASE_URL=$SUPPORTERS_API_BASE_URL \
          --dart-define=FF_DIVINE_SUPPORTERS=$FF_DIVINE_SUPPORTERS
    - &install_maestro
      name: Install Maestro CLI
      script: |
        set -e
        # Pinned. An unpinned get.maestro.mobile.dev install lets an upstream
        # release break CI with no commit on our side.
        #
        # 2.8.0, not the 2.1.0 that #6948 verified: 2.1.0 cannot start its iOS
        # driver on Xcode 26.x at all. The XCTest runner installs, reports
        # success, and never binds port 7001 (mobile-dev-inc/Maestro#2932), so
        # every flow fails before its first assertion. Codemagic's image is on
        # Xcode 26.4.1, which puts 2.1.0 squarely in that hole. 2.8.0 carries
        # the iOS 26 driver fixes and was verified green on this image
        # (build 6a7bb0d4e702412428f4e733, 2/2 flows passed).
        #
        # Bump deliberately, re-verify on a real build, then merge the bump.
        export MAESTRO_VERSION=2.8.0
        curl -Ls "https://get.maestro.mobile.dev" | bash
        export PATH="$PATH:$HOME/.maestro/bin"
        maestro --version
    - &run_maestro_smoke_tests
      name: Run Maestro Smoke Tests
      script: |
        set -e
        export PATH="$PATH:$HOME/.maestro/bin"
        # Flow files are passed individually rather than as suites/*.yaml.
        # Maestro reports a suite file as ONE <testcase> named after the suite,
        # with no per-flow detail — so a failure says only "the suite failed"
        # and `test_report` cannot name the flow. Per-flow invocation yields one
        # <testcase> each, carrying name, file, timing and tags.
        # The iOS boot step persists its selected simulator across Codemagic
        # steps. Android leaves the variable unset and uses Maestro's default.
        set --
        if [ -n "${MAESTRO_DEVICE_UDID:-}" ]; then
          set -- --device "$MAESTRO_DEVICE_UDID"
        fi
        maestro "$@" test \
          --format junit \
          --output report.xml \
          e2e/maestro/tests/loginFreshInstall.yaml \
          e2e/maestro/tests/removeKeys.yaml
      # Script-level, not workflow-level: Codemagic rejects `test_report` as an
      # unknown workflow field ("extra fields not permitted").
      test_report: report.xml
    - &boot_ios_simulator
      name: Boot iOS Simulator
      script: |
        set -e
        xcodebuild -version
        # Pick the first device from an explicit preference list rather than
        # pinning one model. A hardcoded 'iPhone 16 Pro' silently produced an
        # empty UDID on any image whose Xcode ships a different device set,
        # and without `set -e` the step still reported success.
        #
        # The list is ordered, not "newest wins": screen size changes what is
        # visible and tappable, so an E2E run must land on a predictable
        # device or its failures stop being reproducible.
        DEVICE_UDID=$(xcrun simctl list devices available -j | \
          python3 -c "
        import json, sys
        PREFERRED = [
            'iPhone 16 Pro',
            'iPhone 17 Pro',
            'iPhone 16',
            'iPhone 17',
            'iPhone 15 Pro',
        ]
        data = json.load(sys.stdin)
        available = {}
        for runtime, devices in data['devices'].items():
            for d in devices:
                if d.get('isAvailable'):
                    available.setdefault(d['name'], d['udid'])
        for name in PREFERRED:
            if name in available:
                sys.stderr.write('Selected simulator: %s\n' % name)
                print(available[name])
                sys.exit(0)
        sys.stderr.write(
            'None of the preferred simulators are available. Present: %s\n'
            % ', '.join(sorted(available)))
        sys.exit(1)
        ")
        xcrun simctl boot "$DEVICE_UDID" || true
        xcrun simctl bootstatus "$DEVICE_UDID" -b
        echo "Booted simulator: $DEVICE_UDID"
        echo "MAESTRO_DEVICE_UDID=$DEVICE_UDID" >> "$CM_ENV"

        # Ask the simulator for reduced motion before the app is installed.
        #
        # XCUITest blocks every UI query until the app under test reaches
        # quiescence, and a repeating AnimationController never settles — so a
        # perpetual animation makes each query wait out XCUITest's internal
        # timeout, measured at a fixed 3m31s (#7204). BrandedLoadingIndicator,
        # the Explore `loading:` state, is one such animation.
        #
        # The app honours this via MediaQuery.disableAnimations, so setting it
        # here is what lets the app go idle. Note the suite therefore exercises
        # the reduced-motion variant of any gated animation, which is the
        # deliberate trade: determinism over covering the animated path.
        xcrun simctl spawn "$DEVICE_UDID" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
        echo "Reduced motion enabled on $DEVICE_UDID"
    - &install_app_ios_simulator
      name: Install app on iOS Simulator
      script: |
        set -e
        : "${MAESTRO_DEVICE_UDID:?The boot step did not export a simulator UDID}"
        APP_PATH="build/ios/iphonesimulator/Runner.app"
        xcrun simctl uninstall "$MAESTRO_DEVICE_UDID" "$BUNDLE_ID" 2>/dev/null || true
        xcrun simctl install "$MAESTRO_DEVICE_UDID" "$APP_PATH"
        if ! xcrun simctl get_app_container "$MAESTRO_DEVICE_UDID" "$BUNDLE_ID" >/dev/null 2>&1; then
          echo "ERROR: $BUNDLE_ID was not installed on $MAESTRO_DEVICE_UDID" >&2
          exit 1
        fi
        echo "App installed and verified on iOS simulator: $MAESTRO_DEVICE_UDID"
    - &launch_android_emulator
      name: Launch Android emulator
      script: |
        set -e
        # $ANDROID_HOME/tools was removed from modern SDKs, so cd-ing there
        # killed this step under `set -e` before the emulator ever started.
        # The binary now ships in its own directory; invoke it by path.
        EMULATOR="$ANDROID_HOME/emulator/emulator"
        if [ ! -x "$EMULATOR" ]; then
          echo "ERROR: emulator not found at $EMULATOR" >&2
          exit 1
        fi
        "$EMULATOR" -avd emulator &
        adb wait-for-device
        TIMEOUT=120
        ELAPSED=0
        while [ "$(adb shell getprop sys.boot_completed 2>/dev/null)" != "1" ]; do
          if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
            echo "ERROR: Android emulator failed to boot within ${TIMEOUT}s"
            exit 1
          fi
          echo "Waiting for Android emulator to boot... (${ELAPSED}s/${TIMEOUT}s)"
          sleep 5
          ELAPSED=$((ELAPSED + 5))
        done
        echo "Android emulator booted"
    - &install_app_android_emulator
      name: Install app on Android emulator
      script: |
        set -e
        APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
        if [ ! -f "$APK_PATH" ]; then
          echo "ERROR: APK not found at $APK_PATH"
          exit 1
        fi
        adb install "$APK_PATH"
        echo "App installed on Android emulator"
workflows:
  ios-build:
    name: iOS Build
    working_directory: mobile
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: API key for Codemagic # Setup in Codemagic UI
    inputs:
      DEFAULT_ENV:
        description: Default environment for fresh app installs
        type: choice
        default: PRODUCTION
        options:
          - PRODUCTION
          - STAGING
          - POC
      PUBLISH_TO_GITHUB:
        description: Upload IPA to GitHub Release (for direct distribution)
        type: choice
        default: "NO"
        options:
          - "NO"
          - "YES"
    environment:
      flutter: 3.44.9
      xcode: latest
      cocoapods: default
      groups:
        - zendesk_credentials
        - proofmode_credentials
        - github_credentials
        - shorebird_credentials
      vars:
        # Must match `flutter:` above. Shorebird ships its own Flutter, so the
        # release is only reproducible if we pin it to the same version
        # Codemagic provisioned.
        FLUTTER_VERSION: 3.44.9
        SHOREBIRD_PLATFORM: ios
        BUNDLE_ID: co.openvine.app
        IOS_EXTENSION_BUNDLE_IDS: >-
          co.openvine.app.NotificationServiceExtension
          co.openvine.app.CameraQuickActionWidget
      ios_signing:
        distribution_type: app_store
        bundle_identifier: co.openvine.app
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.shorebird
        - $HOME/.pub-cache
    triggering:
      events: []
    scripts:
      - *verify_shorebird_release_source
      - *shorebird_install
      - *check_coordinator_route
      - *check_signing_endpoint
      - *check_supporters_config
      - *check_ios_extension_signing_contract
      - *write_shorebird_public_key
      - *preflight_shorebird_ios_release
      - *setup_code_signing_xcode
      - *clean_ios_workspace_state
      - *enable_spm
      - *prepare_ios_spm_packages
      - *pod_install
      - *write_shorebird_dart_defines
      - *build_ios
      - *emit_shorebird_provenance
      - *upload_dsyms_to_crashlytics
      - *publish_github_release
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs/**
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only; App Store Connect owns internal distribution and review gates.
        submit_to_testflight: false
        submit_to_app_store: false

  ios-simulator-build:
    name: iOS Simulator Build
    working_directory: mobile
    max_build_duration: 60
    instance_type: mac_mini_m2
    inputs:
      DEFAULT_ENV:
        description: Default environment for fresh app installs
        type: choice
        default: PRODUCTION
        options:
          - PRODUCTION
          - STAGING
          - POC
    environment:
      flutter: 3.44.9
      xcode: latest
      cocoapods: default
      groups:
        - zendesk_credentials
        - proofmode_credentials
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.pub-cache
    triggering:
      events: []
    scripts:
      - *check_signing_endpoint
      - *check_supporters_config
      - *clean_ios_workspace_state
      - *enable_spm
      - *flutter_pub_get
      - *pod_install
      - *build_ios_simulator
    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - /tmp/xcodebuild_logs/*.log

  android-build:
    name: Android Build
    working_directory: mobile
    max_build_duration: 60
    # Release R8 + core-library desugaring (L8) is memory-hungry; the 16 GB
    # M4 gives the Gradle daemon headroom the 12 GB M2 could not.
    instance_type: mac_mini_m4
    inputs:
      DEFAULT_ENV:
        description: Default environment for fresh app installs
        type: choice
        default: PRODUCTION
        options:
          - PRODUCTION
          - STAGING
          - POC
      PUBLISH_TO_GITHUB:
        description: Create a GitHub Release with APK artifacts (for Zapstore)
        type: choice
        default: "NO"
        options:
          - "NO"
          - "YES"
    environment:
      flutter: 3.44.9
      java: 17
      groups:
        - zendesk_credentials
        - google_play_credentials
        - proofmode_credentials
        - github_credentials
        - shorebird_credentials
      vars:
        # Must match `flutter:` above — see the iOS workflow for why.
        FLUTTER_VERSION: 3.44.9
        SHOREBIRD_PLATFORM: android
      android_signing:
        - divine_keystore
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.shorebird
        - $HOME/.pub-cache
    triggering:
      events: []
    scripts:
      - *verify_shorebird_release_source
      - *shorebird_install
      - *check_coordinator_route
      - *check_signing_endpoint
      - *check_supporters_config
      - *enable_spm
      - *setup_local_properties
      - *configure_gradle_memory
      - *write_shorebird_public_key
      - *preflight_shorebird_android_release
      - *write_shorebird_dart_defines
      - *build_apk
      - *precache_shorebird_android_artifacts
      - *build_aab
      - *emit_shorebird_provenance
      - *publish_github_release
    artifacts:
      - build/app/outputs/apk/release/*.apk
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/**/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # Ship the exact Shorebird-enabled release to internal testers first.
        # Promote this same Play artifact manually after testing; do not rebuild
        # it for broader testing or production.
        track: internal

  # Patch workflows ship a Dart-only fix to an already-released build over the
  # air. They publish to Shorebird, not to Play or the App Store, and are
  # manual-trigger only. The workflows publish to the Shorebird staging track;
  # promoting to stable reaches users within one app launch, so it should be a
  # deliberate act, never a side effect of a push.
  #
  # A patch can only target a release that was cut by `shorebird release`
  # (the AAB and IPA steps above). Per-ABI APKs from the Zapstore path are
  # plain flutter builds and cannot be patched.
  ios-patch:
    name: iOS Patch (Shorebird)
    working_directory: mobile
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: API key for Codemagic # Setup in Codemagic UI
    inputs:
      CONFIRM_PATCH:
        description: >-
          Must be YES to proceed. Guards against a mis-clicked workflow — a
          patch ships with no store review and rollback is only an emergency
          mitigation.
        type: choice
        default: "NO"
        options:
          - "NO"
          - "YES"
      RELEASE_VERSION:
        description: >-
          Release to patch, exactly as Shorebird lists it, including the build
          number (e.g. 1.0.9+247). Get it from `shorebird releases list` or the
          Shorebird console — a value with no matching release fails the build.
        type: string
      PATCH_BRANCH:
        description: >-
          Exact remote release-patch branch to build. It must be named
          shorebird-patch/ios/<RELEASE_VERSION>, start at the recorded release
          baseline, and contain only the cumulative reviewed Dart backports.
        type: string
      RELEASE_COMMIT:
        description: >-
          Optional source assertion. When supplied, it must be the recorded
          build commit, patch baseline, or a commit with the recorded source
          tree. Provenance determines the actual patch baseline.
        type: string
      DEFAULT_ENV:
        description: >-
          Must match the value the target release was built with. A mismatch
          silently repoints patched installs at a different environment.
        type: choice
        default: PRODUCTION
        options:
          - PRODUCTION
          - STAGING
          - POC
    environment:
      flutter: 3.44.9
      xcode: latest
      cocoapods: default
      groups:
        - zendesk_credentials
        - proofmode_credentials
        - github_credentials
        - shorebird_credentials
      vars:
        # Must match `flutter:` above. Provenance verification compares this
        # against the Flutter version recorded for the target release.
        FLUTTER_VERSION: 3.44.9
        SHOREBIRD_PLATFORM: ios
        BUNDLE_ID: co.openvine.app
        IOS_EXTENSION_BUNDLE_IDS: >-
          co.openvine.app.NotificationServiceExtension
          co.openvine.app.CameraQuickActionWidget
      ios_signing:
        distribution_type: app_store
        bundle_identifier: co.openvine.app
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.shorebird
        - $HOME/.pub-cache
    triggering:
      events: []
    scripts:
      - *confirm_patch
      - *shorebird_install
      - *check_signing_endpoint
      - *check_supporters_config
      - *write_shorebird_dart_defines
      - *fetch_and_verify_shorebird_provenance
      - *prepare_patch_source
      - *check_ios_extension_signing_contract
      - *write_shorebird_public_key
      - *write_shorebird_private_key
      - *setup_code_signing_xcode
      - *clean_ios_workspace_state
      - *enable_spm
      - *prepare_ios_spm_packages
      - *pod_install
      - *patch_ios

