name: Android Store Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional full lowercase 40-character SHA; must equal current main'
        required: false
        type: string
      default_env:
        description: Default backend for fresh installs
        type: choice
        default: PRODUCTION
        options: [PRODUCTION, STAGING, POC]
      release_channel:
        description: GitHub release channel when publishing binaries
        type: choice
        default: BETA
        options: [BETA, PRODUCTION]
      publish_to_github:
        description: Publish APKs to GitHub (production also publishes to Zapstore)
        type: choice
        default: 'NO'
        options: ['NO', 'YES']

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  # Serialize manual starts with coordinator diagnostics and queue mutations.
  group: store-release-train
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: store-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scope private ledger build token
        id: provenance
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PROVENANCE_APP_ID }}
          private-key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          owner: divinevideo
          repositories: divine-release-provenance
          permission-contents: write
          skip-token-revoke: true
      - name: Submit and monitor main Android release
        id: codemagic
        env:
          GH_TOKEN: ${{ github.token }}
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          RELEASE_NOTES_LUNAROUTE_API_KEY: ${{ secrets.RELEASE_NOTES_LUNAROUTE_API_KEY }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PROVENANCE_TOKEN: ${{ steps.provenance.outputs.token }}
          PUBLIC_PEOPLE_LIST_POLICY: ${{ vars.DIVINE_PUBLIC_PEOPLE_LIST_EXCLUDED_D_TAGS }}
          RELEASE_PLATFORM: android
          SOURCE_SHA: ${{ inputs.source_sha }}
          NATIVE_DEFAULT_ENV: ${{ inputs.default_env }}
          NATIVE_RELEASE_CHANNEL: ${{ inputs.release_channel }}
          NATIVE_PUBLISH_TO_GITHUB: ${{ inputs.publish_to_github }}
        run: python3 mobile/scripts/start_ios_release.py
