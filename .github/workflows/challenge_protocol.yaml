# ABOUTME: Verify the pure Dart challenge convention against pinned wire fixtures.
# ABOUTME: Resolve the actual Flutter workspace before package-only validation.
name: Challenge Protocol CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/challenge_protocol/**"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"
      - ".github/workflows/challenge_protocol.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/challenge_protocol/**"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"
      - ".github/workflows/challenge_protocol.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile/packages/challenge_protocol
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Resolve the real workspace
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze pure Dart package
        run: dart analyze --fatal-infos
      - name: Run pinned parser, replay and participant template tests
        run: dart test
