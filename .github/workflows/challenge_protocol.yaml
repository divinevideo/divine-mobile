# ABOUTME: Verify the pure Dart challenge convention against pinned wire fixtures.
# ABOUTME: Resolve the actual Flutter workspace before package-only validation.
name: Challenge Protocol CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/challenge_protocol/**"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"
      - ".github/workflows/challenge_protocol.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/challenge_protocol/**"
      - "mobile/pubspec.yaml"
      - "mobile/pubspec.lock"
      - ".github/workflows/challenge_protocol.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      run_bloc_lint: true
      working_directory: "mobile/packages/challenge_protocol"
      flutter_version: "3.47.2"
      min_coverage: 99

  workspace:
    name: Workspace lockfile resolution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile/packages/challenge_protocol
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Resolve the real workspace
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Verify pinned Unicode sources and generated tables
        run: python3 tool/generate_tr46.py --check
