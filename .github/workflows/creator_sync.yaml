# ABOUTME: CI workflow for the creator_sync package.
# ABOUTME: Runs tests, formatting, and analysis only when creator_sync changes.

name: Creator Sync CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/creator_sync/**"
      - ".github/workflows/creator_sync.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/creator_sync/**"
      - ".github/workflows/creator_sync.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      working_directory: "mobile/packages/creator_sync"
      flutter_version: "3.47.2"
