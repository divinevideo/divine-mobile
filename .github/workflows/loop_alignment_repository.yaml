# ABOUTME: CI workflow for the loop_alignment_repository package.
# ABOUTME: Runs tests, formatting, and analysis only when loop_alignment_repository files change.

name: Loop Alignment Repository CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/loop_alignment_repository/**"
      - ".github/workflows/loop_alignment_repository.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/loop_alignment_repository/**"
      - ".github/workflows/loop_alignment_repository.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      working_directory: "mobile/packages/loop_alignment_repository"
      flutter_version: "3.47.2"
