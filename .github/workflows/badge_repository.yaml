# ABOUTME: CI workflow for the badge_repository package.
# ABOUTME: Runs tests, formatting, and analysis only when badge_repository files change.

name: Badge Repository CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/badge_repository/**"
      - ".github/workflows/badge_repository.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/badge_repository/**"
      - ".github/workflows/badge_repository.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      working_directory: "mobile/packages/badge_repository"
      flutter_version: "3.47.2"
