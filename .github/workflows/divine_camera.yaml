# ABOUTME: CI workflow for the divine_camera package.
# ABOUTME: Runs tests, formatting, and analysis only when divine_camera files change.

name: Divine Camera CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/divine_camera/**"
      - ".github/workflows/divine_camera.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/divine_camera/**"
      - ".github/workflows/divine_camera.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      run_bloc_lint: true
      working_directory: "mobile/packages/divine_camera"
      flutter_version: "3.47.9"

  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
          cache-provider: basic
      - name: Install dependencies
        run: flutter pub get
      - name: Run divine_camera Android unit tests
        working-directory: mobile/android
        run: gradle :divine_camera:testDebugUnitTest

  native-linux:
    name: Linux Capture Ownership
    runs-on: ubuntu-24.04
    # Fresh runner dependency downloads exceeded 25 minutes before compilation.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/packages/divine_camera
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install native capture and independent decoder tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav ffmpeg xvfb xauth
      - name: Verify trace output minimization
        run: python -m unittest discover -s tool -p '*_test.py'
      - name: Verify native live recording and microphone failure recovery under ASAN
        run: |
          cmake -G Ninja -S native -B "$RUNNER_TEMP/divine-capture-core" -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DDIVINE_CAPTURE_TEST_ASAN=ON
          cmake --build "$RUNNER_TEMP/divine-capture-core"
          ctest --test-dir "$RUNNER_TEMP/divine-capture-core" --output-on-failure
      - name: Verify actual Flutter capture and writer release
        run: |
          for capture_case in video mirrored-video audio audio-unavailable startup-failure; do
            python tool/native_capture_harness.py --platform linux --case "$capture_case" --workspace "$RUNNER_TEMP/divine-capture-consumer"
          done

  native-windows:
    name: Windows Capture Ownership
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile/packages/divine_camera
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install independent test decoder
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Independent decoder installation failed.' }
      - name: Verify trace output minimization
        run: python -m unittest discover -s tool -p '*_test.py'
      - name: Verify output ownership and writer release barriers
        id: native_contracts
        run: |
          foreach ($serviceName in @('Audiosrv', 'AudioEndpointBuilder')) {
            $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
            $status = if ($null -eq $service) { 'unavailable' } else { $service.Status }
            Write-Output "DIVINE_CAPTURE_ENV_SERVICE $serviceName $status"
          }
          foreach ($hive in @('HKLM', 'HKCU')) {
            $entry = Get-ItemProperty -LiteralPath "${hive}:\SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone" -ErrorAction SilentlyContinue
            $consent = $entry.Value
            $status = if ($consent -in @('Allow', 'Deny')) { $consent } else { 'unspecified' }
            Write-Output "DIVINE_CAPTURE_ENV_MICROPHONE $hive $status"
          }
          $build = Join-Path $env:RUNNER_TEMP 'divine-capture-ownership'
          cmake -S windows/tests -B $build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Capture ownership configuration failed.' }
          cmake --build $build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Capture ownership build failed.' }
          ctest --test-dir $build -C Release --output-on-failure -E '^video_processor_activation_contract$'
          if ($LASTEXITCODE -ne 0) { throw 'Capture ownership tests failed.' }
      - name: Start existing audio runtime for capture engine
        run: |
          Start-Service -Name AudioEndpointBuilder
          Start-Service -Name Audiosrv
          foreach ($serviceName in @('Audiosrv', 'AudioEndpointBuilder')) {
            $service = Get-Service -Name $serviceName
            Write-Output "DIVINE_CAPTURE_ENV_SERVICE_READY $serviceName $($service.Status)"
            if ($service.Status -ne 'Running') { throw 'Audio runtime is unavailable.' }
          }
      - name: Verify actual Flutter capture and source release
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP 'divine-capture-consumer'
          $env:DIVINE_CAPTURE_TRACE_LAUNCHER = Join-Path $env:RUNNER_TEMP 'divine-capture-ownership/Release/capture trace launcher.exe'
          $failedCases = @()
          foreach ($captureCase in @('video', 'mirrored-video', 'mirror-timeout', 'mirror-error', 'mirror-status', 'mirror-start-timeout', 'mirror-no-frames', 'mirror-frame-before-start-timeout', 'mirror-valid-frame-deadline', 'audio', 'audio-unavailable', 'texture-unavailable')) {
            python tool/native_capture_harness.py --platform windows --case $captureCase --workspace $workspace
            if ($LASTEXITCODE -ne 0) { $failedCases += $captureCase }
          }
          python tool/native_capture_harness.py --platform windows --case mirrored-video --test-effect-flags --workspace $workspace
          if ($LASTEXITCODE -ne 0) { $failedCases += 'mirrored-video-flags' }
          if ($failedCases.Count -gt 0) { throw "Capture cases failed: $($failedCases -join ', ')" }
      - name: Characterize video processor activation independently
        if: ${{ !cancelled() && steps.native_contracts.outcome == 'success' }}
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'divine-capture-ownership'
          ctest --test-dir $build -C Release --output-on-failure --verbose -R '^video_processor_activation_contract$'
          if ($LASTEXITCODE -ne 0) { throw 'Video processor activation contract failed.' }
