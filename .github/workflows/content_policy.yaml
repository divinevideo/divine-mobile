# ABOUTME: CI workflow for the content_policy package.
# ABOUTME: Runs tests, formatting, and analysis only when content_policy files change.

name: Content Policy CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/content_policy/**"
      - ".github/workflows/content_policy.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/content_policy/**"
      - ".github/workflows/content_policy.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      working_directory: "mobile/packages/content_policy"
      flutter_version: "3.47.2"
