name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: >-
          Regenerate golden references on the runner and upload them as an
          artifact instead of verifying. Download and commit the result — the
          references must be produced on the same OS that checks them.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # merge_group refs are the queue's only signal. Cancelling that run ejects
  # the PR even when the replacement job never starts (#7197).
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  changes:
    name: Detect App CI Scope
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      app: ${{ steps.scope.outputs.app }}
      native: ${{ steps.scope.outputs.native }}
      ios_native: ${{ steps.scope.outputs.ios_native }}
      android: ${{ steps.scope.outputs.android }}
      ios: ${{ steps.scope.outputs.ios }}
      service: ${{ steps.scope.outputs.service }}
      maestro_static: ${{ steps.scope.outputs.maestro_static }}
      smoke: ${{ steps.scope.outputs.smoke }}
      performance: ${{ steps.scope.outputs.performance }}
      ci_config: ${{ steps.scope.outputs.ci_config }}
    steps:
      # Fetch only the test-backed detector. The changed-file list itself still
      # comes from the REST API, avoiding a full-history checkout on the
      # workflow's critical path (every other job `needs: changes`).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: mobile/scripts/ci/detect_mobile_ci_scope.sh
          sparse-checkout-cone-mode: false
      - name: Detect whether app CI is required
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: bash mobile/scripts/ci/detect_mobile_ci_scope.sh

  codex-config:
    name: Codex Configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated skills and lifecycle hooks
        run: bash .codex/scripts/test-config.sh

  codemagic-groups:
    # Deliberately ungated — no `needs: changes`, no `if:`.
    #
    # The scope detector classifies `codemagic.yaml` as out-of-app-scope, so a
    # PR touching only that file (#7191, the revert of the outage, is exactly
    # that shape) resolves app=false and skips every gated job. Gating this
    # check would therefore switch it off for the one change it exists to
    # police. Adding codemagic.yaml to the detector instead would drag the full
    # app test matrix along for a config edit.
    #
    # It costs a checkout plus a second of grep, so running it unconditionally
    # is cheaper than reasoning about when it should run.
    #
    # The required check is the `Mobile CI` aggregator, not this job's name.
    # `mobile-ci` therefore needs this job and fails unless it succeeds — even
    # when app CI is skipped — or a yaml-only PR can merge with a red guard.
    name: Codemagic Variable Groups
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 🔑 Verify every Codemagic variable group is documented
        # Static — no simulator, no build, no credentials — so fork PRs get it
        # too. Codemagic validates the whole config before provisioning, so an
        # undeclared group fails every workflow in the file and no in-script
        # guard can catch it (#7203).
        run: bash mobile/scripts/check_codemagic_groups.sh

  # Deliberately ungated: these tests protect release configuration that the
  # app-scope detector excludes, and the Mobile CI aggregator requires them.
  ci-config-tests:
    name: CI Configuration Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Provenance tests verify the historical release baseline tree.
          fetch-depth: 0
      - name: Run CI configuration unit tests
        run: python3 -m unittest discover -s .github/scripts/tests
      - name: 🛍️ Verify update URLs match shipped store identifiers
        run: bash mobile/scripts/check_store_url_identifiers.sh

  generated-files:
    name: Generated Files
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: Restore dart hook downloads
        # `dart run build_runner` runs the native-asset hooks first, and the
        # sqlite3mc hook does one unretried GitHub Releases GET on a fresh VM
        # (#7197). The Tests job saves this tree on push-to-main; restoring it
        # here turns that download into a cache hit.
        uses: actions/cache/restore@v6
        with:
          path: mobile/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-dart-hooks-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-hooks-
      - name: 🔨 Verify generated files are up-to-date
        run: |
          dart run build_runner build
          if [ -n "$(git status --porcelain)" ]; then
            echo "⚠️ Generated files are out of date. Please run 'dart run build_runner build' and commit the changes."
            git diff --name-only
            exit 1
          fi
      - name: 🌐 Verify l10n generated files
        run: |
          flutter gen-l10n
          if [ -n "$(git status --porcelain)" ]; then
            echo "⚠️ L10n generated files are out of date. Please run 'flutter gen-l10n' and commit the changes."
            git diff --name-only
            exit 1
          fi

  guards:
    name: Guards
    # Every ratchet and guard script, run in parallel by
    # mobile/scripts/ci/run_guards.sh from the manifest in
    # mobile/scripts/ci/guards.tsv. They used to be ~60 sequential steps of
    # the Generated Files job; each Dart-AST detector pays ~8s of VM start plus
    # package:analyzer JIT on the runner, so that job grew from 3 to 9 minutes
    # between July and September 2026 and became the workflow's critical path.
    # The guards are independent of each other, so the driver runs them four
    # wide and replays each guard's output as its own log group, in manifest
    # order, with a ::error annotation per failure. A guard's rationale lives
    # beside its manifest entry; add new guards there, not here.
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🔀 Fetch origin/main for ratchet baselines
        # The ratchet scripts compare against origin/main. Fetch it once here
        # so each script is order-independent; a fetch failure fails the job
        # (the guards fail closed when the base baseline can't load).
        run: git fetch --quiet --depth=1 origin main
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: Restore dart hook downloads
        # Native-asset hooks store downloaded libs under this tree; every
        # `dart run` below triggers them. The Tests job saves the cache on
        # push-to-main (merge_group can restore but not save, #7197).
        uses: actions/cache/restore@v6
        with:
          path: mobile/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-dart-hooks-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-hooks-
      - name: Warm sqlite3mc native assets
        # Runs the hooks once, serially, before four detectors start `dart run`
        # at the same moment. A cache hit skips the one unretried GitHub
        # Releases GET; a miss still gets five attempts.
        run: bash scripts/ci/warmup_sqlite3mc.sh
      - name: 🔧 Install xmllint for the native transport-security guard
        # Only the native-gated transport-security guard needs it, and the apt
        # round trip is ~42s (of which `apt-get update` alone is ~28s), so it
        # stays behind the same gate as the guard itself.
        if: ${{ needs.changes.outputs.native == 'true' }}
        run: |
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libxml2-utils
          fi
      - name: 🛡️ Run guards
        run: bash scripts/ci/run_guards.sh --native "${{ needs.changes.outputs.native }}"

  async-safety:
    name: Async Safety
    # #9118: analyzer-backed per-rule, per-file ceilings for the remaining
    # unawaited_futures and discarded_futures debt. Every count may only
    # shrink; new files and increased counts fail closed. Its own job rather
    # than a Guards entry for two reasons: it is a full `dart analyze` of the
    # app (~80s, the single most expensive guard), and it rewrites
    # analysis_options.yaml in place while it runs, which nothing else may
    # share a checkout with. Retire the job with the ratchet once the baseline
    # reaches zero and the analyzer's own lint takes over.
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🔀 Fetch origin/main for ratchet baselines
        run: git fetch --quiet --depth=1 origin main
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: ⏳ Verify async-safety findings do not increase (ratchet)
        run: |
          # #9118: analyzer-backed per-rule, per-file ceilings for the remaining
          # unawaited_futures and discarded_futures debt. Every count may only
          # shrink; new files and increased counts fail closed.
          bash scripts/check_async_safety_ceiling.sh

  format:
    name: Format
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        # Required: `dart format` reads page width from analysis_options.yaml,
        # which `include`s package:very_good_analysis. Without a resolved
        # package config that include fails and the formatter silently falls
        # back to its defaults, reformatting 529 files.
        run: flutter pub get
      - name: ✨ Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tools
  analyze:
    name: Analyze
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: 🕵️ Analyze code
        run: flutter analyze lib test integration_test tools
  tests:
    name: Tests (shard ${{ strategy.job-index }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    env:
      # Single copy of the pin: the install step activates this version and the
      # replay recipe prints it. A second hardcoded copy could drift from what
      # CI actually ran, which is the failure the recipe exists to prevent.
      VERY_GOOD_CLI_VERSION: "1.5.0"
    strategy:
      # Every shard must report. Stopping the others on one failure hides
      # additional failures and forces a second full round-trip to find them.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: Restore dart hook downloads
        # Native-asset hooks store downloaded libs under this tree.
        # flutter-action cache: true does not keep it. merge_group can restore
        # but not save (#7197), so only push-to-main warms the cache.
        uses: actions/cache/restore@v6
        with:
          path: mobile/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-dart-hooks-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-hooks-
      - name: Warm sqlite3mc native assets
        # Retries the one hook that does an unretried GitHub Releases GET.
        # A cache hit skips that download; a miss still gets five attempts.
        run: bash scripts/ci/warmup_sqlite3mc.sh
      - name: Save dart hook downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && strategy.job-index == 0
        uses: actions/cache/save@v6
        with:
          path: mobile/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-dart-hooks-${{ hashFiles('mobile/pubspec.lock') }}
      - name: 🛠️ Install Very Good CLI
        # Pinned so the optimizer's bundle mechanics don't float under CI. The
        # version lives in VERY_GOOD_CLI_VERSION above so the replay recipe
        # prints the same one. Package workflows remain independently pinned
        # by very_good_workflows and are outside this app-suite upgrade. #9138.
        run: dart pub global activate very_good_cli "$VERY_GOOD_CLI_VERSION"
      - name: 🔪 Reduce test/ to this shard
        # --optimization bundles every untagged test file into ONE suite, so
        # --concurrency=4 has nothing left to schedule once the 18 tagged files
        # finish and the bulk of the run is single-core. Splitting the file set
        # across 4 runners gives each one a smaller bundle and puts the four
        # vCPUs of four machines on the problem instead of one core of one.
        # The script is a pure partition of test/**/*_test.dart — see
        # test/tools/select_test_shard_test.dart.
        run: bash scripts/ci/select_test_shard.sh --total ${{ strategy.job-total }} --index ${{ strategy.job-index }}
      - name: 🚀 Run Flutter tests
        # concurrency=4 matches the ubuntu runner's 4 vCPUs. The merged runner
        # alongside the tagged files runs race-free at 4 (verified locally at 4
        # and 6) with every skip_very_good_optimization tag still present — no
        # AppDatabase "database is locked", no path_provider collisions (#3137).
        # concurrency=1 once pushed the job past 1 hour because each tagged file
        # pays a full Dart VM startup; a higher ceiling overlaps those startups.
        #
        # DIVINE_STRICT_CHANNELS makes the heal-and-blame tearDown in
        # test/flutter_test_config.dart fail the test that left a shared
        # MethodChannel handler replaced, instead of only healing it for the
        # next suite (#5738). Without it the guard repairs the leak silently
        # and nothing reports who caused it, so the next such regression is
        # found the same way #5738 was: as an order-dependent failure
        # cross-attributed to an innocent suite. Turned on once the full suite
        # was proven clean under it, which the harness comment set as the
        # condition.
        #
        # The seed is drawn here rather than left as `random`. very_good
        # resolves `random` once and forwards the result to every sub-process,
        # so a shard already has exactly one seed — but it only ever reaches
        # the raw log. That is why every replay in #6880 cost a log dig, and
        # why two of its occurrences were never reproduced at all: nobody
        # captured one. Drawing it a line earlier keeps the same fresh-per-run
        # randomness and lets the summary step below survive the failure with
        # it. FLAGS is exported so that step prints the same options that ran,
        # instead of a copy that can drift from them.
        run: |
          SEED=$(( (RANDOM << 15) | RANDOM ))
          FLAGS="--optimization --concurrency=4 --exclude-tags integration --dart-define=DIVINE_STRICT_CHANNELS=true --dart-define=DIVINE_STRICT_HIVE_BOXES=true"
          {
            echo "TEST_SEED=$SEED"
            echo "TEST_FLAGS=$FLAGS"
          } >> "$GITHUB_ENV"
          # Word-split deliberately: FLAGS is a list of separate options.
          # shellcheck disable=SC2086
          very_good test $FLAGS --test-randomize-ordering-seed "$SEED"
      - name: 🎲 Report the seed so this shard can be replayed
        # A red shard reads as "your branch broke it" even when the branch is
        # innocent, and the first thing anyone needs is the seed. Publish it
        # with the exact recipe rather than leaving it in the raw log.
        if: ${{ failure() && env.TEST_SEED != '' }}
        run: |
          shard="${{ strategy.job-index }}/${{ strategy.job-total }}"
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          {
            echo "### Tests (shard $shard) failed — replay recipe"
            echo
            echo "Seed: \`$TEST_SEED\`"
            echo
            echo '```bash'
            echo "# select_test_shard.sh DELETES test files. Use a throwaway worktree."
            echo "git worktree add /tmp/shard-replay $sha"
            echo "cd /tmp/shard-replay/mobile"
            echo "# Pin the toolchain. The optimizer's bundle mechanics are version-sensitive,"
            echo "# so a stray flutter or very_good on PATH can bundle differently and replay"
            echo "# green against a failure that is still there. mise install reads the Flutter"
            echo "# pin from mobile/mise.toml; \`dart pub global run\` needs no PUB_CACHE on PATH."
            echo "mise install"
            echo "mise exec -- dart pub global activate very_good_cli $VERY_GOOD_CLI_VERSION"
            echo "mise exec -- flutter pub get"
            echo "bash scripts/ci/select_test_shard.sh --total ${{ strategy.job-total }} --index ${{ strategy.job-index }} --force"
            echo "# CI=true prefixes the test command only. GitHub sets it job-wide, so a"
            echo "# CI-gated test passes locally without it — but exporting it would also"
            echo "# satisfy select_test_shard.sh's guard and let that delete run unasked."
            echo "CI=true mise exec -- dart pub global run very_good_cli:very_good test $TEST_FLAGS --test-randomize-ordering-seed $TEST_SEED"
            echo '```'
            echo
            echo "Replay at that commit: a shard is a partition of the test files that exist there."
            echo
            echo "> Reproduction is effectively Linux-only. The merged bundle enumerates files differently on macOS, so the same seed yields a different permutation and a green local run is not evidence the failure is gone (#8330)."
            echo
            echo "> If the failing test is outside your diff, check whether it is one of the known cross-file pollution mechanisms in #6880 before assuming your branch caused it."
          } >> "$GITHUB_STEP_SUMMARY"
  vgv-tag-gate:
    name: VGV Tag Gate
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🏷️ Verify skip_very_good_optimization tag count does not increase
        # Guards #3137. The tag set drifts silently: a feature PR can add a
        # new `@Tags(['skip_very_good_optimization'])` opt-out without anyone
        # noticing, growing the CI debt. This step fails the PR when the
        # count exceeds `test/vgv_tag_baseline.txt`. Decreases are always
        # allowed; untag PRs may (but don't have to) lower the baseline to
        # ratchet progress — lowering makes the gate tighter for future PRs.
        run: |
          baseline=$(cat test/vgv_tag_baseline.txt | tr -d '[:space:]')
          current=$(grep -rln "skip_very_good_optimization" test | wc -l | tr -d '[:space:]')
          if [ "$current" -gt "$baseline" ]; then
            echo "❌ VGV tag count increased: baseline=$baseline, current=$current"
            echo ""
            echo "A new '@Tags([\"skip_very_good_optimization\"])' was added."
            echo "Either:"
            echo "  (a) fix the underlying test-isolation issue so the file"
            echo "      passes under the VGV optimizer without the tag, or"
            echo "  (b) if the tag is genuinely permanent (e.g. the file uses"
            echo "      IntegrationTestWidgetsFlutterBinding), add an inline"
            echo "      '// Permanent: <reason>' comment next to the tag AND"
            echo "      update mobile/test/vgv_tag_baseline.txt to $current."
            exit 1
          fi
          echo "✅ VGV tag count OK: current=$current, baseline=$baseline"
      - name: 🏷️ Verify no integration-only file-level @Tags
        # Guards the #5340 regression class (#5738). The generated
        # .test_optimizer.dart drops file-level @Tags, so
        # `--exclude-tags integration` CANNOT exclude a bundled file — an
        # 'integration'-only file tag is a dead letter that silently runs
        # inside the merged CI suite. A file-level integration tag is only
        # meaningful together with skip_very_good_optimization (run as a
        # separate suite, which -x integration then excludes).
        # Matching is whitespace-normalized so a dart-format-wrapped
        # multi-line @Tags([...]) cannot slip past as a false negative.
        run: |
          violations=""
          while IFS= read -r f; do
            flat=$(tr -d '[:space:]' < "$f")
            if grep -qE "@Tags\(\[[^]]*['\"]integration['\"]" <<<"$flat" \
              && ! grep -qE "@Tags\(\[[^]]*['\"]skip_very_good_optimization['\"]" <<<"$flat"; then
              violations="$violations  $f"$'\n'
            fi
          done < <(grep -rl "@Tags(" test --include='*.dart' || true)
          if [ -n "$violations" ]; then
            echo "❌ File-level @Tags(['integration']) without skip_very_good_optimization:"
            printf '%s' "$violations"
            echo ""
            echo "File-level @Tags are dropped inside the merged VGV bundle, so these"
            echo "files RUN in CI despite --exclude-tags integration. Either:"
            echo "  (a) remove the dead-letter 'integration' tag, or"
            echo "  (b) add 'skip_very_good_optimization' to the same @Tags annotation"
            echo "      (with a '// Permanent: <reason>' comment) and bump"
            echo "      mobile/test/vgv_tag_baseline.txt."
            exit 1
          fi
          echo "✅ No integration-only file-level @Tags"
  goldens:
    name: Goldens
    needs: changes
    # Golden tests render through enough of the app dependency graph that a
    # hand-maintained path allowlist cannot safely describe their inputs.
    if: ${{ needs.changes.outputs.app == 'true' || inputs.update_goldens }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: Restore dart hook downloads
        uses: actions/cache/restore@v6
        with:
          path: mobile/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-dart-hooks-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-hooks-
      # `flutter test` builds the whole package's native assets regardless of
      # which tests run, so this job pays the same unretried sqlite3mc
      # download the Tests job does. Same warm-up, same reason.
      - name: Warm sqlite3mc native assets
        run: bash scripts/ci/warmup_sqlite3mc.sh
      # Separate from the sharded Tests job on purpose. That job runs
      # `very_good test --optimization`, which merges every file into one
      # isolate; goldens need `flutter test` (one isolate per file) plus the
      # DIVINE_GOLDEN_TESTS font setup, and select_test_shard.sh drops
      # test/goldens/ from every shard so nothing runs twice.
      - name: 🖼️ Verify goldens
        if: ${{ !inputs.update_goldens }}
        run: bash scripts/golden.sh verify
      - name: 🖼️ Regenerate goldens
        if: ${{ inputs.update_goldens }}
        run: bash scripts/golden.sh update
      - name: Upload regenerated goldens
        if: ${{ inputs.update_goldens }}
        uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: mobile/test/goldens/**/goldens/*.png
          if-no-files-found: error
      # The diff is the only way to tell a real regression from a rendering
      # drift without a local Ubuntu run.
      - name: Upload golden failure diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: mobile/test/goldens/**/failures/*.png
          if-no-files-found: ignore

  web-bundle-size:
    name: Web Bundle Size
    needs: changes
    # This must run on merge_group as well as pull_request. Two individually
    # safe bundles can cross the provider limit when the queue combines them.
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build production web bundle
        run: |
          flutter build web \
            --release \
            --tree-shake-icons \
            --optimization-level=4 \
            --pwa-strategy=none \
            --dart-define=DEFAULT_ENV=PRODUCTION \
            --dart-define=BACKEND_URL=https://api.divine.video \
            --no-source-maps
      - name: Check web bundle file sizes
        run: bash scripts/check_web_bundle_file_size.sh build/web

  ios-native-tests:
    name: iOS Native Tests
    # The XCTests in mobile/ios/RunnerTests cover the Swift the Dart jobs
    # cannot reach: plugin registration and engine teardown, the camera's
    # media-session scoping, the Nostr bridge's frame attestation, and the
    # ProofMode vendor gate. Until this job existed nothing in CI compiled or
    # ran them, so a regression shipped with every check green (#9381). It
    # also builds the whole Runner target the way `flutter build ios` does,
    # which catches a pod or Swift-package resolution break on the PR instead
    # of on Codemagic after merge. Gated on the ios_native scope because a
    # macOS runner costs ten Linux minutes per minute.
    needs: changes
    if: ${{ needs.changes.outputs.ios_native == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26
        # The image defaults to Xcode 16; divine_camera targets iOS 26 API
        # behind `#available(iOS 26.0, *)`, which needs the iOS 26 SDK.
        run: |
          xcode="$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -1)"
          if [ ! -d "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner image"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate the iOS project and install pods
        # --config-only writes the plugin Swift package and runs pod install
        # without compiling. Flutter then raises the package's deployment
        # target to the project's, but skips that step when its
        # `xcodebuild -showBuildSettings` probe exceeds 60 s on a cold
        # machine, so the floor is repaired explicitly, like the Runner
        # scheme's pre-action does. Only the plugin package: FlutterFramework
        # ships without a platforms block, and giving it one at 16.0 makes
        # every plugin package that still declares iOS 12–15 unresolvable
        # against it. Codemagic can pass that manifest too only because its
        # full `flutter build ios` regenerates it before Xcode resolves.
        run: |
          flutter build ios --config-only --simulator --debug
          ruby scripts/ensure_ios_swift_package_floor.rb \
            'ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift'
      - name: Pick a simulator
        id: simulator
        # The newest available iOS runtime's first iPhone; device names change
        # with every Xcode, a runtime-sorted lookup does not.
        run: |
          udid="$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | contains("SimRuntime.iOS-")))
            | sort_by(.key | ltrimstr("com.apple.CoreSimulator.SimRuntime.iOS-")
                             | split("-") | map(tonumber))
            | reverse
            | map(.value[] | select(.isAvailable and (.name | startswith("iPhone"))))
            | first | .udid // empty')"
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"
      - name: Run RunnerTests
        working-directory: mobile/ios
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -only-testing:RunnerTests \
            -resultBundlePath "${RUNNER_TEMP}/RunnerTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "${RUNNER_TEMP}/xcodebuild-test.log" \
            | grep -E --line-buffered '^(Test [Cc]ase|Test [Ss]uite|\*\* (TEST|BUILD))|error:'
      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: runner-tests-results
          path: |
            ${{ runner.temp }}/RunnerTests.xcresult
            ${{ runner.temp }}/xcodebuild-test.log
          if-no-files-found: ignore

  mobile-ci:
    name: Mobile CI
    if: ${{ always() }}
    needs:
      - changes
      - codemagic-groups
      - ci-config-tests
      - generated-files
      - guards
      - async-safety
      - format
      - analyze
      - tests
      - vgv-tag-gate
      - goldens
      - web-bundle-size
      - ios-native-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Verify upstream jobs
        env:
          CODEMAGIC_GROUPS_RESULT: ${{ needs.codemagic-groups.result }}
          GENERATED_FILES_RESULT: ${{ needs.generated-files.result }}
          GUARDS_RESULT: ${{ needs.guards.result }}
          ASYNC_SAFETY_RESULT: ${{ needs.async-safety.result }}
          CI_CONFIG_TESTS_RESULT: ${{ needs.ci-config-tests.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          VGV_TAG_GATE_RESULT: ${{ needs.vgv-tag-gate.result }}
          GOLDENS_RESULT: ${{ needs.goldens.result }}
          WEB_BUNDLE_SIZE_RESULT: ${{ needs.web-bundle-size.result }}
          IOS_NATIVE_TESTS_RESULT: ${{ needs.ios-native-tests.result }}
          APP_CI_REQUIRED: ${{ needs.changes.outputs.app }}
          IOS_NATIVE_REQUIRED: ${{ needs.changes.outputs.ios_native }}
          UPDATE_GOLDENS: ${{ inputs.update_goldens }}
        run: |
          echo "app-ci-required: ${APP_CI_REQUIRED}"
          echo "codemagic-groups: ${CODEMAGIC_GROUPS_RESULT}"
          echo "generated-files: ${GENERATED_FILES_RESULT}"
          echo "guards: ${GUARDS_RESULT}"
          echo "async-safety: ${ASYNC_SAFETY_RESULT}"
          echo "ci-config-tests: ${CI_CONFIG_TESTS_RESULT}"
          echo "format: ${FORMAT_RESULT}"
          echo "analyze: ${ANALYZE_RESULT}"
          echo "tests: ${TESTS_RESULT}"
          echo "vgv-tag-gate: ${VGV_TAG_GATE_RESULT}"
          echo "goldens: ${GOLDENS_RESULT}"
          echo "web-bundle-size: ${WEB_BUNDLE_SIZE_RESULT}"
          echo "ios-native-required: ${IOS_NATIVE_REQUIRED}"
          echo "ios-native-tests: ${IOS_NATIVE_TESTS_RESULT}"

          # A regeneration dispatch skips `golden.sh verify`, so this run
          # compared no pixels. It publishes a check run named "Mobile CI" on
          # the same head SHA branch protection reads, so letting it report
          # success would overwrite the PR's real verdict with one that never
          # verified — at exactly the moment goldens are being changed. Fail
          # closed; the follow-up push of the regenerated references produces
          # the genuine verdict.
          if [ "${UPDATE_GOLDENS}" = "true" ]; then
            echo "Regeneration dispatch: goldens were not verified."
            echo "This run is not a merge verdict. Commit the regenerated"
            echo "references and push to get one."
            exit 1
          fi

          # Always required. This job is ungated so yaml-only PRs still run it;
          # skipped here would let those PRs merge without the guard.
          if [ "${CODEMAGIC_GROUPS_RESULT}" != "success" ]; then
            echo "Codemagic variable group check failed or did not run."
            exit 1
          fi

          required_results=(
            "${CI_CONFIG_TESTS_RESULT}"
            "${GENERATED_FILES_RESULT}"
            "${GUARDS_RESULT}"
            "${ASYNC_SAFETY_RESULT}"
            "${FORMAT_RESULT}"
            "${ANALYZE_RESULT}"
            "${TESTS_RESULT}"
            "${VGV_TAG_GATE_RESULT}"
          )

          # Goldens follow the app scope. Their transitive dependency graph is
          # too broad for an independently maintained path allowlist.
          if [ "${APP_CI_REQUIRED}" = "true" ]; then
            required_results+=("${GOLDENS_RESULT}")
            required_results+=("${WEB_BUNDLE_SIZE_RESULT}")
          elif [[ "${GOLDENS_RESULT}" != "success" && "${GOLDENS_RESULT}" != "skipped" ]]; then
            echo "Goldens failed or were cancelled despite app CI not being required."
            exit 1
          elif [[ "${WEB_BUNDLE_SIZE_RESULT}" != "success" && "${WEB_BUNDLE_SIZE_RESULT}" != "skipped" ]]; then
            echo "Web bundle size failed or was cancelled despite app CI not being required."
            exit 1
          fi

          # The native XCTests follow their own scope, narrower than app: a
          # Dart-only change never needs a macOS runner, an iOS one always does.
          if [ "${IOS_NATIVE_REQUIRED}" = "true" ]; then
            required_results+=("${IOS_NATIVE_TESTS_RESULT}")
          elif [[ "${IOS_NATIVE_TESTS_RESULT}" != "success" && "${IOS_NATIVE_TESTS_RESULT}" != "skipped" ]]; then
            echo "iOS native tests failed or were cancelled despite not being required."
            exit 1
          fi

          if [ "${APP_CI_REQUIRED}" = "false" ]; then
            for result in "${required_results[@]}"; do
              if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
                echo "One or more Mobile CI jobs failed or were cancelled."
                exit 1
              fi
            done
            echo "App CI intentionally skipped for this PR."
            exit 0
          fi

          for result in "${required_results[@]}"; do
            if [ "${result}" != "success" ]; then
              echo "One or more Mobile CI jobs failed."
              exit 1
            fi
          done

          if [ "${APP_CI_REQUIRED}" != "true" ]; then
            echo "Could not determine Mobile CI scope."
            exit 1
          fi
      - name: Checkout timing budget inputs
        uses: actions/checkout@v7
        if: ${{ needs.changes.outputs.app == 'true' }}
        with:
          sparse-checkout: |
            .github/ci-timing-budgets.json
            mobile/scripts/ci
          sparse-checkout-cone-mode: false
      - name: ⏱️ Check CI timing budget
        # This job only starts once every other job has finished, so the run's
        # job durations are final here. Budgets live in
        # .github/ci-timing-budgets.json; over-warn annotates the PR, over-fail
        # fails this gate. Guards the wins recorded in PERF_BASELINE.md from
        # eroding silently.
        if: ${{ needs.changes.outputs.app == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 mobile/scripts/ci/check_ci_timing_budget.py \
            --budgets .github/ci-timing-budgets.json \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}"
