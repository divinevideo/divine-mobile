name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: >-
          Regenerate golden references on the runner and upload them as an
          artifact instead of verifying. Download and commit the result — the
          references must be produced on the same OS that checks them.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # merge_group refs are the queue's only signal. Cancelling that run ejects
  # the PR even when the replacement job never starts (#7197).
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  changes:
    name: Detect App CI Scope
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.scope.outputs.app }}
      native: ${{ steps.scope.outputs.native }}
    steps:
      # Fetch only the test-backed detector. The changed-file list itself still
      # comes from the REST API, avoiding a full-history checkout on the
      # workflow's critical path (every other job `needs: changes`).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: mobile/scripts/ci/detect_mobile_ci_scope.sh
          sparse-checkout-cone-mode: false
      - name: Detect whether app CI is required
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: bash mobile/scripts/ci/detect_mobile_ci_scope.sh

  codex-config:
    name: Codex Configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated skills and lifecycle hooks
        run: bash .codex/scripts/test-config.sh

  codemagic-groups:
    # Deliberately ungated — no `needs: changes`, no `if:`.
    #
    # The scope detector classifies `codemagic.yaml` as out-of-app-scope, so a
    # PR touching only that file (#7191, the revert of the outage, is exactly
    # that shape) resolves app=false and skips every gated job. Gating this
    # check would therefore switch it off for the one change it exists to
    # police. Adding codemagic.yaml to the detector instead would drag the full
    # app test matrix along for a config edit.
    #
    # It costs a checkout plus a second of grep, so running it unconditionally
    # is cheaper than reasoning about when it should run.
    #
    # The required check is the `Mobile CI` aggregator, not this job's name.
    # `mobile-ci` therefore needs this job and fails unless it succeeds — even
    # when app CI is skipped — or a yaml-only PR can merge with a red guard.
    name: Codemagic Variable Groups
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 🔑 Verify every Codemagic variable group is documented
        # Static — no simulator, no build, no credentials — so fork PRs get it
        # too. Codemagic validates the whole config before provisioning, so an
        # undeclared group fails every workflow in the file and no in-script
        # guard can catch it (#7203).
        run: bash mobile/scripts/check_codemagic_groups.sh

  # Deliberately ungated: these tests protect release configuration that the
  # app-scope detector excludes, and the Mobile CI aggregator requires them.
  ci-config-tests:
    name: CI Configuration Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Provenance tests verify the historical release baseline tree.
          fetch-depth: 0
      - name: Run CI configuration unit tests
        run: python3 -m unittest discover -s .github/scripts/tests
      - name: 🛍️ Verify update URLs match shipped store identifiers
        run: bash mobile/scripts/check_store_url_identifiers.sh

  generated-files:
    name: Generated Files
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🔀 Fetch origin/main for ratchet baselines
        # The ratchet scripts below compare against origin/main. Fetch it once
        # here so each script is order-independent; a fetch failure fails the
        # job (the guards fail closed when the base baseline can't load).
        run: git fetch --quiet --depth=1 origin main
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: 📊 Verify pinned product analytics contract
        run: dart run tools/check_product_analytics_contract.dart
      - name: 🔒 Verify native transport security
        # Skipped when no native config changed. The guard's only inputs are
        # mobile/android/**, mobile/ios/**, mobile/macos/** and its own
        # script; if none of those moved, its verdict is identical to the one
        # main already recorded. Gating it also skips the apt install of
        # libxml2-utils (~42s, of which `apt-get update` alone is ~28s), which
        # is the single most expensive step in this job after codegen.
        if: ${{ needs.changes.outputs.native == 'true' }}
        run: |
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libxml2-utils
          fi
          bash scripts/check_native_transport_security.sh
      - name: 🍏 Verify iOS shipping target versions
        if: ${{ needs.changes.outputs.native == 'true' }}
        run: bash scripts/check_ios_shipping_versions.sh
      - name: 🌐 Verify backend-host defaults stay on *.divine.video
        run: bash scripts/check_backend_host_defaults.sh
      - name: 🪵 Verify no raw logging in production code
        run: bash scripts/check_raw_logging.sh
      - name: 🌐 Verify no untagged test mutates HttpOverrides.global
        run: bash scripts/check_http_overrides_isolation.sh
      - name: 🧬 Verify no untagged test leaks a process-global singleton
        run: bash scripts/check_process_global_mutations.sh
      - name: 🧯 Verify integration_test error-handler restores are exception-safe
        run: bash scripts/check_integration_test_error_restore_safety.sh
      - name: 🔌 Verify no new raw shared-channel installs (heal-and-blame ratchet)
        run: |
          # LIST ratchet vs origin/main (fails closed if the base baseline can't
          # load). The runtime heal-and-blame tearDown (flutter_test_config.dart)
          # is the primary guard; this freezes raw setMockMethodCallHandler
          # installs of the five shared channels so new ones must go through
          # overrideSharedChannel(...). #5738.
          bash scripts/check_shared_channel_overrides.sh
      - name: 📦 Verify no new package-test channel leaks (per-package merged-isolate ratchet)
        run: |
          # Packages analogue of the shared-channel ratchet above. Each package runs
          # its own very_good --optimization merged isolate and — unlike mobile/test —
          # has no flutter_test_config.dart heal-and-blame harness, so an un-torn-down
          # channel mock leaks across that package's suite. Freezes package *_test.dart
          # entries that install a channel handler without nulling any back down; new
          # ones must add a tearDown (or a skip tag). #5838.
          bash scripts/check_package_channel_isolation.sh
      - name: 🚧 Verify Riverpod boundary (@riverpod / StateProvider locations)
        run: bash scripts/check_riverpod_boundary.sh
      - name: 🚧 Verify ChangeNotifier boundary (sanctioned-allowlist ratchet)
        run: bash scripts/check_changenotifier_boundary.sh
      - name: 🚧 Verify UI does not import services directly (layering ratchet)
        # Compares the baseline against origin/main (fetched once at job start);
        # the guard fails closed when the base baseline cannot be loaded.
        run: bash scripts/check_ui_service_boundary.sh
      - name: 🚧 Verify lower layers do not import the UI (layer-direction ratchet)
        run: |
          # Mirror image of the guard above: providers/services/repositories/state
          # must not import screens, widgets, or the router, and route providers
          # must not import screens. Those upward edges drag the whole screen
          # graph — and through it app_providers.dart — into non-UI code. Route
          # locations come from the RoutePaths leaf instead. #7383 (wave #4506).
          bash scripts/check_layer_direction.sh
      - name: 🧪 Verify skipped-test count does not increase (skip-ceiling ratchet)
        run: |
          # Per-file CEILING over mobile/test, mobile/integration_test and
          # mobile/packages/*/test, from a Dart AST rather than a regex: the
          # regex missed a skip: whose reason dart format wrapped onto the next
          # line, could not see @Skip, and needed one file excluded by name.
          # Skip-debt epic: #4337 (WS-1) -> #4836. Fails closed if the baseline
          # can't load.
          bash scripts/check_skip_ceiling.sh
      - name: 🧪 Verify no test can pass unconditionally (placeholder ratchet)
        run: |
          # Frozen at ZERO: a test whose every assertion is trivially satisfied
          # (expect(true, isTrue)), or a *_test.dart declaring no test at all.
          # #3340 removed all 93 sites, so any hit is a regression. A test with
          # no assertion is deliberately not counted -- imported helpers and
          # third-party verifiers assert in ways one file cannot see. #3340.
          bash scripts/check_placeholder_tests.sh
      - name: 🧪 Verify no 'unchanged' assertion goes unpinned (state-tautology ratchet)
        run: |
          # Frozen at ZERO: a test whose only assertion compares a re-read of
          # state with an earlier read of it that was never pinned. Both operands
          # come from the state under test, so with the method inert the test
          # compares null with null (or 0 with 0) and stays green -- #8617 proved
          # one by mutation. The placeholder ratchet above cannot see it: nothing
          # here is a literal. Pin the baseline (expect(first, isNotNull)) before
          # the act. #8617.
          bash scripts/check_unpinned_unchanged_assertions.sh
      - name: ⏳ Verify Future.delayed-in-tests count does not increase (ratchet)
        run: bash scripts/check_future_delayed_ceiling.sh
      - name: ⏳ Verify Future.delayed-in-production count does not increase (ratchet)
        run: |
          # Production (mobile/lib) counterpart of the test-scoped ratchet above.
          # Fails closed if the base baseline cannot be loaded. Epic: #4339 (PR-4).
          bash scripts/check_future_delayed_production_ceiling.sh
      - name: 🧱 Verify untested-services count does not increase (floor ratchet)
        run: bash scripts/check_untested_services_floor.sh
      - name: 🧱 Verify singleton services do not regrow (DI ratchet)
        run: |
          # #4743: lazy-static singletons cannot be replaced in a test without
          # reaching into static state. The set drifts when nothing watches it —
          # #3623 counted 13, #4743 counted 14, and only 5 were left by the time
          # either was re-read. Epic: #4338.
          bash scripts/check_singleton_services.sh
      - name: 🧱 Verify service god-files do not grow (architecture ratchet)
        run: |
          # Hard architecture guard for #4338: the broad 800-line file-size
          # check remains advisory, but oversized service-layer god-files are
          # frozen at their recorded ceilings until a shrink is relocked.
          bash scripts/check_service_god_file_ceiling.sh
      - name: 🧱 Verify test/unit does not re-accrete (test-structure ratchet)
        run: |
          # Freezes the legacy non-mirroring test/unit bucket per-file so it can
          # only shrink. New tests must mirror lib/ (test/services/foo_test.dart),
          # never test/unit/. Fails closed if the base baseline cannot load.
          # Test-org epic: #4337 (WS-7).
          bash scripts/check_test_unit_structure.sh
      - name: 🧱 Verify no test declaration sits outside a group (test-structure ratchet)
        run: |
          # Issue #3615: a flat test file gives the runner nothing to nest, so
          # failures print as an undifferentiated wall and a file cannot be run
          # a slice at a time. Freezes the per-file count of test/testWidgets/
          # blocTest/patrolTest declarations outside any group() so it can only
          # shrink. Group by method name (repositories/services/clients), event
          # name (blocs/cubits), or renders/interactions/navigation (widgets).
          bash scripts/check_ungrouped_tests.sh
      - name: 🧱 Verify every package ships analysis options + a CI workflow (package CI floor)
        run: |
          # Issues #3574 / #3575: optionless packages silently inherit the
          # app's relaxed analyzer config; workflow-less packages get no CI.
          bash scripts/check_package_ci_floor.sh
      - name: 🧱 Verify no package re-adds a runtime Flutter dependency (boundary ratchet)
        run: |
          # Issue #3338. A package with no `flutter: sdk: flutter` entry has
          # `depend_on_referenced_packages` rejecting every package:flutter
          # import in its lib/ and test/, which is what makes the repository
          # layer boundary enforced rather than conventional. Freezes the set of
          # packages that still declare one so re-opening a boundary is a
          # reviewable baseline edit. Fails closed if the base baseline can't load.
          bash scripts/check_package_flutter_boundary.sh
      - name: 🔗 Verify dependency provenance (git refs + overrides ratchet)
        run: |
          # Issues #3655 / #3363 (AC3): freezes the set of dependencies resolved
          # from outside pub.dev, and rejects a movable git ref unconditionally
          # (a branch or tag can be repointed under the build).
          bash scripts/check_dependency_provenance.sh
      - name: 🧱 Verify per-package coverage floors do not decrease (coverage floor ratchet)
        run: |
          # Follow-up to #3575: each package workflow's min_coverage is locked in
          # a baseline and may only RISE. VGV already fails when measured coverage
          # drops below the floor; this stops the floor itself from being lowered.
          # Fails closed if the base baseline cannot be loaded.
          bash scripts/check_package_coverage_floor.sh
      - name: 🧯 Verify empty-catch count does not increase (reliability ratchet)
        run: |
          # Reliability ceilings (epic #4336). Each fails closed if the base
          # baseline cannot be loaded.
          bash scripts/check_empty_catch_ceiling.sh
      - name: 🧯 Verify service error-sentinel count does not increase (reliability ratchet)
        run: bash scripts/check_service_sentinel_ceiling.sh
      - name: 🧯 Verify ARB {error}-interpolation count does not increase (reliability ratchet)
        run: bash scripts/check_arb_error_ceiling.sh
      - name: 🧭 Verify Maestro suite copy stays aligned (e2e drift guard)
        run: |
          # BLOCKING by decision (review on #6978): a copy change that breaks
          # the E2E suite is real breakage, so this fails the job like every
          # sibling ratchet above. Unrelated ARB edits that trip it are fixed
          # by regenerating the baseline in the same PR (UPDATE_BASELINE=1).
          # Copy drift rotted the Maestro suite silently between 2026-03 and
          # 2026-08 (#6948): copy in lib/l10n/app_en.arb and the flows diverged
          # with nothing failing. The guard binds every asserted literal to its
          # ARB key.
          bash scripts/check_maestro_copy_drift.sh
      - name: 🧭 Verify Maestro flow references resolve (e2e drift guard)
        run: |
          # Keep this independent from copy drift so contributors see both
          # failures in one CI run. macOS hides case errors the linux_x2 runner
          # hard-fails on.
          bash e2e/maestro/scripts/check_refs.sh
      - name: 📏 Report oversized files (advisory — does not block CI)
        run: |
          # The 800-line file-size ceiling is advisory (team decision): it
          # reports new oversized files and files that grew relative to main as
          # a warning, but the script always exits 0 and never fails
          # the job. Surface the findings as a GitHub warning annotation so they
          # bubble up to the PR. Oversized-file epic: #4339 (PR-1).
          output="$(bash scripts/check_file_size_ceiling.sh)"
          echo "$output"
          if printf '%s\n' "$output" | grep -q '^WARN \[file_size_ceiling\]'; then
            echo "::warning title=File-size ceiling (advisory)::One or more Dart files are newly over 800 lines or grew relative to main. This is advisory and does not block CI — see the step log for the list."
          fi
      - name: 🎨 Verify raw Icons.* count matches its frozen ceiling (DivineIcon ratchet)
        run: |
          # Freezes the deferred raw Material Icons.* residue (#4803) per-file so
          # the migration can only shrink. origin/main provides the base ref for
          # the anti-bypass check; fails closed if it cannot load the baseline.
          bash scripts/check_raw_icons_ceiling.sh
      - name: 🎨 Verify raw TextStyle( count matches its frozen ceiling (VineTheme ratchet)
        run: |
          # Design-system drift ceilings (#6145, epic #4339). Each freezes a
          # per-file count of raw UI patterns under mobile/lib so new drift is
          # intentional; existing debt is baselined, not fixed. Fails closed if
          # the base baseline cannot be loaded. New UI must use the divine_ui /
          # VineTheme sanctioned replacements — see the script headers.
          bash scripts/check_raw_textstyle_ceiling.sh
      - name: 🎨 Verify raw color count matches its frozen ceiling (VineTheme ratchet)
        run: bash scripts/check_raw_colors_ceiling.sh
      - name: 🎨 Verify direct Material-button count matches its frozen ceiling (DivineButton ratchet)
        run: bash scripts/check_material_button_ceiling.sh
      - name: 🎨 Verify raw dialog/bottom-sheet count matches its frozen ceiling (VineBottomSheet ratchet)
        run: bash scripts/check_raw_dialog_ceiling.sh
      - name: 🎨 Verify no VineTheme.*Font( call omits its color (light-mode ratchet)
        run: bash scripts/check_implicit_font_color_ceiling.sh
      - name: 🔙 Verify raw back-button pop count does not increase (safePop ratchet)
        run: bash scripts/check_unsafe_back_pop_ceiling.sh
      - name: 🧨 Verify post-close emit/add count does not increase (close-guard ratchet)
        run: |
          # Issue #7370, prevention follow-up to the #7293 Crashlytics
          # aggregates fixed in #7356. Freezes the per-file count of bloc/cubit
          # emit()/add() calls that can run after close() with no isClosed
          # guard, so the "Cannot emit/add … after calling close" crash class
          # can only shrink. Fix with emitIfOpen / addIfOpen from
          # lib/blocs/close_guard.dart.
          bash scripts/check_post_close_emit_ceiling.sh
      - name: ⏱️ Verify no uncancellable timer-backed waits (frozen at zero)
        run: |
          # Issue #8457, epic #4339. A `Timer(...)` nobody holds whose callback
          # completes a Completer somebody awaits is a wall-clock wait with no
          # owner: dispose() cannot cancel it, so the awaiting code resumes into
          # a torn-down owner. It is Future.delayed with the name filed off, and
          # check_future_delayed_production_ceiling.sh greps that literal, so it
          # cannot see this shape at all. Fix with AsyncScope from
          # lib/utils/async_utils.dart.
          bash scripts/check_uncancellable_timer_wait.sh
      - name: 🧷 Verify shared-setUp stubs do not accrete (inherited-stub ratchet)
        run: |
          # Issue #8399, follow-up to #8170 / #7324. A stub in a shared setUp is
          # invisible at every call site that inherits it, so a class of bug can
          # go unobservable across a whole file -- #7324 shipped exactly that
          # way. The shape also accretes silently: dm_repository_test.dart's
          # block went from 6 stubs to 21 across 13 PRs, none of which looked
          # wrong alone. Freezes the per-file count of stubs registered in a
          # file-level or outermost-group setUp that descendant groups inherit,
          # for files carrying 10 or more. Fix by declaring the stub in the
          # groups that depend on it.
          bash scripts/check_shared_setup_stubs.sh
      - name: 🔑 Verify no Nostr ID is shortened into a log (full-identifier ratchet)
        run: |
          # Issue #3372. Freezes at ZERO the per-file count of Nostr identifiers
          # shortened on the way into a log/debug sink, across mobile/lib,
          # mobile/packages, mobile/test and mobile/integration_test. A truncated
          # id looks correlatable and is not: `npub1abc...wxyz` cannot be grepped
          # against relay logs or matched to a funnelcake row, and 8 hex of an
          # event id is 32 bits. UI shortening is NOT counted (display sink), and
          # secrets are redacted whole rather than shortened — see the script
          # header. AGENTS.md -> Nostr And Async Rules.
          bash scripts/check_nostr_id_log_truncation.sh
      - name: 🪪 Verify pubkeys reach logs as npub plus hex (encoding ratchet)
        run: |
          # Issue #8066, successor to #3372. Freezes at ZERO the per-file count
          # of pubkeys interpolated into a log/debug sink in one encoding across
          # mobile/lib and mobile/packages. Hex greps against relay and backend
          # rows; npub is the only form a person can paste into a client, and
          # Zendesk bug reports are one-way, so the log has to carry both. Fix
          # with pubkeyForLogs (packages/nostr_sdk/lib/nip19/pubkey_for_logs.dart),
          # which takes either encoding and truncates neither. Counts, booleans
          # and collections that merely mention a pubkey are NOT counted.
          bash scripts/check_pubkey_log_encoding.sh
      - name: 🌍 Verify delegate-less MaterialApp count does not increase (l10n ratchet)
        run: |
          # Issue #3613. Freezes the per-file count of MaterialApp /
          # CupertinoApp / WidgetsApp constructions under mobile/test that
          # register no AppLocalizations delegate, so `context.l10n` under a
          # test app can only get safer. Without a delegate that read is
          # `Localizations.of<AppLocalizations>(...)!` on a null and throws
          # "Null check operator used on a null value" — silently, only once a
          # widget under test happens to reach it. Prefer testMaterialApp(...)
          # from test/helpers/test_provider_overrides.dart.
          bash scripts/check_l10n_delegates_ceiling.sh
      - name: 🏷️ Verify Divine UI semantic labels stay localized (a11y ratchet)
        run: |
          # Issue #7901. Freezes app call sites that can render a public
          # divine_ui control while relying on its English semantic-label
          # fallback. The AST detector understands conditional controls and
          # constructor/static-helper forms, so non-password fields and sheets
          # without completion actions do not create noise.
          bash scripts/check_divine_ui_semantic_label_defaults.sh
      - name: 🔢 Verify countable ARB keys carry ICU plurals (l10n ratchet)
        run: |
          # Issue #3633. Freezes the set of app_en.arb keys that interpolate a
          # count but have no ICU plural. A flat countable key still renders the
          # number — it just stops inflecting the noun, so English ships
          # "1 videos". Nothing else catches this: arb_consistency_test checks
          # key and placeholder parity, and plural_arm_number_test (#7153) only
          # fires on arms that already exist. Most baseline entries are
          # permanent (units, percentages, ordinals, ratios) and must NEVER be
          # pluralized — each carries a trailing '# reason'.
          bash scripts/check_countable_plural_floor.sh
      - name: 🗑️ Verify every ARB key is actually rendered (l10n ratchet)
        run: |
          # Issue #3630. Freezes the set of app_en.arb keys that nothing
          # under mobile/lib renders (lib only — a test cannot render a string,
          # and a findsNothing assertion is evidence the key is DEAD). An
          # orphaned key is translated
          # into 21 locales and compiled into AppLocalizations, yet never
          # rendered — usually while the string it was written for sits
          # hardcoded in a widget, still broken for non-English users. Nothing
          # else sees it: arb_consistency_test proves a key exists in every
          # locale (an orphan passes in all 22), and `flutter analyze` cannot
          # report an unused getter on a generated class. Baseline entries are
          # a worklist, each carrying '# wire: <path>:<line>' or
          # '# staged: <why>'.
          bash scripts/check_orphaned_arb_key_floor.sh
      - name: 🔐 Verify no profile publish reaches the ungated read provider (#6423)
        run: bash scripts/check_profile_read_write_split.sh
      - name: 🔨 Verify generated files are up-to-date
        run: |
          dart run build_runner build
          if [ -n "$(git status --porcelain)" ]; then
            echo "⚠️ Generated files are out of date. Please run 'dart run build_runner build' and commit the changes."
            git diff --name-only
            exit 1
          fi
      - name: 🌐 Verify l10n generated files
        run: |
          flutter gen-l10n
          if [ -n "$(git status --porcelain)" ]; then
            echo "⚠️ L10n generated files are out of date. Please run 'flutter gen-l10n' and commit the changes."
            git diff --name-only
            exit 1
          fi
  format:
    name: Format
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        # Required: `dart format` reads page width from analysis_options.yaml,
        # which `include`s package:very_good_analysis. Without a resolved
        # package config that include fails and the formatter silently falls
        # back to its defaults, reformatting 529 files.
        run: flutter pub get
      - name: ✨ Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tools
  analyze:
    name: Analyze
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: 🕵️ Analyze code
        run: flutter analyze lib test integration_test tools
  tests:
    name: Tests (shard ${{ strategy.job-index }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    env:
      # Single copy of the pin: the install step activates this version and the
      # replay recipe prints it. A second hardcoded copy could drift from what
      # CI actually ran, which is the failure the recipe exists to prevent.
      VERY_GOOD_CLI_VERSION: "1.3.0"
    strategy:
      # Every shard must report. Stopping the others on one failure hides
      # additional failures and forces a second full round-trip to find them.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: Restore dart hook downloads
        # Native-asset hooks store downloaded libs under this tree.
        # flutter-action cache: true does not keep it. merge_group can restore
        # but not save (#7197), so only push-to-main warms the cache.
        uses: actions/cache/restore@v6
        with:
          path: mobile/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-dart-hooks-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-hooks-
      - name: Warm sqlite3mc native assets
        # Retries the one hook that does an unretried GitHub Releases GET.
        # A cache hit skips that download; a miss still gets five attempts.
        run: bash scripts/ci/warmup_sqlite3mc.sh
      - name: Save dart hook downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && strategy.job-index == 0
        uses: actions/cache/save@v6
        with:
          path: mobile/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-dart-hooks-${{ hashFiles('mobile/pubspec.lock') }}
      - name: 🛠️ Install Very Good CLI
        # Pinned so the optimizer's bundle mechanics don't float under CI. The
        # version lives in VERY_GOOD_CLI_VERSION above so the replay recipe
        # prints the same one; 1.1.1≡1.2.0≡1.3.0 for all test/optimizer
        # mechanics (package workflows pin 1.1.1 via very_good_workflows). #5738.
        run: dart pub global activate very_good_cli "$VERY_GOOD_CLI_VERSION"
      - name: 🔪 Reduce test/ to this shard
        # --optimization bundles every untagged test file into ONE suite, so
        # --concurrency=4 has nothing left to schedule once the 18 tagged files
        # finish and the bulk of the run is single-core. Splitting the file set
        # across 4 runners gives each one a smaller bundle and puts the four
        # vCPUs of four machines on the problem instead of one core of one.
        # The script is a pure partition of test/**/*_test.dart — see
        # test/tools/select_test_shard_test.dart.
        run: bash scripts/ci/select_test_shard.sh --total ${{ strategy.job-total }} --index ${{ strategy.job-index }}
      - name: 🚀 Run Flutter tests
        # concurrency=4 matches the ubuntu runner's 4 vCPUs. The merged runner
        # alongside the tagged files runs race-free at 4 (verified locally at 4
        # and 6) with every skip_very_good_optimization tag still present — no
        # AppDatabase "database is locked", no path_provider collisions (#3137).
        # concurrency=1 once pushed the job past 1 hour because each tagged file
        # pays a full Dart VM startup; a higher ceiling overlaps those startups.
        #
        # DIVINE_STRICT_CHANNELS makes the heal-and-blame tearDown in
        # test/flutter_test_config.dart fail the test that left a shared
        # MethodChannel handler replaced, instead of only healing it for the
        # next suite (#5738). Without it the guard repairs the leak silently
        # and nothing reports who caused it, so the next such regression is
        # found the same way #5738 was: as an order-dependent failure
        # cross-attributed to an innocent suite. Turned on once the full suite
        # was proven clean under it, which the harness comment set as the
        # condition.
        #
        # The seed is drawn here rather than left as `random`. very_good
        # resolves `random` once and forwards the result to every sub-process,
        # so a shard already has exactly one seed — but it only ever reaches
        # the raw log. That is why every replay in #6880 cost a log dig, and
        # why two of its occurrences were never reproduced at all: nobody
        # captured one. Drawing it a line earlier keeps the same fresh-per-run
        # randomness and lets the summary step below survive the failure with
        # it. FLAGS is exported so that step prints the same options that ran,
        # instead of a copy that can drift from them.
        run: |
          SEED=$(( (RANDOM << 15) | RANDOM ))
          FLAGS="--optimization --concurrency=4 --exclude-tags integration --dart-define=DIVINE_STRICT_CHANNELS=true"
          {
            echo "TEST_SEED=$SEED"
            echo "TEST_FLAGS=$FLAGS"
          } >> "$GITHUB_ENV"
          # Word-split deliberately: FLAGS is a list of separate options.
          # shellcheck disable=SC2086
          very_good test $FLAGS --test-randomize-ordering-seed "$SEED"
      - name: 🎲 Report the seed so this shard can be replayed
        # A red shard reads as "your branch broke it" even when the branch is
        # innocent, and the first thing anyone needs is the seed. Publish it
        # with the exact recipe rather than leaving it in the raw log.
        if: ${{ failure() && env.TEST_SEED != '' }}
        run: |
          shard="${{ strategy.job-index }}/${{ strategy.job-total }}"
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          {
            echo "### Tests (shard $shard) failed — replay recipe"
            echo
            echo "Seed: \`$TEST_SEED\`"
            echo
            echo '```bash'
            echo "# select_test_shard.sh DELETES test files. Use a throwaway worktree."
            echo "git worktree add /tmp/shard-replay $sha"
            echo "cd /tmp/shard-replay/mobile"
            echo "# Pin the toolchain. The optimizer's bundle mechanics are version-sensitive,"
            echo "# so a stray flutter or very_good on PATH can bundle differently and replay"
            echo "# green against a failure that is still there. mise install reads the Flutter"
            echo "# pin from mobile/mise.toml; \`dart pub global run\` needs no PUB_CACHE on PATH."
            echo "mise install"
            echo "mise exec -- dart pub global activate very_good_cli $VERY_GOOD_CLI_VERSION"
            echo "mise exec -- flutter pub get"
            echo "bash scripts/ci/select_test_shard.sh --total ${{ strategy.job-total }} --index ${{ strategy.job-index }} --force"
            echo "# CI=true prefixes the test command only. GitHub sets it job-wide, so a"
            echo "# CI-gated test passes locally without it — but exporting it would also"
            echo "# satisfy select_test_shard.sh's guard and let that delete run unasked."
            echo "CI=true mise exec -- dart pub global run very_good_cli:very_good test $TEST_FLAGS --test-randomize-ordering-seed $TEST_SEED"
            echo '```'
            echo
            echo "Replay at that commit: a shard is a partition of the test files that exist there."
            echo
            echo "> Reproduction is effectively Linux-only. The merged bundle enumerates files differently on macOS, so the same seed yields a different permutation and a green local run is not evidence the failure is gone (#8330)."
            echo
            echo "> If the failing test is outside your diff, check whether it is one of the known cross-file pollution mechanisms in #6880 before assuming your branch caused it."
          } >> "$GITHUB_STEP_SUMMARY"
  vgv-tag-gate:
    name: VGV Tag Gate
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🏷️ Verify skip_very_good_optimization tag count does not increase
        # Guards #3137. The tag set drifts silently: a feature PR can add a
        # new `@Tags(['skip_very_good_optimization'])` opt-out without anyone
        # noticing, growing the CI debt. This step fails the PR when the
        # count exceeds `test/vgv_tag_baseline.txt`. Decreases are always
        # allowed; untag PRs may (but don't have to) lower the baseline to
        # ratchet progress — lowering makes the gate tighter for future PRs.
        run: |
          baseline=$(cat test/vgv_tag_baseline.txt | tr -d '[:space:]')
          current=$(grep -rln "skip_very_good_optimization" test | wc -l | tr -d '[:space:]')
          if [ "$current" -gt "$baseline" ]; then
            echo "❌ VGV tag count increased: baseline=$baseline, current=$current"
            echo ""
            echo "A new '@Tags([\"skip_very_good_optimization\"])' was added."
            echo "Either:"
            echo "  (a) fix the underlying test-isolation issue so the file"
            echo "      passes under the VGV optimizer without the tag, or"
            echo "  (b) if the tag is genuinely permanent (e.g. the file uses"
            echo "      IntegrationTestWidgetsFlutterBinding), add an inline"
            echo "      '// Permanent: <reason>' comment next to the tag AND"
            echo "      update mobile/test/vgv_tag_baseline.txt to $current."
            exit 1
          fi
          echo "✅ VGV tag count OK: current=$current, baseline=$baseline"
      - name: 🏷️ Verify no integration-only file-level @Tags
        # Guards the #5340 regression class (#5738). The generated
        # .test_optimizer.dart drops file-level @Tags, so
        # `--exclude-tags integration` CANNOT exclude a bundled file — an
        # 'integration'-only file tag is a dead letter that silently runs
        # inside the merged CI suite. A file-level integration tag is only
        # meaningful together with skip_very_good_optimization (run as a
        # separate suite, which -x integration then excludes).
        # Matching is whitespace-normalized so a dart-format-wrapped
        # multi-line @Tags([...]) cannot slip past as a false negative.
        run: |
          violations=""
          while IFS= read -r f; do
            flat=$(tr -d '[:space:]' < "$f")
            if grep -qE "@Tags\(\[[^]]*['\"]integration['\"]" <<<"$flat" \
              && ! grep -qE "@Tags\(\[[^]]*['\"]skip_very_good_optimization['\"]" <<<"$flat"; then
              violations="$violations  $f"$'\n'
            fi
          done < <(grep -rl "@Tags(" test --include='*.dart' || true)
          if [ -n "$violations" ]; then
            echo "❌ File-level @Tags(['integration']) without skip_very_good_optimization:"
            printf '%s' "$violations"
            echo ""
            echo "File-level @Tags are dropped inside the merged VGV bundle, so these"
            echo "files RUN in CI despite --exclude-tags integration. Either:"
            echo "  (a) remove the dead-letter 'integration' tag, or"
            echo "  (b) add 'skip_very_good_optimization' to the same @Tags annotation"
            echo "      (with a '// Permanent: <reason>' comment) and bump"
            echo "      mobile/test/vgv_tag_baseline.txt."
            exit 1
          fi
          echo "✅ No integration-only file-level @Tags"
  goldens:
    name: Goldens
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: "stable"
          cache: true
      - name: 📦 Install dependencies
        run: flutter pub get
      - name: Restore dart hook downloads
        uses: actions/cache/restore@v6
        with:
          path: mobile/.dart_tool/hooks_runner/shared
          key: ${{ runner.os }}-dart-hooks-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-hooks-
      # `flutter test` builds the whole package's native assets regardless of
      # which tests run, so this job pays the same unretried sqlite3mc
      # download the Tests job does. Same warm-up, same reason.
      - name: Warm sqlite3mc native assets
        run: bash scripts/ci/warmup_sqlite3mc.sh
      # Separate from the sharded Tests job on purpose. That job runs
      # `very_good test --optimization`, which merges every file into one
      # isolate; goldens need `flutter test` (one isolate per file) plus the
      # DIVINE_GOLDEN_TESTS font setup, and select_test_shard.sh drops
      # test/goldens/ from every shard so nothing runs twice.
      - name: 🖼️ Verify goldens
        if: ${{ !inputs.update_goldens }}
        run: bash scripts/golden.sh verify
      - name: 🖼️ Regenerate goldens
        if: ${{ inputs.update_goldens }}
        run: bash scripts/golden.sh update
      - name: Upload regenerated goldens
        if: ${{ inputs.update_goldens }}
        uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: mobile/test/goldens/**/goldens/*.png
          if-no-files-found: error
      # The diff is the only way to tell a real regression from a rendering
      # drift without a local Ubuntu run.
      - name: Upload golden failure diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: mobile/test/goldens/**/failures/*.png
          if-no-files-found: ignore

  mobile-ci:
    name: Mobile CI
    if: ${{ always() }}
    needs:
      - changes
      - codemagic-groups
      - ci-config-tests
      - generated-files
      - format
      - analyze
      - tests
      - vgv-tag-gate
      - goldens
    runs-on: ubuntu-24.04
    steps:
      - name: Verify upstream jobs
        env:
          CODEMAGIC_GROUPS_RESULT: ${{ needs.codemagic-groups.result }}
          GENERATED_FILES_RESULT: ${{ needs.generated-files.result }}
          CI_CONFIG_TESTS_RESULT: ${{ needs.ci-config-tests.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          VGV_TAG_GATE_RESULT: ${{ needs.vgv-tag-gate.result }}
          GOLDENS_RESULT: ${{ needs.goldens.result }}
          APP_CI_REQUIRED: ${{ needs.changes.outputs.app }}
          UPDATE_GOLDENS: ${{ inputs.update_goldens }}
        run: |
          echo "app-ci-required: ${APP_CI_REQUIRED}"
          echo "codemagic-groups: ${CODEMAGIC_GROUPS_RESULT}"
          echo "generated-files: ${GENERATED_FILES_RESULT}"
          echo "ci-config-tests: ${CI_CONFIG_TESTS_RESULT}"
          echo "format: ${FORMAT_RESULT}"
          echo "analyze: ${ANALYZE_RESULT}"
          echo "tests: ${TESTS_RESULT}"
          echo "vgv-tag-gate: ${VGV_TAG_GATE_RESULT}"
          echo "goldens: ${GOLDENS_RESULT}"

          # A regeneration dispatch skips `golden.sh verify`, so this run
          # compared no pixels. It publishes a check run named "Mobile CI" on
          # the same head SHA branch protection reads, so letting it report
          # success would overwrite the PR's real verdict with one that never
          # verified — at exactly the moment goldens are being changed. Fail
          # closed; the follow-up push of the regenerated references produces
          # the genuine verdict.
          if [ "${UPDATE_GOLDENS}" = "true" ]; then
            echo "Regeneration dispatch: goldens were not verified."
            echo "This run is not a merge verdict. Commit the regenerated"
            echo "references and push to get one."
            exit 1
          fi

          # Always required. This job is ungated so yaml-only PRs still run it;
          # skipped here would let those PRs merge without the guard.
          if [ "${CODEMAGIC_GROUPS_RESULT}" != "success" ]; then
            echo "Codemagic variable group check failed or did not run."
            exit 1
          fi

          results=(
            "${CI_CONFIG_TESTS_RESULT}"
            "${GENERATED_FILES_RESULT}"
            "${FORMAT_RESULT}"
            "${ANALYZE_RESULT}"
            "${TESTS_RESULT}"
            "${VGV_TAG_GATE_RESULT}"
            "${GOLDENS_RESULT}"
          )

          if [ "${APP_CI_REQUIRED}" = "false" ]; then
            for result in "${results[@]}"; do
              if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
                echo "One or more Mobile CI jobs failed or were cancelled."
                exit 1
              fi
            done
            echo "App CI intentionally skipped for this PR."
            exit 0
          fi

          for result in "${results[@]}"; do
            if [ "${result}" != "success" ]; then
              echo "One or more Mobile CI jobs failed."
              exit 1
            fi
          done

          if [ "${APP_CI_REQUIRED}" != "true" ]; then
            echo "Could not determine Mobile CI scope."
            exit 1
          fi
      - name: Checkout timing budget inputs
        uses: actions/checkout@v7
        if: ${{ needs.changes.outputs.app == 'true' }}
        with:
          sparse-checkout: |
            .github/ci-timing-budgets.json
            mobile/scripts/ci
          sparse-checkout-cone-mode: false
      - name: ⏱️ Check CI timing budget
        # This job only starts once every other job has finished, so the run's
        # job durations are final here. Budgets live in
        # .github/ci-timing-budgets.json; over-warn annotates the PR, over-fail
        # fails this gate. Guards the wins recorded in PERF_BASELINE.md from
        # eroding silently.
        if: ${{ needs.changes.outputs.app == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 mobile/scripts/ci/check_ci_timing_budget.py \
            --budgets .github/ci-timing-budgets.json \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}"
