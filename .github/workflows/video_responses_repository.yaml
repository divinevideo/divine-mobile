# ABOUTME: CI workflow for the video_responses_repository package.
# ABOUTME: Runs tests, formatting, and analysis only when video_responses_repository files change.

name: Video Responses Repository CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/video_responses_repository/**"
      - ".github/workflows/video_responses_repository.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/video_responses_repository/**"
      - ".github/workflows/video_responses_repository.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      run_bloc_lint: true
      working_directory: "mobile/packages/video_responses_repository"
      flutter_version: "3.47.2"
