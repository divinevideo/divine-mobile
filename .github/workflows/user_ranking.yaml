# ABOUTME: CI workflow for the user_ranking package.
# ABOUTME: Runs tests, formatting, and analysis only when user_ranking files change.

name: User Ranking CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/user_ranking/**"
      - ".github/workflows/user_ranking.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/user_ranking/**"
      - ".github/workflows/user_ranking.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      working_directory: "mobile/packages/user_ranking"
      flutter_version: "3.47.2"
