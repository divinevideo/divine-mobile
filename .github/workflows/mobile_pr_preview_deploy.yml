# ABOUTME: Deploys a trusted divine-mobile PR preview artifact to the openvine-app Cloudflare Pages project
# ABOUTME: Uses workflow_run so fork PRs can build safely without exposing Cloudflare secrets to untrusted code

name: Mobile PR Preview Deploy

on:
  workflow_run:
    workflows: ["Mobile PR Preview Build"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Deploy PR Preview To Cloudflare
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download preview artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: mobile-pr-preview
          path: artifact

      - name: Resolve preview provenance from the originating run
        id: metadata
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { previewProvenance } = require('./.github/scripts/mobile_preview_provenance.cjs');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            // PR identity comes from GitHub. Artifact-owned PR/head fields are ignored.
            const associatedPulls = run.pull_requests.length ? run.pull_requests : await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner: context.repo.owner, repo: context.repo.repo, commit_sha: run.head_sha },
            );
            const candidates = [];
            for (const candidate of associatedPulls) {
              const { data: value } = await github.rest.pulls.get({
                owner: context.repo.owner, repo: context.repo.repo, pull_number: candidate.number,
              });
              if (value.base.repo.full_name === context.payload.repository.full_name &&
                  value.base.ref === 'main' && value.head.sha === run.head_sha &&
                  value.head.ref === run.head_branch && value.head.repo.id === run.head_repository.id)
                candidates.push(value);
            }
            if (candidates.length !== 1) throw new Error('Preview run must identify one matching PR');
            const pr = candidates[0];
            const metadata = JSON.parse(fs.readFileSync('artifact/pr-web-preview-metadata.json', 'utf8'));
            if (!/^[a-f0-9]{40}$/.test(metadata.build_sha)) throw new Error('Invalid build SHA');
            const { data: commit } = await github.rest.git.getCommit({
              owner: context.repo.owner, repo: context.repo.repo,
              commit_sha: metadata.build_sha,
            });
            // GitHub merges the PR head into main's tip at event time, so the
            // first parent need only be a commit main contains.
            let firstParentComparison;
            const firstParent = commit.parents.length === 2 ? commit.parents[0].sha : '';
            if (/^[a-f0-9]{40}$/.test(firstParent)) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner, repo: context.repo.repo,
                basehead: `${firstParent}...main`, per_page: 1,
              });
              firstParentComparison = comparison.status;
            }
            const provenance = previewProvenance({
              run, pr, metadata, commit, firstParentComparison, associatedPulls,
            });
            core.setOutput('pr_number', provenance.prNumber);
            core.setOutput('head_ref', provenance.headRef);
            core.setOutput('head_sha', provenance.headSha);
            core.setOutput('build_sha', provenance.buildSha);
            core.setOutput('preview_branch', `pr-${provenance.prNumber}`);
            core.setOutput('deploy_commit_message', `PR #${provenance.prNumber} preview head=${provenance.headSha} build=${provenance.buildSha}`);

      - name: Check artifact freshness against current PR head
        id: freshness
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number('${{ steps.metadata.outputs.pr_number }}');
            const artifactSha = '${{ steps.metadata.outputs.head_sha }}';

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const deployable =
              pr.state === 'open' && !pr.draft && pr.head.sha === artifactSha;

            core.setOutput('deployable', deployable ? 'true' : 'false');
            core.setOutput('current_sha', pr.head.sha);
            core.setOutput('pr_state', pr.state);
            core.setOutput('is_draft', pr.draft ? 'true' : 'false');

      - name: Skip stale preview artifact
        if: ${{ steps.freshness.outputs.deployable != 'true' }}
        run: |
          echo "Skipping stale preview artifact."
          echo "PR state: ${{ steps.freshness.outputs.pr_state }}"
          echo "PR draft: ${{ steps.freshness.outputs.is_draft }}"
          echo "Artifact SHA: ${{ steps.metadata.outputs.head_sha }}"
          echo "Current PR SHA: ${{ steps.freshness.outputs.current_sha }}"

      - name: Extract preview site
        if: ${{ steps.freshness.outputs.deployable == 'true' }}
        run: tar -xzf artifact/pr-web-preview-site.tar.gz -C artifact

      - name: Check Cloudflare deployment secrets
        if: ${{ steps.freshness.outputs.deployable == 'true' }}
        id: secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Minimize outdated preview comments
        if: ${{ steps.freshness.outputs.deployable == 'true' }}
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number('${{ steps.metadata.outputs.pr_number }}');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const previewComments = comments.filter(
              (c) => c.body && c.body.includes('## Mobile PR Preview') &&
                     c.user && c.user.type === 'Bot',
            );

            for (const comment of previewComments) {
              await github.graphql(`
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }
              `, { id: comment.node_id });
            }

            core.info(`Minimized ${previewComments.length} outdated preview comment(s).`);

      - name: Render blocked preview comment
        if: ${{ steps.freshness.outputs.deployable == 'true' && steps.secrets.outputs.configured != 'true' }}
        id: blocked_comment
        env:
          HEAD_REF: ${{ steps.metadata.outputs.head_ref }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          PREVIEW_BRANCH: ${{ steps.metadata.outputs.preview_branch }}
        run: |
          updated_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          comment_file="${RUNNER_TEMP}/mobile-pr-preview-blocked.md"

          python3 .github/scripts/mobile_pr_preview_comment.py \
            --mode blocked \
            --sha "${HEAD_SHA}" \
            --updated-at "${updated_at}" \
            --run-url "${run_url}" \
            --preview-branch "${PREVIEW_BRANCH}" \
            --head-ref "${HEAD_REF}" \
            > "${comment_file}"

          echo "comment_file=${comment_file}" >> "$GITHUB_OUTPUT"

      - name: Comment missing preview configuration
        if: ${{ steps.freshness.outputs.deployable == 'true' && steps.secrets.outputs.configured != 'true' }}
        uses: actions/github-script@v9
        env:
          PREVIEW_COMMENT_FILE: ${{ steps.blocked_comment.outputs.comment_file }}
        with:
          script: |
            const prNumber = Number('${{ steps.metadata.outputs.pr_number }}');
            const fs = require('fs');
            const body = fs.readFileSync(process.env.PREVIEW_COMMENT_FILE, 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

      - name: Deploy preview to Cloudflare Pages
        if: ${{ steps.freshness.outputs.deployable == 'true' && steps.secrets.outputs.configured == 'true' }}
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: >-
            pages deploy artifact/web
            --project-name=openvine-app
            --branch=${{ steps.metadata.outputs.preview_branch }}
            --commit-hash=${{ steps.metadata.outputs.head_sha }}
            --commit-message="${{ steps.metadata.outputs.deploy_commit_message }}"
            --commit-dirty=true

      - name: Render deployed preview comment
        if: ${{ steps.freshness.outputs.deployable == 'true' && steps.secrets.outputs.configured == 'true' }}
        id: deployed_comment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          HEAD_REF: ${{ steps.metadata.outputs.head_ref }}
          HEAD_SHA: ${{ steps.metadata.outputs.head_sha }}
          PREVIEW_BRANCH: ${{ steps.metadata.outputs.preview_branch }}
        run: |
          updated_at="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          comment_file="${RUNNER_TEMP}/mobile-pr-preview-deployed.md"

          python3 .github/scripts/mobile_pr_preview_comment.py \
            --mode deployed \
            --sha "${HEAD_SHA}" \
            --updated-at "${updated_at}" \
            --run-url "${run_url}" \
            --preview-branch "${PREVIEW_BRANCH}" \
            --head-ref "${HEAD_REF}" \
            --deployment-url "${DEPLOYMENT_URL}" \
            > "${comment_file}"

          echo "comment_file=${comment_file}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: ${{ steps.freshness.outputs.deployable == 'true' && steps.secrets.outputs.configured == 'true' }}
        uses: actions/github-script@v9
        env:
          PREVIEW_COMMENT_FILE: ${{ steps.deployed_comment.outputs.comment_file }}
        with:
          script: |
            const prNumber = Number('${{ steps.metadata.outputs.pr_number }}');
            const fs = require('fs');
            const body = fs.readFileSync(process.env.PREVIEW_COMMENT_FILE, 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
