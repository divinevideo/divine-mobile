# ABOUTME: CI workflow for the collaborator_repository package.
# ABOUTME: Runs tests, formatting, and analysis only when collaborator_repository files change.

name: Collaborator Repository CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/collaborator_repository/**"
      - ".github/workflows/collaborator_repository.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/collaborator_repository/**"
      - ".github/workflows/collaborator_repository.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      working_directory: "mobile/packages/collaborator_repository"
      flutter_version: "3.47.2"
      min_coverage: 96
