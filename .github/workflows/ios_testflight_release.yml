name: iOS TestFlight Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional full lowercase 40-character SHA; must equal current main'
        required: false
        type: string

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: ios-testflight-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: store-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Scope private ledger build token
        id: provenance
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PROVENANCE_APP_ID }}
          private-key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          owner: divinevideo
          repositories: divine-release-provenance
          permission-contents: write
          skip-token-revoke: true
      - name: Scope public release build token
        id: publisher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.PROVENANCE_APP_ID }}
          private-key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          owner: divinevideo
          repositories: divine-mobile
          permission-contents: write
          skip-token-revoke: true
      - name: Submit and monitor main iOS beta release
        id: codemagic
        env:
          GH_TOKEN: ${{ github.token }}
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          PROVENANCE_TOKEN: ${{ steps.provenance.outputs.token }}
          RELEASE_GITHUB_TOKEN: ${{ steps.publisher.outputs.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 mobile/scripts/start_ios_release.py
