# ABOUTME: CI workflow for the concord_protocol package.
# ABOUTME: Runs tests, formatting, and analysis only when concord_protocol files change.

name: Concord Protocol CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/concord_protocol/**"
      - ".github/workflows/concord_protocol.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/concord_protocol/**"
      - ".github/workflows/concord_protocol.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      working_directory: "mobile/packages/concord_protocol"
      flutter_version: "3.47.2"
      min_coverage: 85

  browser:
    name: Browser compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile/packages/concord_protocol
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run protocol and transport tests in Chrome
        run: dart test --platform chrome test/encoding_test.dart test/chat_ordering_test.dart
