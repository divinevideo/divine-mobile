# ABOUTME: Builds a Flutter web preview artifact for every ready-for-review divine-mobile pull request
# ABOUTME: Uploads a deployable artifact that a trusted workflow later pushes to Cloudflare Pages with Wrangler

name: Mobile PR Preview Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile_pr_preview_build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build Flutter Web Preview
    # Draft PRs get no preview. The ready_for_review trigger above builds the
    # first preview the moment the PR leaves draft.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    defaults:
      run:
        working-directory: mobile

    steps:
      # The default pull_request checkout is the merge commit, which is also
      # where GitHub reads this workflow from. Checking out the PR head instead
      # ran steps added on main against a tree that predates them: every open
      # PR behind #9268 failed on a scripts/ file its head did not carry yet.
      - name: Checkout PR merge commit
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web preview
        env:
          # Preview builds expose the public test rooms directly in Messages.
          FF_CONCORD_CHAT: "true"
        run: |
          flutter build web \
            --release \
            --tree-shake-icons \
            --optimization-level=4 \
            --pwa-strategy=none \
            --dart-define=BACKEND_URL=https://api.divine.video \
            --dart-define=ENVIRONMENT=production \
            --dart-define="FF_CONCORD_CHAT=$FF_CONCORD_CHAT" \
            --no-source-maps

      - name: Check web bundle file sizes
        run: bash scripts/check_web_bundle_file_size.sh build/web

      - name: Bundle preview artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tar -C build -czf pr-web-preview-site.tar.gz web
          python3 - <<'PY'
          import json
          import os

          with open("pr-web-preview-metadata.json", "w") as output:
              json.dump({
                  "pr_number": os.environ["PR_NUMBER"],
                  "head_ref": os.environ["PR_HEAD_REF"],
                  "head_sha": os.environ["PR_HEAD_SHA"],
              }, output)
          PY

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: mobile-pr-preview
          path: |
            mobile/pr-web-preview-site.tar.gz
            mobile/pr-web-preview-metadata.json
          if-no-files-found: error
          retention-days: 7
