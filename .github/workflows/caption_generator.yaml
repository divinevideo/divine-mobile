# ABOUTME: CI workflow for the caption_generator package.
# ABOUTME: Runs Dart tests/format/analysis plus an Android native compile check.

name: Caption Generator CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/caption_generator/**"
      - ".github/workflows/caption_generator.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/caption_generator/**"
      - ".github/workflows/caption_generator.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      working_directory: "mobile/packages/caption_generator"
      flutter_version: "3.47.2"

  # The Dart workflow above never compiles the native Kotlin, so a compile
  # error would pass green until the package is wired into an app build.
  # Compile the plugin's Android sources explicitly.
  android-compile:
    name: Android Compile Check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile/
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
          cache-provider: basic
      - name: Install dependencies
        run: flutter pub get
      - name: Compile caption_generator Android sources
        working-directory: mobile/packages/caption_generator/android
        run: gradle testDebugUnitTest
