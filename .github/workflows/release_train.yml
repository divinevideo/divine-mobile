name: Store release train

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Observe and plan without writing state or publishing
        type: boolean
        default: true
      acknowledge:
        description: Exact observed rejection or failed operation identity to acknowledge
        type: string
        required: false
      approve_store_review:
        description: Exact preflight confirmation for a verified production build
        type: string
        required: false
      diagnose_android_upload:
        description: Inspect a retained failed Android upload and validate notes without publishing
        type: string
        required: false
      bootstrap:
        description: Bootstrap identities from provider state (dry_run applies)
        type: boolean
        default: false
      setup_codemagic:
        description: Store existing Codemagic token encrypted in the existing github_credentials group
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write
  actions: read
  checks: read

concurrency:
  group: store-release-train
  cancel-in-progress: false
  queue: max

jobs:
  tick:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.RELEASE_TRAIN_IOS != '' && vars.RELEASE_TRAIN_IOS != 'off') ||
       (vars.RELEASE_TRAIN_ANDROID != '' && vars.RELEASE_TRAIN_ANDROID != 'off'))
    environment: store-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scope private provenance installation token
        id: provenance
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PROVENANCE_APP_ID }}
          private-key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          owner: divinevideo
          repositories: divine-release-provenance
          permission-contents: write
          skip-token-revoke: true
      - name: Scope immutable candidate tag installation token
        id: candidate
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PROVENANCE_APP_ID }}
          private-key: ${{ secrets.PROVENANCE_APP_PRIVATE_KEY }}
          owner: divinevideo
          repositories: divine-mobile
          permission-contents: write
          skip-token-revoke: false
      - name: Observe and coordinate both store queues
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG_TOKEN: ${{ steps.candidate.outputs.token }}
          PROVENANCE_TOKEN: ${{ steps.provenance.outputs.token }}
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          RELEASE_NOTES_LUNAROUTE_API_KEY: ${{ secrets.RELEASE_NOTES_LUNAROUTE_API_KEY }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          TESTFLIGHT_PUBLIC_GROUP_ID: ${{ vars.TESTFLIGHT_PUBLIC_GROUP_ID }}
          TESTFLIGHT_GROUP_IDS: ${{ vars.TESTFLIGHT_GROUP_IDS }}
          PLAY_MANAGED_PUBLISHING: ${{ vars.PLAY_MANAGED_PUBLISHING }}
          PUBLIC_PEOPLE_LIST_POLICY: ${{ vars.DIVINE_PUBLIC_PEOPLE_LIST_EXCLUDED_D_TAGS }}
          RELEASE_TRAIN_IOS: ${{ vars.RELEASE_TRAIN_IOS }}
          RELEASE_TRAIN_ANDROID: ${{ vars.RELEASE_TRAIN_ANDROID }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run || false }}
          RELEASE_ACKNOWLEDGE: ${{ inputs.acknowledge }}
          RELEASE_APPROVE_STORE_REVIEW: ${{ inputs.approve_store_review }}
          RELEASE_DIAGNOSE_ANDROID_UPLOAD: ${{ inputs.diagnose_android_upload }}
          RELEASE_BOOTSTRAP: ${{ inputs.bootstrap || false }}
          RELEASE_SETUP_CODEMAGIC: ${{ inputs.setup_codemagic || false }}
        run: python3 mobile/scripts/run_release_train.py
