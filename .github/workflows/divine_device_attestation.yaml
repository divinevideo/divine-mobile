# ABOUTME: CI workflow for the divine_device_attestation package.
# ABOUTME: Runs tests, formatting, and analysis when the package changes.

name: Divine Device Attestation CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/packages/divine_device_attestation/**"
      - ".github/workflows/divine_device_attestation.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/packages/divine_device_attestation/**"
      - ".github/workflows/divine_device_attestation.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v1
    with:
      working_directory: "mobile/packages/divine_device_attestation"
      flutter_version: "3.44.9"
      min_coverage: 85
