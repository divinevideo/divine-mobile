name: openvine
description: "Divine - A decentralized vine-like video sharing app powered by Nostr."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.22+820

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

workspace:
  - packages/analytics
  - packages/app_update_repository
  - packages/app_version_client
  - packages/background_uploader
  - packages/badge_repository
  - packages/blossom_upload_service
  - packages/blurhash_service
  - packages/bookmarks_repository
  - packages/cache_sync
  - packages/caption_generator
  - packages/categories_repository
  - packages/collaborator_repository
  - packages/comments_repository
  - packages/content_blocklist_repository
  - packages/content_policy
  - packages/count_formatter
  - packages/creator_sync
  - packages/curated_list_repository
  - packages/curation_repository
  - packages/divine_blurhash
  - packages/divine_ui
  - packages/db_client
  - packages/divine_camera
  - packages/divine_quick_actions
  - packages/divine_status_client
  - packages/dm_repository
  - packages/divine_video_player
  - packages/feed_repository
  - packages/feed_tuning_repository
  - packages/infinite_video_feed
  - packages/follow_repository
  - packages/funnelcake_api_client
  - packages/hashtag_repository
  - packages/image_metadata_stripper
  - packages/iap_repository
  - packages/invite_api_client
  - packages/keycast_flutter
  - packages/likes_repository
  - packages/media_cache
  - packages/models
  - packages/notification_repository
  - packages/nostr_app_bridge_repository
  - packages/nostr_sdk
  - packages/nostr_client
  - packages/nostr_key_manager
  - packages/people_lists_repository
  - packages/permissions_service
  - packages/profile_repository
  - packages/reposts_repository
  - packages/sound_service
  - packages/sounds_repository
  - packages/text_sanitizer
  - packages/time_formatter
  - packages/tv_static_effect
  - packages/unified_logger
  - packages/verifier_client
  - packages/video_event_cache
  - packages/videos_repository

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Analytics — unified event schema and the single Firebase analytics surface.
  analytics:

  # OS-backed background uploads that survive app suspension.
  background_uploader:

  # NIP-58 badge repository — award/definition/profile-badges parsing + dashboard (#3866)
  badge_repository:

  blossom_upload_service:

  caption_generator:
    path: packages/caption_generator

  # Testable time source — wraps DateTime.now/Stopwatch so fakeAsync can
  # virtualize them in tests.
  clock: ^1.1.2

  # Unicode grapheme segmentation for user-entered category names.
  characters: ^1.4.1

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.3
  flutter_bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  rxdart: ^0.28.0

  # Networking
  http: ^1.5.0
  web_socket_channel: ^3.0.3
  connectivity_plus: ^7.3.0
  device_info_plus: ^10.1.2
  url_launcher: ^6.3.2
  # OAuth: Uses ASWebAuthenticationSession on iOS (Apple's recommended auth flow)
  # https://developer.apple.com/documentation/authenticationservices/aswebauthenticationsession
  flutter_web_auth_2: ^4.1.0
  dio: ^5.8.0
  web: ^1.1.1
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.13 # Direct dep for AndroidWebViewController (frame attestation, #4105)
  webview_flutter_wkwebview: ^3.24.1

  permission_handler: ^12.0.1 # Handle runtime permissions
  record: ^7.1.0 # Microphone capture for voice-over recording

  # Camera and media
  # c2pa_flutter is intentionally git-pinned: the guardianproject plugin Divine
  # uses is not published on pub.dev. (pub.dev's same-named package is an
  # unrelated third-party FFI rewrite — different author, c2pa-rs 0.75.x, no
  # RemoteSigner.) Pinned by immutable commit (tag 0.0.3) so a moved tag cannot
  # silently change the build.
  # TODO(#6166): moving off this pin needs a differently-named pub package —
  # guardianproject cannot publish as `c2pa_flutter` (name permanently taken),
  # so it is a rename plus API migration, not a version-constraint swap.
  c2pa_flutter:
    git:
      url: https://github.com/guardianproject/c2pa-flutter.git
      ref: 847d0c0183c9c09946ce321c107decd3fd9f56b2 # tag 0.0.3
  divine_camera:
    path: packages/divine_camera
  divine_quick_actions:
    path: packages/divine_quick_actions
  divine_video_player:
    path: packages/divine_video_player
  infinite_video_feed:
    path: packages/infinite_video_feed
  dm_repository:
  visibility_detector: ^0.4.0+2 # Detect widget visibility for proper video control
  wakelock_plus: ^1.5.2 # Prevent screen timeout during active video recording
  image: ^4.1.7 # Image processing for GIF generation
  image_picker: ^1.2.0 # For selecting images from gallery or camera
  image_metadata_stripper:
    path: packages/image_metadata_stripper
  in_app_purchase: ^3.2.0
  iap_repository:
    path: packages/iap_repository
  invite_api_client:
    path: packages/invite_api_client
  gal: ^2.3.2 # Save videos to device photo gallery
  file_selector: ^1.0.4 # For desktop file selection (macOS, Windows, Linux)

  # Cloud services (removed cloudinary_public - using Blossom instead)

  # Local persistence
  hive_ce: ^2.6.0
  hive_ce_flutter: ^2.1.0

  # Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.0.0

  # Crypto (needed for Nostr)
  crypto: ^3.0.7
  bech32: ^0.2.2

  # UI/UX
  flutter_cache_manager: ^3.3.1
  share_plus: ^12.0.0 # Cross-platform sharing
  google_fonts: ^6.3.2 # For using Google Fonts including Pacifico
  flutter_svg: ^2.0.10+1 # For custom SVG icons
  # Pre-flights remote SVG avatars through the same tokenizer flutter_svg uses
  # before handing bytes to SvgPicture (see AvatarSvgRepository, #7296).
  xml: ^6.5.0
  skeletonizer: ^2.1.2 # Skeleton loading animations with shimmer effect

  # Blurhash Service - Blurhash generation and decoding for image placeholders
  blurhash_service:

  # Bookmarks Repository - NIP-51 kind 10003 global bookmark list (#6969)
  bookmarks_repository:

  cache_sync:

  # Categories Repository - Video categories from Funnelcake API
  categories_repository:

  # Collaborator Repository - Per-video pending/confirmed collaborator status
  collaborator_repository:

  # Comments Repository - NIP-22 comments on Nostr events
  comments_repository:

  # Content Blocklist Repository - Blocked users, mutual mutes, kind 30000 sync
  content_blocklist_repository:

  # Feed Repository - ViewSource-resolved, lifecycle-stable video feeds (#3383)
  feed_repository:

  # Feed Tuning Repository - publishes swipe "more/less like this" signals
  feed_tuning_repository:

  # Creator Sync - cross-device sync for saved sounds, clips, and drafts
  creator_sync:

  # Curated List Repository - NIP-51 kind 30005 curated video lists
  curated_list_repository:

  # Curation Repository - NIP-51 video curation sets and content discovery
  curation_repository:

  # Video Event Cache - Abstract interface for video event caching
  video_event_cache:

  # Sound Service - Sound effects (countdown beeps, etc.)
  sound_service:

  # Sounds Repository - Kind 1063 audio events from Nostr relays
  sounds_repository:

  # Notification Repository - Notification enrichment and grouping
  notification_repository:

  # Nostr SDK - Local package for comprehensive Nostr support
  nostr_app_bridge_repository:
  nostr_sdk:

  # Nostr Key Manager - Secure key management with hardware-backed storage
  nostr_key_manager:

  keycast_flutter:

  # Divine Status Client - component health from status.divine.video
  divine_status_client:

  # Follow Repository - Follow relationship management
  follow_repository:

  # Hashtag Repository - Hashtag search data layer
  hashtag_repository:

  # People Lists Repository - NIP-51 kind 30000 follow sets
  people_lists_repository:

  # Permissions Service - runtime permission checks (camera, mic, photos)
  permissions_service:

  # Profile Repository - Kind 0 user metadata persistence and search
  profile_repository:

  # Models - Shared Nostr/data model definitions
  models:

  # Text Sanitizer - display-safe user text (zalgo caps, UTF-16 well-formed)
  text_sanitizer:

  # Videos Repository - Video feed data layer
  videos_repository:

  # TV static noise effect
  tv_static_effect:

  # Content Policy — parse-gate ingress filter
  content_policy:

  # Count Formatter - Compact number formatting
  count_formatter:

  # Time Formatter - Locale-aware timestamp formatting
  time_formatter:

  # Divine UI - Shared UI components
  divine_ui:

  # Funnelcake REST API client
  funnelcake_api_client:

  # Localization
  flutter_localizations:
    sdk: flutter

  # Logging
  logging: ^1.2.0
  unified_logger:

  # Verifier Client - HTTP client for verifier.divine.video identity attestations
  verifier_client:

  # Date formatting
  intl: ">=0.19.0 <1.0.0"

  # Missing dependencies required by nostr_sdk
  equatable: ^2.0.5

  # Desktop window management for proper window sizing
  window_manager: ^0.5.1
  firebase_core: ^4.4.0
  firebase_crashlytics: ^5.0.7
  firebase_messaging: ^16.1.1
  firebase_performance: ^0.11.1+4
  go_router: ^16.2.4
  # Runtime splash-screen control via FlutterNativeSplash.preserve/remove.
  # Used ONLY for the runtime API — do NOT add a flutter_native_splash:
  # config block or run `dart run flutter_native_splash:create`. The
  # existing platform splash assets (Android launch_background.xml with
  # Zendesk theme inheritance, iOS LaunchScreen.storyboard, Android 12+
  # values-v31 styles) are hand-authored and should not be regenerated.
  # See #2749 and #2953 for context on the welcome-screen flash fix.
  flutter_native_splash: ^2.4.7
  flutter_local_notifications: ^21.0.0
  package_info_plus: ^9.0.0
  shorebird_code_push: ^2.0.7
  # Triggers the OS-native review card (SKStoreReviewController on iOS,
  # Google Play in-app review on Android). Used by AppReviewCoordinator to
  # ask engaged, store-installed creators to rate the app — no custom dialog.
  in_app_review: ^2.0.12
  uuid: ^4.5.1
  app_links: ^6.4.1
  drift: ^2.34.0
  # At-rest encryption for the local DB (#570, finding C2) uses
  # SQLite3MultipleCiphers through package:sqlite3 build hooks. Do not add
  # sqlcipher_flutter_libs, sqlite3_flutter_libs, or drift_flutter here: sqlite3
  # 3.x bundles the selected native SQLite implementation through hooks, and
  # extra Flutter-specific native SQLite providers can make plain SQLite win.
  sqlite3: ^3.3.3
  audio_session: ^0.2.2
  pro_video_editor: ^2.11.3
  pro_image_editor: ^13.3.1
  flutter_colorpicker: ^1.1.0
  file_picker: ^10.3.7
  sensors_plus: ^7.0.0
  stream_transform: ^2.1.1
  flutter_staggered_grid_view: ^0.7.0
  qr_flutter: ^4.1.0
  android_intent_plus: ^6.0.0
  app_device_integrity: ^1.1.0
  pointer_interceptor: ^0.10.1+2
  volume_controller: ^3.4.4
  meta: ^1.18.0

dependency_overrides:
  # TODO(#3638): Keep device_info_plus on 10.x until the app is ready for the
  # transitive 11.x platform interface changes.
  device_info_plus: ^10.1.2
  # TODO(#6918): Local fork documents its divergence and removal condition in
  # overrides/app_device_integrity-1.1.0/OVERRIDE.md.
  app_device_integrity:
    path: overrides/app_device_integrity-1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Paired with patrol_cli 4.7.0, which patrol_cli itself enforces at run
  # time. Both bounds are load-bearing. The floor keeps pub out of the older
  # band the installed CLI rejects, and carries the fix for macOS builds
  # failing with "module 'PatrolImpl' not found" under Swift Package Manager.
  # The ceiling stops `pub upgrade` crossing into a band patrol's table
  # closes retroactively: CLI 4.6.1 shipped an open-ended 4.7.0+ entry that
  # CLI 4.7.0 narrowed to 4.7.0-4.8.0, which is what broke `^4.8.0`. Raise
  # both halves together — see PATROL_CLI_VERSION in local_stack/profile.sh.
  patrol: ">=4.9.0 <4.10.0"
  flutter_launcher_icons: ^0.14.4

  very_good_analysis: ^10.2.0

  # Powers scripts/check_post_close_emit_ceiling.sh, which needs a real Dart
  # AST to tell Cubit.emit (throws after close) from an event handler's
  # Emitter.call (cancelled, so a no-op). Already in the tree transitively via
  # build_runner; named here so the guard does not depend on that staying true.
  analyzer: ^12.1.0

  # Testing
  fake_async: ^1.3.3
  mocktail: ^1.0.3
  bloc_test: ^10.0.0

  # Code generation
  build_runner: ^2.15.0
  hive_ce_generator: ^1.6.0

  # Integration test utilities
  postgres: ^3.5.0

  # CLI tools
  args: ^2.4.2
  riverpod_generator: ^4.0.4
  # custom_lint: ^0.6.4  # Temporarily disabled due to rxdart version conflict
  # riverpod_lint: ^2.3.10  # Depends on custom_lint
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  path: any
  yaml: any
  golden_toolkit: ^0.15.0
  alchemist: ^0.12.1
  async: ^2.13.0
  drift_dev: ^2.34.0
  melos: ^7.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  config:
    enable-swift-package-manager: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/videos/
    - assets/sounds/
    - assets/sounds/sound-bot/
    - assets/categories/
    - assets/top_1000_hashtags.json
    - assets/fonts/
    - assets/licenses/
    - assets/icon/
    - assets/loading-brand-sprite.png
    - assets/seed_data/seed_events.json
    - assets/seed_data/classic_viner_profiles.json
    - assets/seed_media/videos/0cfc8ec503ae05856ec43165bebb7d0d2a3759b2900e38f509b8d08154ef6dc2.mp4
    - assets/seed_media/videos/606486ed7079b4b2614e9ca3e0f46c1c9a4a39d52c90dd25a9e51d1b7cf96b33.mp4
    - assets/seed_media/videos/6c7bf42367895238e3bd20b12e95a171e9a37a41e2b9b18b89f228de38e9f827.mp4
    - assets/seed_media/thumbnails/0cfc8ec503ae05856ec43165bebb7d0d2a3759b2900e38f509b8d08154ef6dc2.jpg
    - assets/seed_media/thumbnails/606486ed7079b4b2614e9ca3e0f46c1c9a4a39d52c90dd25a9e51d1b7cf96b33.jpg
    - assets/seed_media/thumbnails/6c7bf42367895238e3bd20b12e95a171e9a37a41e2b9b18b89f228de38e9f827.jpg
    - assets/seed_media/classic_viner_avatars/brittany-furlan.png
    - assets/seed_media/classic_viner_avatars/jerome-jarre.png
    - assets/stickers/
    - assets/stickers/i18n/
    - shorebird.yaml

  # Fragment shaders. `chroma_key.frag` powers the video editor's live
  # green-screen preview (see shaders/chroma_key.frag).
  shaders:
    - shaders/chroma_key.frag

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Flutter launcher icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  # Covers the PWA / home-screen icons under web/icons. This block also
  # rewrites web/favicon.png from image_path and emits maskable icons without
  # safe-zone padding, so follow every run with
  # `dart run scripts/generate_web_favicon.dart` to derive the plate-free tab
  # mark from the current app icon and put the padded maskable icons back. It
  # rewrites web/manifest.json in place too, stripping the trailing newline —
  # re-add it before committing.
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#000000"
    # Brand Green, matching VineTheme.vineGreen and divine.video's theme-color.
    theme_color: "#27C58B"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  # Fills the adaptive icon's reserved border behind the inset app icon. The
  # artwork's plate is a diagonal gradient (#7BF9BC to #1B8865), not flat Brand
  # Green, so no single colour here can match it — the border reads as a
  # two-tone square, the same defect #7610 tracks for the web maskable icons.
  # The fix is a plate-free foreground asset, not a different colour here.
  adaptive_icon_background: "#27C58B"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

patrol:
  app_name: divine
  test_directory: integration_test
  android:
    package_name: co.openvine.app
  ios:
    bundle_id: co.openvine.app

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

melos:
  useRootAsPackage: true

  scripts:
    generate: melos exec --depends-on build_runner -- dart run build_runner build -d
