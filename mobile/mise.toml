[tools]
flutter = "3.44.9"
# Android/Gradle builds need a JDK, and nothing else provisions one. 17 is what
# the build actually targets: app/build.gradle.kts sets source/targetCompatibility
# and jvmTarget to 17, and codemagic.yaml pins `java: 17` for every Android
# workflow. Pinning it here keeps a local `./gradlew` on the same JDK as CI.
java = "temurin-17"

[tasks.local_up]
description = "Start all local E2E services"
depends = ["local_setup"]
run = """
bash ../local_stack/up.sh
"""

[tasks.local_up_cached]
description = "Start stack using cached images (offline / rate-limited / image-pull failures)"
depends = ["local_setup"]
run = """
bash ../local_stack/up.sh --pull=missing
"""

[tasks.local_down]
description = "Stop all local E2E services"
run = "docker compose -f ../local_stack/docker-compose.yml down"

[tasks.local_logs]
description = "Tail all local service logs"
run = "docker compose -f ../local_stack/docker-compose.yml logs -f"

[tasks.local_build]
description = "Build APK with LOCAL environment"
depends = ["setup_hooks"]
run = "flutter build apk --debug --dart-define=DEFAULT_ENV=LOCAL"

[tasks.local_install]
description = "Install LOCAL APK on emulator"
run = "adb install -r build/app/outputs/flutter-apk/app-debug.apk"

[tasks.local_android]
description = "Run the app on Android against the default local stack"
run = "bash ../local_stack/run_android_local.sh"

[tasks.local_status]
description = "Check status of local services"
run = "docker compose -f ../local_stack/docker-compose.yml ps"

[tasks.local_reset]
description = "Wipe all local data (relay, DB, blossom) and restart fresh"
depends = ["local_setup"]
run = """
docker compose -f ../local_stack/docker-compose.yml down -v
bash ../local_stack/up.sh
"""

[tasks.local_build_funnelcake]
description = "Build funnelcake images from a local divine-funnelcake checkout"
run = "bash ../local_stack/build_funnelcake.sh"

[tasks.local_setup]
description = "First-time setup for local E2E"
run = "bash ../local_stack/setup.sh"

[tasks.test_local_stack_scripts]
description = "Run local stack shell script checks"
run = """
bash ../local_stack/test_stack_scripts.sh
bash ../local_stack/test_android_scripts.sh
"""

[tasks.local_token]
description = "Get verification token for an email from local DB"
run = """
docker compose -f ../local_stack/docker-compose.yml exec keycast-postgres \
  psql -U postgres -d keycast -t -A -c \
  "SELECT pending_email_verification_token FROM oauth_codes WHERE pending_email = '$1' AND pending_email_verification_token IS NOT NULL ORDER BY created_at DESC LIMIT 1;"
"""

[tasks.local_logs_keycast]
description = "Show keycast container logs (useful after refresh token tests)"
run = "docker compose -f ../e2e/docker-compose.yml logs keycast --tail=200"

[tasks.gen_l10n]
description = "Generate localization files from ARB"
run = "flutter gen-l10n"

[tasks.lnav_setup]
description = "Install Divine lnav log formats (requires: brew install lnav)"
run = "lnav -i ../scripts/lnav/*.json"

[tasks.setup_hooks]
description = "Install git hooks (pre-commit + pre-push) for local CI checks"
run = "bash ../scripts/install-hooks.sh"

[tasks.e2e_test]
description = "Run E2E tests with log profiling (starts Docker stack, captures merged timeline)"
depends = ["setup_hooks", "local_up"]
run = "bash ../local_stack/profile.sh {{ arg(i=0, name='test_path', default='integration_test/auth/') }}"

[tasks.emulator]
description = "Launch Android emulator (auto-detects DISPLAY, XWayland on Linux)"
run = "bash ../local_stack/emulator.sh"

[tasks.emulator_headless]
description = "Launch Android emulator headless (offscreen, no window)"
run = "bash ../local_stack/emulator.sh --headless"

[tasks.emulator_wipe]
description = "Launch Android emulator with -wipe-data (nuclear option for storage issues)"
run = "bash ../local_stack/emulator.sh --wipe"

[tasks.test]
description = "Run the full app test suite the way CI does (merged-isolate optimizer)"
run = """
set -eu
# Plain `flutter test` compiles and spins a fresh isolate per file; the VGV
# optimizer bundles the untagged files into one. Measured on an identical
# 31-file / 277-test subset: 60s plain vs 17s optimized.
VERY_GOOD_CLI_VERSION=1.3.0
PUB_CACHE_BIN="${PUB_CACHE:-$HOME/.pub-cache}/bin"
VERY_GOOD_BIN=""
if command -v very_good >/dev/null 2>&1; then
  VERY_GOOD_BIN="$(command -v very_good)"
elif [ -x "$PUB_CACHE_BIN/very_good" ]; then
  VERY_GOOD_BIN="$PUB_CACHE_BIN/very_good"
fi

VERY_GOOD_CURRENT_VERSION=""
if [ -n "$VERY_GOOD_BIN" ]; then
  VERY_GOOD_CURRENT_VERSION="$("$VERY_GOOD_BIN" --version | awk 'NR == 1 { print $1 }')"
fi

if [ "$VERY_GOOD_CURRENT_VERSION" != "$VERY_GOOD_CLI_VERSION" ]; then
  echo "Installing very_good_cli $VERY_GOOD_CLI_VERSION (pinned to match Mobile CI)..."
  dart pub global activate very_good_cli "$VERY_GOOD_CLI_VERSION"
  VERY_GOOD_BIN="$PUB_CACHE_BIN/very_good"
fi

flutter pub get
# DIVINE_STRICT_CHANNELS matches Mobile CI: a test that leaves a shared
# MethodChannel handler replaced fails here rather than being healed silently.
PATH="$PUB_CACHE_BIN:$PATH" "$VERY_GOOD_BIN" test \
  --optimization \
  --concurrency=4 \
  --exclude-tags "integration || golden" \
  --dart-define=DIVINE_STRICT_CHANNELS=true \
  --test-randomize-ordering-seed random
"""
