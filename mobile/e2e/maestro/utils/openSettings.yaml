appId: co.openvine.app.staging
---
#Utility: given the user is signed in, open Settings.
#
# The old route -- double-tap Home, open the hamburger menu, tap "Settings" --
# is gone. There is no hamburger menu in the app. Settings is now reached from
# the gear on the user's own profile header, which is its only entry point.

- tapOn:
    id: "profile_tab"
- extendedWaitUntil:
    visible:
      id: "settings_button"
    timeout: 30000
- tapOn:
    id: "settings_button"

# Settings is a short list of categories; every journey continues through
# one of them. Wait on the Account row, which is always present for a
# signed-in user, rather than on any row deeper in the tree.
#
# Scroll to that row rather than waiting for it to appear: a scroll returns
# immediately when the row is already on screen, and survives the list
# outgrowing the viewport on a small device.
- scrollUntilVisible:
    element:
      id: "settings_account_tile"
    direction: DOWN
    timeout: 30000
