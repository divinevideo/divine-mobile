appId: co.openvine.app.staging
---
#Utility: given the user is signed in, open Settings.
#
# The old route -- double-tap Home, open the hamburger menu, tap "Settings" --
# is gone. There is no hamburger menu in the app. Settings is now reached from
# the gear on the user's own profile header, which is its only entry point.

- tapOn:
    id: "profile_tab"
- extendedWaitUntil:
    visible:
      id: "settings_button"
    timeout: 30000
- tapOn:
    id: "settings_button"

# Settings itself is asserted by whatever is looking for a specific row:
# the screen is a flat list whose contents vary with feature flags and
# developer mode, so there is no stable full-screen assertion to make.
#
# Scroll to that row rather than waiting for it to appear. The list has
# outgrown the viewport, so the Nostr row now sits below the fold on a stock
# iPhone and a plain visibility wait times out on a screen that is already
# fully drawn. Scrolling is a superset of the old wait: it returns
# immediately when the row is on screen already.
- scrollUntilVisible:
    element:
      id: "nostr_settings_tile"
    direction: DOWN
    timeout: 30000
