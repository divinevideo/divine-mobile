appId: co.openvine.app.staging
---
#Utility: given a ready viewfinder in a mode that renders the full capture
#control rail (capture and lip-sync), drive every control and leave each one
#back on its default.
#
# Three of the six controls are unconditional and are shared with every other
# mode that renders a rail, so they live in their own utils and this file
# sequences them. The ghost-frame toggle is shared with stop-motion and
# classic, so it has its own util too. Timer and stabilization are rendered
# only by the modes that declare `supportsCountdownTimer` /
# `supportsVideoStabilization`, so they stay here. A mode with a different set
# composes the per-control utils in its own order rather than calling this one
# with parts skipped — `tests/stopMotionModeControls.yaml` is the worked
# example.
#
# The assertions read each control's Semantics `value`, which Flutter folds
# into the Android content description / iOS accessibilityValue. That is the
# only readable evidence a tap landed: the controls are icon-only, and what
# they change — flash mode, sensor crop, active lens — is invisible to a UI
# driver. Selectors pin `id` as well as `text` because "Off" is the value of
# both the flash and the timer control.
#
# Two preconditions beyond an open viewfinder, both of which the calling test
# is responsible for:
# - **No clips.** The aspect-ratio control is disabled once the session holds
#   one, because clips of mixed ratios cannot share an editor timeline.
# - **Real camera hardware**, for the lens switch.
#
# Flash and stabilization are driven behind an `enabled` guard, because both
# are disabled outright on hardware that lacks the feature — no flash unit on
# the active lens, or a camera that reports a single stabilization mode. An
# unguarded tap-and-assert there would go green or red on the phone rather
# than on the code. A guarded block prints "SKIPPED" in the run output, so a
# skipped control is visible rather than silently counted as covered.
#
# Leaves no mode assertion behind — the caller adds its own, because this rail
# is shared and the surrounding chrome is not.
#Steps:
# 1. Aspect ratio: Vertical -> Square -> Vertical
# 2. Timer: Off -> 3 seconds -> 10 seconds -> Off
# 3. Camera: Back -> Front -> Back
# 4. Flash (if present): Off -> On -> Auto -> Off
# 5. Stabilization (if supported): Standard -> Off -> Standard
# 6. Ghost frame: off -> on -> off

# 1. Aspect ratio flips between two states.
- runFlow: driveAspectRatioControl.yaml

# 2. Timer cycles through three states and wraps.
- assertVisible:
    id: camera_timer_button
    text: ".*Off.*"
- tapOn:
    id: camera_timer_button
- extendedWaitUntil:
    visible:
      id: camera_timer_button
      text: ".*3 seconds.*"
    timeout: 10000
- tapOn:
    id: camera_timer_button
- extendedWaitUntil:
    visible:
      id: camera_timer_button
      text: ".*10 seconds.*"
    timeout: 10000
# The wrap back to Off is not just symmetry: a timer left armed puts a
# countdown in front of every recording later in the flow.
- tapOn:
    id: camera_timer_button
- extendedWaitUntil:
    visible:
      id: camera_timer_button
      text: ".*Off.*"
    timeout: 10000

# 3. Lens switch.
- runFlow: driveLensControl.yaml

# 4. Flash, if the active lens has a unit.
- runFlow: driveFlashControl.yaml

# 5. Stabilization. Same guard as flash: the button is enabled only when the
# lens offers a mode besides off. A fresh install opens on Standard, the
# recorder's default, which the open sheet shows as its selected row; a lens
# without Standard would open on Off and fail that assert.
#
# The sheet is a modal route whose barrier blocks the semantics of the rail
# underneath (ModalBarrier wraps itself in BlockSemantics). So the button
# vanishing means the sheet is up, and the bare row labels are unambiguous
# while it is: "Off" is also the value of the flash and timer controls, and
# picking the timer would arm the countdown that step 2 exists to clear.
- runFlow:
    when:
      visible:
        id: camera_stabilization_button
        enabled: true
    commands:
      - tapOn:
          id: camera_stabilization_button
      - extendedWaitUntil:
          notVisible:
            id: camera_stabilization_button
          timeout: 10000
      - assertVisible:
          text: "Standard"
          selected: true
      - tapOn: ".*Off.*"
      - extendedWaitUntil:
          visible:
            id: camera_stabilization_button
            text: ".*Off.*"
          timeout: 10000
      # Restore the default, so the takes recorded later in the flow use it.
      # The button is back once the sheet closes, but reads Off until the
      # camera has taken the new mode.
      - tapOn:
          id: camera_stabilization_button
      - extendedWaitUntil:
          notVisible:
            id: camera_stabilization_button
          timeout: 10000
      - tapOn: "Standard"
      - extendedWaitUntil:
          visible:
            id: camera_stabilization_button
          timeout: 10000
      - extendedWaitUntil:
          notVisible:
            id: camera_stabilization_button
            text: ".*Off.*"
          timeout: 10000

# 6. Ghost frame (onion-skin), deliberately last. Each tap raises a 4-second
# confirmation snackbar that floats over the bottom of the screen, which is
# where the stabilization sheet in step 5 opens its options.
- runFlow: driveGhostFrameControl.yaml

# Let the banner go before handing over: it also floats over the record and
# delete buttons the recording tests tap next.
#
# `waitForAnimationToEnd` runs its timeout out rather than returning early: it
# waits for the screen to stop changing and the live camera preview never
# does, which makes it the deterministic wait this needs.
- waitForAnimationToEnd:
    timeout: 4500
