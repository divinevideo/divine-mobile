appId: co.openvine.app.staging
---
#Utility: given the user is signed in and on a feed surface, open the recorder
#and leave it on lip-sync with no sound picked, which shows the sound picker in
#place of the viewfinder.
#
# No launchApp, so this runs against whatever is already on screen — see the
# "Iterating" section of e2e/maestro/README.md.
#
# Unlike openCaptureMode this *selects* the mode rather than asserting it, and
# it has to: the recorder restores the last-used mode from
# `camera_last_used_recorder_mode` and falls back to Capture whenever the key
# is absent, so a first run after a `clearState` never opens here on its own.
#
# The wheel is a lazy ListView, so it only builds entries near the armed one.
# Lip Sync sits two places from Capture, so this hops through the entry between
# them rather than betting on how many the viewport happens to have built.
# Tapping a mode that is already armed is a no-op in the bloc, so the hop is
# also what makes a rerun — which opens straight on Lip Sync, because selecting
# a mode persists it — pass unchanged.

- runFlow: openRecorder.yaml

- tapOn:
    id: camera_mode_stopMotion
- tapOn:
    id: camera_mode_lipSync

- runFlow: ../asserts/assertLipSyncMode.yaml
