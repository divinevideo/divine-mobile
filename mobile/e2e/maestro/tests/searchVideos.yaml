appId: co.openvine.app.staging
---
#TC to search for a video,
# given the user is logged in in the app,
# based on its description and validate its playback
#Steps:
# 1. Open the current search screen.
# 2. Enter VIDEO_TITLE and wait for a video result.
# 3. Open the first video and validate playback.

# 1. Open search from Explore and validate the current search chrome.
- tapOn:
    id: explore_search_bar
- runFlow: ../asserts/assertSearch.yaml

# 2. Enter VIDEO_TITLE and wait for a video result.
- tapOn:
    id: search_field
- inputText: ${VIDEO_TITLE}

# 3. Open the first video result and validate playback.
- extendedWaitUntil:
    visible:
      id: search_video_tile_0
    timeout: 30000
- tapOn:
    id: search_video_tile_0
- runFlow: ../asserts/assertVideoPlayback.yaml
