appId: co.openvine.app.staging
tags:
  - recorder
---
#TC to drive the lip-sync control rail,
# given the recorder is open on an idle lip-sync viewfinder with a sound picked
# (lipSyncModePickSound) and no clips,
# validate each control actually changes recorder state, and leave every one
# of them back on its default.
#
# Lip-sync declares the same `supportsCountdownTimer`,
# `supportsVideoStabilization` and `supportsGhostFrame` as capture and captures
# no stills, so its rail is capture's rail exactly — same six controls, same
# order, same behaviour.
# It therefore runs the same ../utils/driveCaptureRail.yaml, which is where
# the selector mechanics and the `enabled` guards are documented.
#
# Preconditions are capture's too: no clips (the aspect-ratio control is
# disabled once the session holds one) and real camera hardware for the lens
# switch. The flow therefore drives the rail after picking a sound, which is
# what brings the viewfinder up, and before lipSyncModeRecordClip records.
#Steps:
# 1. Drive every rail control and restore it
# 2. Validate the idle lip-sync viewfinder is unchanged

- runFlow: ../utils/driveCaptureRail.yaml

# Everything back to default — and still lip-sync, which is the part the
# shared rail util cannot assert for itself.
- runFlow: ../asserts/assertLipSyncViewfinder.yaml
