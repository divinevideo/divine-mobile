appId: co.openvine.app.staging
---
# TC to use the experimental account-switching entry point as the replacement
# for the removed destructive logout journey.

# 1. Enable the user-visible experiment.
- runFlow: ../utils/openSettings.yaml
- scrollUntilVisible:
    element:
      id: experimental_features_tile
    direction: DOWN
    timeout: 30000
- tapOn:
    id: experimental_features_tile
- scrollUntilVisible:
    element:
      id: feature_flag_account_switching
    direction: DOWN
    timeout: 30000
- tapOn:
    id: feature_flag_account_switching
- tapOn:
    id: back_button

# 2. Open the account switcher.
- scrollUntilVisible:
    element:
      id: account_switch_action
    direction: UP
    timeout: 30000
- tapOn:
    id: account_switch_action

# 3. Leave the current session without removing its remembered account.
#
# The header button above only opens the switcher sheet -- with a single
# known account, that account's own row is a deliberate no-op. "Add another
# account" is the only control in the sheet that signs out, and so the only
# route from here to the welcome screen.
- extendedWaitUntil:
    visible:
      id: add_account_action
    timeout: 30000
- tapOn:
    id: add_account_action

# 4. The returning-user welcome screen proves that the account was retained.
- extendedWaitUntil:
    visible:
      id: continue_as_button
    timeout: 30000
- assertVisible:
    id: use_another_account_button

# 5. Continue with the remembered account so the regression suite can proceed.
- tapOn:
    id: continue_as_button
- extendedWaitUntil:
    visible:
      id: home_tab
    timeout: 30000
