appId: co.openvine.app.staging
---
# TC to open the current Edit Profile screen from the own-profile pencil.
#Steps:
# 1. Open Edit Profile from its only current entry point.
- tapOn:
    id: profile_tab
- extendedWaitUntil:
    visible:
      id: edit_profile_button
    timeout: 30000
- tapOn:
    id: edit_profile_button
- runFlow: ../asserts/assertEditYourProfile.yaml

# 2. Cancel returns to the own profile.
- tapOn: Cancel
- extendedWaitUntil:
    visible:
      id: edit_profile_button
    timeout: 30000

# 3. The entry point remains usable after returning.
- tapOn:
    id: edit_profile_button
- runFlow: ../asserts/assertEditYourProfile.yaml
