appId: co.openvine.app.staging
tags:
  - auth
---
#TC to create an account on a freshly installed app
#Steps:
# 1. Open the app in clear state: the welcome screen is displayed
# 2. Create a new account, declining the backup and multi-device prompts:
#    the user lands on Explore / New

# 1. Open the app in clear state
- launchApp:
    clearState: true
- runFlow: "../asserts/assertSplash.yaml"
- runFlow: "../asserts/assertLogin.yaml"

# 2. Create a new account.
#
# Targeted by id: this button's copy differs between the fresh-install and
# returning-user variants of the welcome screen ("Create a new Divine
# account" vs the short form), and both have changed since these flows were
# written. The id is the same on both branches.
- tapOn:
    id: "create_account_button"
- tapOn:
    id: "use_without_backup_button"
- tapOn:
    id: "use_device_only_button"

# 3. Wait for the authenticated shell without waiting for every loading
# animation. The empty-following redirect normally lands on Explore, but it is
# cache-derived and deliberately falls back to Home. Retrying the explicit tab
# selection also absorbs taps swallowed while the shell is still warming up.
- extendedWaitUntil:
    visible:
      id: "home_tab"
    timeout: 30000

- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "explore_tab"
      - assertVisible:
          id: "explore_search_bar"

- runFlow: ../asserts/assertExploreNew.yaml
