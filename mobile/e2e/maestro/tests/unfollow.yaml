appId: co.openvine.app.staging
tags:
  - Social
---
# TC to unfollow a creator from the profile More sheet. The feed follow
# button deliberately disappears once the viewer follows someone.

# 1. Open a creator video from Explore.
- doubleTapOn:
    id: explore_tab
    delay: 100
- runFlow: ../asserts/assertExploreNew.yaml
- waitForAnimationToEnd
- assertVisible:
    text: ${VIDEO_DATA}
- tapOn:
    id: play_button
    index: 0
- runFlow: "../asserts/assertVideoUser&Description.yaml"

# 2. Open the creator profile and use its More-sheet action.
- tapOn:
    id: video_author_name
- extendedWaitUntil:
    visible:
      id: profile_more_button
    timeout: 30000
- tapOn:
    id: profile_more_button

# Wait for the row itself, not just the sheet. It renders only when the
# viewer already follows this creator, and the sheet slides up while its
# content runs its own size/opacity transition -- a tap whose coordinates
# were resolved mid-slide lands on whatever ends up under them, which here
# is Report and then Block.
- extendedWaitUntil:
    visible:
      id: profile_unfollow_action
    timeout: 30000
- tapOn:
    id: profile_unfollow_action

# 3. Verify the direct outcome, independent of the viewer's total follow count.
#
# By id, not by the word "Follow": the button's label comes from
# `profileFollowLabel`, so matching the string binds this flow to English and
# to whatever product does to that copy next.
- extendedWaitUntil:
    visible:
      id: profile_follow_action
    timeout: 30000
