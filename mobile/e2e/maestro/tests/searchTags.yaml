appId: co.openvine.app.staging
---
#TC to search with tags,
# given the user is logged in in the app,
# based on the tag name and validate its playback
#Steps:
# 1. Open the current search screen.
# 2. Enter SEARCH_TAG and validate the matching tag chip.
# 3. Open the tag and validate its video grid.
# 4. Open the first video and validate playback.

# 1. Open search from Explore and validate the current search chrome.
- tapOn:
    id: explore_search_bar
- runFlow: ../asserts/assertSearch.yaml

# 2. Enter SEARCH_TAG and wait for the matching tag chip.
- tapOn:
    id: search_field
- inputText: ${SEARCH_TAG}

- extendedWaitUntil:
    visible:
      id: search_tag_${SEARCH_TAG}
    timeout: 30000

# 3. Open the tag and validate its video grid.
- tapOn:
    id: search_tag_${SEARCH_TAG}
- extendedWaitUntil:
    visible:
      id: video_thumbnail_0
    timeout: 30000

# 4. Open the first result and validate playback.
- tapOn:
    id: video_thumbnail_0
- runFlow: ../asserts/assertVideoPlayback.yaml
