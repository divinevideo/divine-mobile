appId: co.openvine.app.staging
---
#TC to check that the user can login
# given that the app is closed
# and user has existing keys.
#Steps:
# 1. Open the app in clear state
# 2. Open the import identity flow through Sign in
# 3. Insert an invalid key for the user: Message invalid key is displayed
# 4. Insert a valid key and relaunch into the authenticated shell
# 5. Open the imported identity's profile.

# 1. Open the app in clear state
- launchApp:
    clearState: true
- runFlow: "../asserts/assertSplash.yaml"

# 2. Open the sign-in screen, then the import-identity flow.
- tapOn:
    id: sign_in_button
- runFlow: "../asserts/assertSignIn.yaml"
- tapOn: Import Nostr key
- runFlow: "../asserts/assertImportIdentity.yaml"

# 3. Insert an invalid key for the user: Message invalid key is displayed
- tapOn: Private key or bunker URL
- inputText: "sec16fvy70pyfw7cjegt4wry24z4nwaleqanrkwputmy5na0wrdyak4sdkn8l2"
- tapOn: Import Nostr key
- assertVisible: Invalid format. Use nsec..., hex, ncryptsec1..., or bunker://...
- eraseText: 64

# 4. Insert a valid key, dismiss the keyboard, and import it.
- inputText: "${USER_KEYS}"
# Dismiss the optional OS prompt and the displayed keypad.
- tapOn:
    text: "Continue"
    optional: true
- runFlow: ../utils/hideKeyboard.yaml
# Import keys.
- tapOn: Import Nostr key
# Import completes in place. Relaunch so startup restores the authenticated
# session, then validate the shell.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home_tab
    timeout: 30000
- runFlow: "../asserts/assertHome.yaml"

# 5. Tap on profile: validate the imported identity reaches its own profile.
- doubleTapOn:
    id: profile_tab
    delay: 100
- runFlow: "../asserts/assertProfile.yaml"
