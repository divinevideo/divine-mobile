appId: co.openvine.app.staging
---
# Verify the maintained own-profile and edit-profile journey. The previous
# library labels, top-bar labels, and iOS-only share-sheet selectors described
# surfaces that no longer exist consistently across platforms.

# Wait for a relaunch to restore the authenticated shell, then open profile.
- extendedWaitUntil:
    visible:
      id: profile_tab
    timeout: 30000
- tapOn:
    id: profile_tab
- runFlow: ../asserts/assertProfile.yaml

# Open the profile editor through its stable action identifier.
- tapOn:
    id: edit_profile_button
- runFlow: ../asserts/assertEditProfileModal.yaml

# Return to the own profile and prove the shell is restored.
- tapOn:
    id: back_button
- assertVisible:
    id: settings_button
