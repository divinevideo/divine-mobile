appId: co.openvine.app.staging
name: Local username check and claim
tags:
  - local-stack
---
# Run only via local_stack/test_username_ui.sh, which builds DEFAULT_ENV=LOCAL
# and seeds localtaken in the local registry before installing the app.
- assertTrue: ${typeof LOCAL_USERNAME !== 'undefined' && LOCAL_USERNAME !== ''}
# These are local registry fixtures, not product copy.
- evalScript: ${output.reservedUsername = 'admin'; output.takenUsername = 'localtaken'}
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: create_account_button
    timeout: 30000
- tapOn:
    id: create_account_button
- tapOn:
    id: use_without_backup_button
- tapOn:
    id: use_device_only_button
- extendedWaitUntil:
    visible:
      id: profile_tab
    timeout: 30000
- tapOn:
    id: profile_tab
- extendedWaitUntil:
    visible:
      id: edit_profile_button
    timeout: 30000
- tapOn:
    id: edit_profile_button
- tapOn: Display Name
- inputText: Local username tester
- tapOn: Username (Optional)
- inputText: ${output.reservedUsername}
- scrollUntilVisible:
    element: Username is reserved
    direction: DOWN
    timeout: 15000
- assertVisible: Username is reserved
- eraseText
- inputText: ${output.takenUsername}
- scrollUntilVisible:
    element: Username already taken
    direction: DOWN
    timeout: 15000
- assertVisible: Username already taken
- eraseText
- inputText: ${LOCAL_USERNAME}
- scrollUntilVisible:
    element: Username available!
    direction: DOWN
    timeout: 15000
- assertVisible: Username available!
- hideKeyboard
- scrollUntilVisible:
    element: Save
    direction: DOWN
- tapOn: Save
- extendedWaitUntil:
    visible:
      id: edit_profile_button
    timeout: 30000
- tapOn:
    id: edit_profile_button
- tapOn: Username (Optional)
- assertVisible: ${LOCAL_USERNAME}
