appId: co.openvine.app.staging
tags:
  - recorder
---
#TC to record a lip-sync clip against a picked sound,
# given the recorder is open on an idle lip-sync viewfinder with a sound picked
# (lipSyncModePickSound) and no clips,
# validate recording against it produces a clip, and delete it again.
#
# Needs real camera hardware, like every recording test: without it the bloc
# never reports `isCameraInitialized` and the record button stays disabled.
#
# Tap-to-toggle recording applies here as it does in capture mode:
# `HoldToRecordPreferenceService` defaults to false, and a device where a
# previous session turned it on will hang on the first wait.
#Steps:
# 1. Record a clip
# 2. Delete it again

# 1. Record. The sound plays under the recording but does not end it; once a
# sound is picked, lip-sync uses the same tap-to-toggle capture stack.
- runFlow: ../utils/recordCaptureClip.yaml

# 2. Delete it again. This is teardown, not just symmetry: a clip left behind
# is written to the clip library and survives the run, so the next one would
# start with a non-empty session and fail assertLipSyncViewfinder.
#
# The sound stays picked, which is fine — a relaunch clears the editor's
# selection anyway.
- runFlow: ../utils/deleteLastRecorderClip.yaml
- runFlow: ../asserts/assertLipSyncViewfinder.yaml
