appId: co.openvine.app.staging
---
# Lip-sync mode before a sound is picked: the sound picker stands where the
# viewfinder goes, with the recorder's close button pinned left of its
# categories. A lip-sync video starts from its sound, so none of the camera
# chrome is up until one is picked; that state is assertLipSyncViewfinder.

# Mode wheel with Lip Sync armed. `selected` is load-bearing: the wheel renders
# an entry for every mode in every mode, so a bare id assertion here passes
# just as happily on the Capture tab.
- assertVisible:
    id: camera_mode_lipSync
    selected: true
- assertVisible:
    id: camera_close_button
- assertVisible:
    id: camera_library_button

# The picker itself.
- assertVisible:
    id: audio_search_field

# No viewfinder yet: no shutter, no control rail, and no sound chip.
- assertNotVisible:
    id: camera_record_button
- assertNotVisible:
    id: camera_flash_button
- assertNotVisible:
    id: audio_chip
