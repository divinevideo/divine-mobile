appId: co.openvine.app.staging
---
# Capture mode, idle: the viewfinder chrome is up and no clip is recorded yet.

# Mode wheel with Capture armed. `selected` is load-bearing: the wheel renders
# an entry for every mode in every mode, so a bare id assertion here passes
# just as happily on the Upload tab.
- assertVisible:
    id: camera_mode_capture
    selected: true
- assertVisible:
    id: camera_record_button
- assertVisible:
    id: camera_close_button
- assertVisible:
    id: camera_library_button

# Control rail, top to bottom. Timer and stabilization are rendered only by
# the modes that declare `supportsCountdownTimer` / `supportsVideoStabilization`
# (capture and lip-sync), so this set is also what separates capture mode from
# classic and stop-motion. The ghost-frame toggle is shared with both of them.
- assertVisible:
    id: camera_flash_button
- assertVisible:
    id: camera_timer_button
- assertVisible:
    id: camera_ghost_frame_button
- assertVisible:
    id: camera_aspect_ratio_button
- assertVisible:
    id: camera_switch_camera_button
- assertVisible:
    id: camera_stabilization_button

# Lip-sync renders this exact rail, and differs only by the sound picker it
# puts in the top bar's center slot — which capture mode leaves empty. Without
# this line every assertion in this file passes on the Lip Sync tab too.
- assertNotVisible:
    id: audio_chip

# What stop-motion adds and capture does not render: the grid toggle and the
# shot budget in that same center slot. Unlike the line above these are not
# load-bearing for telling the screens apart — each rail has a control the
# other lacks, so this file already fails on a stop-motion viewfinder at
# `camera_timer_button`. They are a leak guard, the mirror of the pair
# assertStopMotionMode carries: a control starting to render in a mode that
# does not declare it fails a run rather than passing quietly.
- assertNotVisible:
    id: camera_grid_button
- assertNotVisible:
    id: camera_stop_motion_budget

# And classic's shutter, which is the other half of why it gets an id of its
# own rather than reusing `camera_record_button`: the record button is pinned
# absent in assertClassicMode and this one absent in every capture-stack mode,
# so the pair is what proves which stack is up.
- assertNotVisible:
    id: camera_classic_shutter

# Nothing recorded yet. Both buttons sit inside an AnimatedOpacity, and
# RenderAnimatedOpacity drops its child from the semantics tree at opacity 0 —
# so "not visible" here means "no clip in the session", not "scrolled away".
- assertNotVisible:
    id: camera_next_button
- assertNotVisible:
    id: camera_delete_clip_button
