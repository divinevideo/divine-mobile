appId: co.openvine.app.staging
---
# Capture mode, idle: the viewfinder chrome is up and no clip is recorded yet.
#
# The color mask button is left out on purpose: the rail offers it only where
# the renderer can key the viewfinder live, so it is there on some test devices
# and not on others.

# Mode wheel with Capture armed. `selected` is load-bearing: the wheel renders
# an entry for every mode in every mode, so a bare id assertion here passes
# just as happily on the Upload tab.
- assertVisible:
    id: camera_mode_capture
    selected: true
- assertVisible:
    id: camera_record_button
- assertVisible:
    id: camera_close_button
- assertVisible:
    id: camera_library_button

# Control rail, folded as the recorder opens it: flash, the lens switch,
# aspect ratio and the button that unfolds it. Every flow that unfolds the
# rail folds it back, and a take folds it too, so this holds wherever the
# assert runs.
- assertVisible:
    id: camera_flash_button
- assertVisible:
    id: camera_switch_camera_button
- assertVisible:
    id: camera_aspect_ratio_button
- assertVisible:
    id: camera_rail_options_button
- assertNotVisible:
    id: camera_timer_button

# The rest of the rail, unfolded. Stabilization is rendered only by the modes
# that declare `supportsVideoStabilization` (capture), and the timer by those
# that declare `supportsCountdownTimer` (capture and stop-motion), so this set
# is also what separates capture mode from classic and stop-motion. The
# ghost-frame and grid toggles are shared with both of them.
- runFlow: ../utils/unfoldCaptureRail.yaml
- assertVisible:
    id: camera_ghost_frame_button
- assertVisible:
    id: camera_grid_button
- assertVisible:
    id: camera_stabilization_button
- runFlow: ../utils/foldCaptureRail.yaml

# The sound chip, in the top bar's center slot. Stop-motion renders the same
# stack and fills that slot with its shot budget instead, and
# assertStopMotionMode pins the chip absent there. A session recorded without
# a sound hides it, which is the other reason this file only holds with no
# clip recorded.
- assertVisible:
    id: audio_chip

# What stop-motion adds and capture does not render: the shot budget in that
# same center slot. Unlike the line above this is not load-bearing for telling
# the screens apart — this file already fails on a stop-motion viewfinder at
# `camera_stabilization_button`. It is a leak guard, the mirror of the one
# assertStopMotionMode carries: a control starting to render in a mode that
# does not declare it fails a run rather than passing quietly.
- assertNotVisible:
    id: camera_stop_motion_budget

# And classic's shutter, which is the other half of why it gets an id of its
# own rather than reusing `camera_record_button`: the record button is pinned
# absent in assertClassicMode and this one absent in every capture-stack mode,
# so the pair is what proves which stack is up.
- assertNotVisible:
    id: camera_classic_shutter

# Nothing recorded yet. Both buttons sit inside an AnimatedOpacity, and
# RenderAnimatedOpacity drops its child from the semantics tree at opacity 0 —
# so "not visible" here means "no clip in the session", not "scrolled away".
- assertNotVisible:
    id: camera_next_button
- assertNotVisible:
    id: camera_delete_clip_button
