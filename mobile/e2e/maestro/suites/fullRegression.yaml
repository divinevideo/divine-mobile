appId: co.openvine.app.staging
name: Divine regression test
# Account credentials and content fixtures are NOT committed. Supply them at
# run time. If full-regression CI is restored, it should read them from the
# `maestro_e2e_credentials` Codemagic group:
#
#   maestro test \
#     -e USER_KEYS=nsec1... \
#     -e SEARCH_USER=... -e SEARCH_USER_ID=user_profile_tile_<hex> \
#     -e VIDEO_USER=... -e VIDEO_DESCRIPTION=... -e VIDEO_DATA=... \
#     -e EXISTING_USERNAME=... \
#     e2e/maestro/suites/fullRegression.yaml
#
# The preflight block below fails the run when any of them is missing. An
# absent variable resolves to `undefined` rather than erroring, so without
# that guard the suite would run against garbage selectors and report a
# misleading failure deep inside a flow.
env:
  VIDEO_TITLE: "time to" # Setting the video title parameter
  SEARCH_TAG: "comedy"
  COMMENT: "Automated comment"
  DISPLAY_NAME: "AutomationUser"
  USER_BIO: "AutomationUser bio"
  USER_NAME: "Automation User"
  USER_wKEYS_NAME: "AutomationUser wKeys"
  USER_wKEYS_BIO: "Profile used for testing sign-in with existing keys"
---
#Preflight: every run-time credential must be supplied via -e
- assertTrue: ${typeof USER_KEYS !== 'undefined' && USER_KEYS !== ''}
- assertTrue: ${typeof SEARCH_USER !== 'undefined' && SEARCH_USER !== ''}
- assertTrue: ${typeof SEARCH_USER_ID !== 'undefined' && SEARCH_USER_ID !== ''}
- assertTrue: ${typeof VIDEO_USER !== 'undefined' && VIDEO_USER !== ''}
- assertTrue: ${typeof VIDEO_DESCRIPTION !== 'undefined' && VIDEO_DESCRIPTION !== ''}
- assertTrue: ${typeof VIDEO_DATA !== 'undefined' && VIDEO_DATA !== ''}
- assertTrue: ${typeof EXISTING_USERNAME !== 'undefined' && EXISTING_USERNAME !== ''}

#Social interaction tests
- runFlow: ../flows/followFlow.yaml
- runFlow: ../flows/likeFlow.yaml
- runFlow: ../flows/commentFlow.yaml

#Search tests
- runFlow: ../flows/searchVideoFlow.yaml
- runFlow: ../flows/searchUserFlow.yaml
- runFlow: ../flows/searchTagFlow.yaml

#Navigation tests
- runFlow: ../flows/profileNavigationFlow.yaml

#Account data management tests
- runFlow: ../tests/loginFreshInstall.yaml
- runFlow: ../tests/removeKeys.yaml
- runFlow: ../tests/loginFreshInstall.yaml
- runFlow: ../tests/accountSwitching.yaml
- runFlow: ../tests/backupYourKey.yaml
- runFlow:
    file: ../tests/loginExistingKeys.yaml
    env:
      USER_NAME: ${USER_wKEYS_NAME}
      USER_BIO: ${USER_wKEYS_BIO}
- runFlow: ../tests/editProfile.yaml
- runFlow: ../tests/userAlreadyTaken.yaml

#Tear down
- killApp
