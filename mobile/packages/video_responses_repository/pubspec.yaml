name: video_responses_repository
description: >
  The videos responding to a Divine video — its video replies, and the videos
  that joined the Add yours chain it starts — and the replies its creator
  pinned or hid.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  equatable: ^2.0.5
  funnelcake_api_client:
    path: ../funnelcake_api_client
  models:
    path: ../models
  nostr_client:
    path: ../nostr_client
  nostr_sdk:
    path: ../nostr_sdk

dev_dependencies:
  mocktail: ^1.0.4
  test: ^1.26.3
  very_good_analysis: ^10.2.0
