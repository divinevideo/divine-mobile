name: divine_video_player
description: >-
  Seamless multi-clip video player using native platform APIs.
  Supports Android (Media3/ExoPlayer), iOS (AVFoundation), and
  macOS (AVFoundation).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path_provider: ^2.1.5
  unified_logger:
    path: ../unified_logger
  web: ^1.1.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.0
  very_good_analysis: ^10.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.divinevideo.divine_video_player
        pluginClass: DivineVideoPlayerPlugin
      ios:
        pluginClass: DivineVideoPlayerPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: DivineVideoPlayerPlugin
        sharedDarwinSource: true
      linux:
        dartPluginClass: DivineVideoPlayerLinuxPlugin
      web:
        pluginClass: DivineVideoPlayerWebPlugin
        fileName: src/web/divine_video_player_web_plugin.dart
