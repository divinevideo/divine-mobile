name: divine_desktop_video_editor
description: Native desktop media processing behind the existing editor API.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  # The native wire contract is verified against this SDK version.
  pro_video_editor: 2.54.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: DivineDesktopVideoEditorPlugin
      windows:
        pluginClass: DivineDesktopVideoEditorPluginCApi
