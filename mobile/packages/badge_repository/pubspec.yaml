name: badge_repository
description: >
  NIP-58 badge repository — parses badge definitions, awards, and profile
  badges, and drives the badge dashboard (accept, hide, remove awards; issued
  badge recipient acceptance).
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  meta: ^1.17.0
  nostr_client:
    path: ../nostr_client
  nostr_sdk:
    path: ../nostr_sdk
  shared_preferences: ^2.5.3
  text_sanitizer:
    path: ../text_sanitizer
  unified_logger:
    path: ../unified_logger

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.2.0
