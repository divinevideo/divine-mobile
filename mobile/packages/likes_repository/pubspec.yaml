name: likes_repository
description: Repository for managing user likes (Kind 7 reactions) with Nostr.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  db_client:
    path: ../db_client
  equatable: ^2.0.5
  funnelcake_api_client:
    path: ../funnelcake_api_client
  meta: ^1.16.0
  nostr_client:
    path: ../nostr_client
  nostr_sdk:
    path: ../nostr_sdk
  rxdart: ^0.28.0
  unified_logger:
    path: ../unified_logger

dev_dependencies:
  drift: ^2.34.0
  mocktail: ^1.0.4
  # Test-only: names PaginatedPubkeys when stubbing the Funnelcake client.
  models:
    path: ../models
  # Test-only: a real NostrClient publish reads the NIP-89 client-tag
  # preference, which the relay-read tests back with a mock store.
  shared_preferences: ^2.5.3
  test: ^1.26.3
  very_good_analysis: ^10.0.0
