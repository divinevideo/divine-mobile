name: publishing_suggestions
description: On-device publishing ideas and curated offline suggestions.
version: 0.0.1
publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: ^3.47.0
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
flutter:
  plugin:
    platforms:
      android:
        package: co.openvine.publishing_suggestions
        pluginClass: PublishingSuggestionsPlugin
      ios:
        pluginClass: PublishingSuggestionsPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: PublishingSuggestionsPlugin
        sharedDarwinSource: true
