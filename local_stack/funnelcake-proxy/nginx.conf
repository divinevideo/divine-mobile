server {
    listen 80;

    # Scheduled posts live in the relay, not the API (#3538). An exact match
    # and the longer prefix both beat `/api/`, so POST/GET /api/schedule and
    # DELETE /api/schedule/{event_id} reach the relay's handlers. The relay
    # builds the URL it verifies the NIP-98 token against from the forwarded
    # host and scheme, so both headers have to survive the hop.
    location = /api/schedule {
        proxy_pass http://funnelcake-relay:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/schedule/ {
        proxy_pass http://funnelcake-relay:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API — proxy to funnelcake-api
    location /api/ {
        proxy_pass http://funnelcake-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else (WebSocket relay) — proxy to funnelcake-relay
    location / {
        proxy_pass http://funnelcake-relay:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
