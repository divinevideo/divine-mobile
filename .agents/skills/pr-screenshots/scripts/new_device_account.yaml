# ABOUTME: Maestro flow that clears the app and creates a fresh device-only account (no Keycast, no email).
# ABOUTME: Run: maestro test -e APP_ID=<bundle id> new_device_account.yaml
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: create_account_button
    timeout: 60000
- tapOn:
    id: create_account_button
- tapOn:
    id: use_without_backup_button
- tapOn:
    id: use_device_only_button
- extendedWaitUntil:
    visible:
      id: profile_tab
    timeout: 60000
# iOS asks for notification permission shortly after sign-in.
- tapOn:
    text: "Don’t Allow"
    optional: true
