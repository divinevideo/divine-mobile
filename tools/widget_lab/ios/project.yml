name: WidgetLab
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_ENTITLEMENTS: Lab.entitlements
    CODE_SIGN_IDENTITY: '-'
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  WidgetLab:
    type: application
    platform: iOS
    sources:
      - Host
      - Shared
      - path: Media/Clips
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: video.divine.widgetlab
        INFOPLIST_KEY_CFBundleDisplayName: Divine Widget Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: .generated/Host-Info.plist
      properties:
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        CFBundleURLTypes:
          - CFBundleURLSchemes: [divinewidgetlab]
    dependencies:
      - target: HighlightWidget
  HighlightWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
      - path: Media/Frames.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: video.divine.widgetlab.highlights
        INFOPLIST_KEY_CFBundleDisplayName: Divine Highlights Lab
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: .generated/Widget-Info.plist
      properties:
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  WidgetLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: video.divine.widgetlab.uitests
        CODE_SIGN_ENTITLEMENTS: ''
    dependencies:
      - target: WidgetLab
schemes:
  WidgetLab:
    build:
      targets:
        WidgetLab: all
    test:
      targets: [WidgetLabUITests]
